<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Center — JMB Signal Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ═══ SIGNAL DECK — a look no other JMB tool uses: obsidian glass over aurora light ═══ */
:root{
  --bg:#0b0e14; --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --t1:#eef2f9; --t2:#9aa7bd; --t3:#5d6a80;
  --up:#34f5a1; --dn:#ff5470; --warn:#ffc93a;
  --reddit:#ff5d3a; --x:#c9d6f2; --ig:#ff4da6; --snap:#ffe63a; --nf:#7cf5c8; --altr:#58c7ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(124,58,237,.16), transparent 60%),
    radial-gradient(700px 420px at -10% 30%, rgba(14,165,233,.12), transparent 55%),
    radial-gradient(800px 500px at 60% 110%, rgba(255,77,166,.08), transparent 60%),
    var(--bg);
  color:var(--t1); font:14px/1.5 'Space Grotesk',system-ui,sans-serif;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:26px 26px}
.mono{font-family:'JetBrains Mono',monospace}
::selection{background:rgba(88,199,255,.35)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ── gate ── */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:inherit}
.gate-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:30px 30px 26px;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.gate-card h1{font-size:22px;letter-spacing:.02em}
.gate-card .gsub{color:var(--t2);font-size:12.5px;margin:4px 0 20px}
.gtabs{display:flex;gap:8px;margin-bottom:16px}
.gtab{flex:1;text-align:center;padding:9px;border:1px solid var(--line);border-radius:11px;cursor:pointer;
  font-weight:600;font-size:12.5px;color:var(--t2)}
.gtab.on{border-color:rgba(88,199,255,.6);color:#bfe7ff;background:rgba(88,199,255,.08)}
.gate-card input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:var(--t1);
  border-radius:11px;padding:11px 13px;font:14px 'Space Grotesk',sans-serif;margin-bottom:10px}
.gate-card input:focus{outline:none;border-color:rgba(88,199,255,.65);box-shadow:0 0 0 3px rgba(88,199,255,.15)}
.gbtn{width:100%;padding:12px;border:none;border-radius:11px;cursor:pointer;font:700 14px 'Space Grotesk',sans-serif;
  color:#06121c;background:linear-gradient(120deg,#58c7ff,#34f5a1);letter-spacing:.02em}
.gbtn:disabled{opacity:.55}
.gerr{color:var(--dn);font-size:12px;margin-top:10px;display:none}

/* ── shell ── */
#app{display:none;min-height:100vh}
.deck{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
@media(max-width:860px){.deck{grid-template-columns:1fr}.rail{position:sticky;top:0;z-index:20;flex-direction:row!important;overflow-x:auto;border-right:none!important;border-bottom:1px solid var(--line)}}
.rail{display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);
  background:rgba(0,0,0,.25);backdrop-filter:blur(10px)}
.brand{padding:4px 10px 16px}
.brand b{font-size:15px;letter-spacing:.06em}
.brand span{display:block;font-size:10px;color:var(--t3);letter-spacing:.28em;text-transform:uppercase;margin-top:2px}
.rl{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;cursor:pointer;
  color:var(--t2);font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.rl:hover{background:var(--panel2)}
.rl.on{background:var(--panel2);border-color:var(--line2);color:var(--t1)}
.rl .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.rl .n{margin-left:auto;font-size:11px;color:var(--t3)}
.rl.on .n{color:var(--t2)}
.railsep{height:1px;background:var(--line);margin:10px 8px}

.main{padding:22px 26px 60px;max-width:1500px}
.tops{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tops h2{font-size:19px;letter-spacing:.02em;margin-right:auto}
.tops h2 em{font-style:normal;background:linear-gradient(90deg,#58c7ff,#a78bfa,#ff4da6);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.search{background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:11px;padding:9px 13px;
  color:var(--t1);font:13px 'Space Grotesk',sans-serif;width:210px}
.search:focus{outline:none;border-color:rgba(88,199,255,.6)}
select.ctl{background:#141926;border:1px solid var(--line2);border-radius:11px;color:var(--t1);
  padding:9px 11px;font:600 12.5px 'Space Grotesk',sans-serif;cursor:pointer}
.ib{background:var(--panel2);border:1px solid var(--line2);color:var(--t1);border-radius:11px;padding:9px 13px;
  cursor:pointer;font:700 12.5px 'Space Grotesk',sans-serif}
.ib:hover{border-color:rgba(88,199,255,.5)}

/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 15px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,#58c7ff);box-shadow:0 0 14px var(--kc,#58c7ff)}
.kpi b{display:block;font:800 23px/1.15 'JetBrains Mono',monospace}
.kpi span{font-size:10.5px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase}

/* grid of account tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px 11px;cursor:pointer;
  position:relative;overflow:hidden;transition:transform .12s, border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--line2)}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc);opacity:.9;box-shadow:0 0 16px var(--pc)}
.t-top{display:flex;align-items:center;gap:8px}
.t-plat{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pc)}
.t-fresh{margin-left:auto;font-size:10px;color:var(--t3)}
.t-handle{font-weight:700;font-size:15px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-sub{font-size:11px;color:var(--t3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-mid{display:flex;align-items:flex-end;gap:9px;margin-top:10px}
.t-num{font:800 21px/1 'JetBrains Mono',monospace}
.t-num small{font:600 9.5px 'Space Grotesk',sans-serif;color:var(--t3);display:block;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.delta{font:700 11px 'JetBrains Mono',monospace;padding:3px 8px;border-radius:8px;margin-left:auto}
.delta.up{color:var(--up);background:rgba(52,245,161,.1)}
.delta.dn{color:var(--dn);background:rgba(255,84,112,.1)}
.delta.flat{color:var(--t3);background:rgba(255,255,255,.05)}
.spark{margin-top:9px;height:34px;width:100%}
.t-foot{display:flex;gap:6px;align-items:center;margin-top:8px}
.spill{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2.5px 8px;border-radius:20px;text-transform:uppercase}
.flag{font-size:12px;margin-left:auto}
.t-owner{font-size:10.5px;color:var(--t3)}

/* drawer */
#drawer{position:fixed;top:0;right:-460px;bottom:0;width:min(440px,96vw);z-index:40;
  background:#10141d;border-left:1px solid var(--line2);box-shadow:-30px 0 80px rgba(0,0,0,.5);
  transition:right .22s ease;padding:24px 24px 30px;overflow:auto}
#drawer.open{right:0}
.d-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer}
.d-plat{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.d-handle{font-size:23px;font-weight:700;margin:2px 0 3px;word-break:break-all}
.d-sub{color:var(--t2);font-size:12.5px;margin-bottom:16px}
.d-chart{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
.d-chart h4{font-size:10.5px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.d-kv{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.d-cell{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.d-cell b{display:block;font:700 15px 'JetBrains Mono',monospace}
.d-cell span{font-size:9.5px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase}
.d-edit{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.d-edit h4{font-size:11px;color:var(--t2);margin-bottom:10px}
.d-edit .row{display:flex;gap:8px;margin-bottom:8px}
.d-edit input{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:var(--t1);border-radius:10px;
  padding:9px 11px;font:600 13px 'JetBrains Mono',monospace;width:100%}
.d-edit input:focus{outline:none;border-color:rgba(88,199,255,.6)}
.d-edit label{font-size:10px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
.d-save{width:100%;padding:11px;border:none;border-radius:10px;cursor:pointer;
  font:700 13px 'Space Grotesk',sans-serif;color:#06121c;background:linear-gradient(120deg,#58c7ff,#34f5a1)}
.d-link{display:inline-flex;align-items:center;gap:7px;color:#8fd6ff;text-decoration:none;font-size:13px;font-weight:600}
.d-link:hover{text-decoration:underline}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35;display:none}
#scrim.open{display:block}

.empty{color:var(--t3);text-align:center;padding:60px 20px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#141b2a;border:1px solid var(--line2);
  color:var(--t1);padding:10px 20px;border-radius:12px;font-size:12.5px;font-weight:600;opacity:0;
  pointer-events:none;transition:.2s;z-index:60;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast.on{opacity:1}
.who{font-size:11px;color:var(--t3);padding:8px 11px}
.who b{color:var(--t2)}
</style>
</head>
<body>

<!-- ═════ GATE ═════ -->
<div id="gate">
  <div class="gate-card">
    <h1>⬢ Account Center</h1>
    <div class="gsub">Every account, every platform, one frame. Admin &amp; CL7–9 leads only.</div>
    <div class="gtabs">
      <div class="gtab on" id="gt-lead" onclick="gateMode('lead')">Lead sign-in</div>
      <div class="gtab" id="gt-adm" onclick="gateMode('adm')">Admin</div>
    </div>
    <div id="g-lead">
      <input id="g-id" placeholder="Employee ID" autocomplete="off">
      <input id="g-pin" type="password" placeholder="PIN">
    </div>
    <div id="g-adm" style="display:none">
      <input id="g-pass" type="password" placeholder="Admin password">
    </div>
    <button class="gbtn" id="g-go" onclick="gateGo()">Enter the deck</button>
    <div class="gerr" id="g-err"></div>
  </div>
</div>

<!-- ═════ APP ═════ -->
<div id="app">
<div class="deck">
  <div class="rail" id="rail"></div>
  <div class="main">
    <div class="tops">
      <h2>⬢ <em>Signal Deck</em> <span style="font-size:11px;color:var(--t3);font-weight:400">· live account intelligence</span></h2>
      <input class="search" id="q" placeholder="Search handle / owner…" oninput="render()">
      <select class="ctl" id="sort" onchange="render()">
        <option value="move">Sort · biggest movers</option>
        <option value="num">Sort · highest number</option>
        <option value="fresh">Sort · recently updated</option>
        <option value="handle">Sort · handle A→Z</option>
      </select>
      <select class="ctl" id="live" onchange="render()">
        <option value="1">Active only</option>
        <option value="">Include dead</option>
      </select>
      <button class="ib" onclick="loadAll(true)">↻</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Nothing matches this view.</div>
  </div>
</div>
</div>

<div id="scrim" onclick="closeDrawer()"></div>
<div id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbwK8rVJlkv5YLgNLe7cGIz73KJc0hedmZcutoiRviDEowiZPglzBnznswBaZ0TVIV8t/exec';
var ALTR_API='https://script.google.com/macros/s/AKfycbxp7wcIf48urxm2DcPoNgdmQreYUGia-YNnXwIXfyMqOLkyWpaqI3hoMZa4VPmjZa9_Mg/exec';

var PLATS={
  reddit:{ n:'Reddit',   c:'var(--reddit)', metric:'karma',     link:function(h){return 'https://www.reddit.com/user/'+encodeURIComponent(h);} },
  x:     { n:'X',        c:'var(--x)',      metric:'followers', link:function(h){return 'https://x.com/'+encodeURIComponent(h.replace(/^@+/,''));} },
  ig:    { n:'Instagram',c:'var(--ig)',     metric:'followers', link:function(h){return 'https://www.instagram.com/'+encodeURIComponent(h.replace(/^@+/,''));} },
  snap:  { n:'Snapchat', c:'var(--snap)',   metric:'followers', link:function(h){return 'https://www.snapchat.com/add/'+encodeURIComponent(h);} },
  nf:    { n:'NewFans',  c:'var(--nf)',     metric:'followers', link:function(h){return null;} },
  altr:  { n:'ALTR · IG',c:'var(--altr)',   metric:'followers', link:function(h){return 'https://www.instagram.com/'+encodeURIComponent(h.replace(/^@+/,''));} }
};
var DEAD=['banned','suspended','tempban','closed','dead','archived'];
var STATUS_COLORS={ banned:'#ff5470', suspended:'#ff5470', tempban:'#ffc93a', recovery:'#ffc93a',
  warmup:'#ffc93a', warming:'#ffc93a', onhold:'#9aa7bd', reserved:'#9aa7bd', flagged:'#ffc93a', rest:'#9aa7bd' };

var AUTH=null;                  // {mode:'adm',pass} | {mode:'lead',id,pin}
var DATA={ accounts:[], metrics:{}, snaps:{}, names:{}, who:'' };
var VIEW='all';

/* ── gate ── */
function gateMode(m){
  document.getElementById('gt-lead').classList.toggle('on',m==='lead');
  document.getElementById('gt-adm').classList.toggle('on',m==='adm');
  document.getElementById('g-lead').style.display=(m==='lead')?'block':'none';
  document.getElementById('g-adm').style.display=(m==='adm')?'block':'none';
  window._gm=m;
}
window._gm='lead';
function authQS(){
  if(!AUTH) return '';
  return AUTH.mode==='adm' ? ('&pass='+encodeURIComponent(AUTH.pass))
       : ('&viewer_id='+encodeURIComponent(AUTH.id)+'&pin='+encodeURIComponent(AUTH.pin));
}
async function gateGo(){
  var btn=document.getElementById('g-go'), err=document.getElementById('g-err');
  err.style.display='none';
  var cand=(window._gm==='adm')
    ? { mode:'adm', pass:document.getElementById('g-pass').value }
    : { mode:'lead', id:document.getElementById('g-id').value.trim(), pin:document.getElementById('g-pin').value.trim() };
  if(cand.mode==='lead' && (!cand.id||!cand.pin)){ err.textContent='Enter your Employee ID and PIN.'; err.style.display='block'; return; }
  if(cand.mode==='adm' && !cand.pass){ err.textContent='Enter the admin password.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Checking…';
  AUTH=cand;
  var ok=await loadAll();
  btn.disabled=false; btn.textContent='Enter the deck';
  if(ok){
    try{ sessionStorage.setItem('acctc_auth', JSON.stringify(AUTH)); }catch(e){}
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    AUTH=null;
    err.textContent='Not authorized — wrong credentials, or not a CL7–9 lead.';
    err.style.display='block';
  }
}

/* ── data ── */
async function loadAll(isRefresh){
  try{
    if(isRefresh) toast('Refreshing…');
    var pMain=fetch(API+'?action=acct_center'+authQS()+'&_='+Date.now()).then(function(r){return r.json();});
    var pAltr=fetch(ALTR_API+'?action=state&_='+Date.now()).then(function(r){return r.json();}).catch(function(){return null;});
    var pNames=fetch(API+'?action=get_all_employees&_='+Date.now()).then(function(r){return r.json();}).catch(function(){return null;});
    var d=await pMain;
    if(!d || !d.ok){ return false; }
    DATA.who=d.who||'';
    DATA.metrics=d.metrics||{};
    DATA.snaps={};
    (d.snaps||[]).forEach(function(s){ (DATA.snaps[s[1]]=DATA.snaps[s[1]]||[]).push({d:s[0],f:s[2],k:s[3]}); });
    Object.keys(DATA.snaps).forEach(function(k){ DATA.snaps[k].sort(function(a,b){ return a.d<b.d?-1:1; }); });
    var accounts=(d.accounts||[]);
    var alt=await pAltr;
    if(alt && alt.accounts){
      alt.accounts.forEach(function(a){
        var h=String(a.handle||a.acct||'').trim(); if(!h) return;
        accounts.push({ key:('altr|altr|'+h).toLowerCase(), plat:'altr', tool:'ALTR Media', proj:'ALTR',
          handle:h, status:String(a.status||'active'), day:0, owner:'',
          followers_live:(parseInt(a.followers,10)||null), karma:null, link:a.link||'' });
      });
    }
    DATA.accounts=accounts;
    var nm=await pNames;
    if(nm && nm.employees){ nm.employees.forEach(function(e){ DATA.names[String(e.employee_id).toLowerCase()]=e.full_name||e.employee_id; }); }
    buildRail(); render();
    if(isRefresh) toast('Deck refreshed.');
    return true;
  }catch(e){ return false; }
}

/* ── derived numbers ── */
function numOf(a){
  var m=DATA.metrics[a.key]||{};
  var plat=PLATS[a.plat]||PLATS.nf;
  if(plat.metric==='karma'){
    var k=(a.karma!=null)?a.karma:(m.karma!=null?m.karma:null);
    return { v:k, label:'karma' };
  }
  var f=(m.followers!=null)?m.followers:(a.followers_live!=null?a.followers_live:null);
  return { v:f, label:'followers' };
}
function seriesOf(a){
  var sn=DATA.snaps[a.key]||[];
  var useK=(PLATS[a.plat]||{}).metric==='karma';
  var out=[]; sn.forEach(function(s){ var v=useK?s.k:s.f; if(v!=null) out.push({d:s.d,v:v}); });
  return out;
}
function deltaOf(a){
  var s=seriesOf(a); if(s.length<2) return null;
  var last=s[s.length-1];
  var target=null;
  for(var i=s.length-2;i>=0;i--){ target=s[i]; var days=(new Date(last.d)-new Date(s[i].d))/86400000; if(days>=6) break; }
  if(!target || target.v===last.v && s.length<2) return null;
  var base=target.v||0;
  var abs=last.v-target.v;
  var pct=base>0 ? (abs/base*100) : (abs>0?100:0);
  return { abs:abs, pct:pct };
}
function freshOf(a){
  var m=DATA.metrics[a.key]||{};
  var s=seriesOf(a);
  var at=m.at?new Date(String(m.at).replace(' ','T')):null;
  if(a.plat==='altr'||a.plat==='reddit'){ return s.length?'auto':'auto'; }
  if(!at||isNaN(at)) return s.length?'—':'no data';
  var ddays=Math.floor((Date.now()-at.getTime())/86400000);
  return ddays<=0?'today':(ddays+'d ago');
}
function isDead(a){ return DEAD.indexOf(String(a.status||'').toLowerCase())>=0; }
function flagOf(a){
  var d=deltaOf(a); if(!d) return '';
  if(d.pct>=20) return '🔥';
  if(d.pct<=-20) return '📉';
  return '';
}

/* ── rail ── */
function buildRail(){
  var counts={}; DATA.accounts.forEach(function(a){ if(!isDead(a)) counts[a.plat]=(counts[a.plat]||0)+1; });
  var total=DATA.accounts.filter(function(a){return !isDead(a);}).length;
  var html='<div class="brand"><b>⬢ ACCOUNT CENTER</b><span>Signal Deck</span></div>';
  function rl(id,label,color,n,icon){
    return '<div class="rl'+(VIEW===id?' on':'')+'" onclick="setView(\''+id+'\')">'+
      (color?('<span class="dot" style="background:'+color+';color:'+color+'"></span>'):('<span style="width:9px;text-align:center">'+icon+'</span>'))+
      '<span>'+label+'</span>'+(n!=null?('<span class="n">'+n+'</span>'):'')+'</div>';
  }
  html+=rl('all','Overview',null,total,'◎');
  html+=rl('movers','Movers',null,null,'🔥');
  html+=rl('stale','Stale numbers',null,null,'🕸');
  html+='<div class="railsep"></div>';
  Object.keys(PLATS).forEach(function(p){
    if(!counts[p]) return;
    html+=rl(p,PLATS[p].n,PLATS[p].c,counts[p],'');
  });
  html+='<div class="railsep"></div>';
  html+='<div class="who">signed in as <b>'+esc(DATA.who||'—')+'</b></div>';
  html+=rl('__out','Sign out',null,null,'⏻');
  document.getElementById('rail').innerHTML=html;
}
function setView(v){
  if(v==='__out'){ try{ sessionStorage.removeItem('acctc_auth'); }catch(e){} location.reload(); return; }
  VIEW=v; buildRail(); render();
}

/* ── render ── */
function render(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var sort=document.getElementById('sort').value;
  var liveOnly=!!document.getElementById('live').value;
  var rows=DATA.accounts.slice();
  if(liveOnly) rows=rows.filter(function(a){ return !isDead(a); });
  if(VIEW!=='all'&&VIEW!=='movers'&&VIEW!=='stale') rows=rows.filter(function(a){ return a.plat===VIEW; });
  if(VIEW==='movers') rows=rows.filter(function(a){ var d=deltaOf(a); return d && Math.abs(d.pct)>=20; });
  if(VIEW==='stale') rows=rows.filter(function(a){
    var pm=(PLATS[a.plat]||{}).metric;
    if(a.plat==='altr'||a.plat==='reddit') return false;      // auto-fed
    var m=DATA.metrics[a.key]||{};
    if(!m.at) return true;
    return (Date.now()-new Date(String(m.at).replace(' ','T')).getTime())>7*86400000;
  });
  if(q) rows=rows.filter(function(a){
    return a.handle.toLowerCase().indexOf(q)>=0 || (DATA.names[a.owner]||a.owner||'').toLowerCase().indexOf(q)>=0 || a.tool.toLowerCase().indexOf(q)>=0;
  });
  rows.sort(function(a,b){
    if(sort==='move'){ var da=deltaOf(a),db=deltaOf(b); return (db?Math.abs(db.pct):-1)-(da?Math.abs(da.pct):-1); }
    if(sort==='num'){ return (numOf(b).v||0)-(numOf(a).v||0); }
    if(sort==='handle'){ return a.handle.localeCompare(b.handle); }
    if(sort==='fresh'){ var ma=(DATA.metrics[a.key]||{}).at||'', mb=(DATA.metrics[b.key]||{}).at||''; return mb.localeCompare(ma); }
    return 0;
  });
  // KPIs
  var live=DATA.accounts.filter(function(a){return !isDead(a);});
  var fsum=0; live.forEach(function(a){ var n=numOf(a); if(n.label==='followers'&&n.v) fsum+=n.v; });
  var risers=0,fallers=0;
  live.forEach(function(a){ var d=deltaOf(a); if(d&&d.pct>=20)risers++; else if(d&&d.pct<=-20)fallers++; });
  var deadN=DATA.accounts.length-live.length;
  document.getElementById('kpis').innerHTML=
    kpi(live.length,'accounts live','#58c7ff')+
    kpi(fmtN(fsum),'followers tracked','#a78bfa')+
    kpi(risers,'🔥 rising fast', risers?'#34f5a1':'#5d6a80')+
    kpi(fallers,'📉 falling fast', fallers?'#ff5470':'#5d6a80')+
    kpi(deadN,'dead / suspended','#ff5470');
  // grid
  var g=document.getElementById('grid');
  g.innerHTML=rows.map(tile).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
}
function kpi(v,l,c){ return '<div class="kpi" style="--kc:'+c+'"><b>'+v+'</b><span>'+l+'</span></div>'; }
function fmtN(n){ if(n==null) return '—'; if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=10000) return (n/1000).toFixed(1)+'k'; return String(n); }
function tile(a){
  var p=PLATS[a.plat]||PLATS.nf;
  var n=numOf(a), d=deltaOf(a);
  var dHtml=d
    ? '<span class="delta '+(d.abs>0?'up':(d.abs<0?'dn':'flat'))+'">'+(d.abs>0?'▲':(d.abs<0?'▼':'•'))+' '+(Math.abs(d.pct)>=1?Math.abs(d.pct).toFixed(0)+'%':Math.abs(d.abs))+'</span>'
    : '<span class="delta flat">— 7d</span>';
  var st=String(a.status||'').toLowerCase();
  var sc=STATUS_COLORS[st]||'#34f5a1';
  var owner=DATA.names[a.owner]||a.owner||'';
  return '<div class="tile" style="--pc:'+p.c+'" onclick="openDrawer(\''+esc(a.key)+'\')">'+
    '<div class="t-top"><span class="t-plat">'+p.n+'</span><span class="flag">'+flagOf(a)+'</span><span class="t-fresh">'+freshOf(a)+'</span></div>'+
    '<div class="t-handle">'+esc(a.handle)+'</div>'+
    '<div class="t-sub">'+esc(a.tool)+(owner?(' · '+esc(owner.split(',')[0])):'')+'</div>'+
    '<div class="t-mid"><div class="t-num">'+fmtN(n.v)+'<small>'+n.label+'</small></div>'+dHtml+'</div>'+
    sparkSvg(seriesOf(a), p.c)+
    '<div class="t-foot"><span class="spill" style="color:'+sc+';background:'+sc+'1a">'+esc(a.status||'—')+'</span>'+
      (a.day?('<span class="t-owner">day '+a.day+'</span>'):'')+'</div>'+
  '</div>';
}
function sparkSvg(s, color){
  if(!s || s.length<2) return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><line x1="0" y1="30" x2="100" y2="30" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-dasharray="3 4"/></svg>';
  var vs=s.map(function(x){return x.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  var span=(mx-mn)||1;
  var pts=s.map(function(x,i){
    var px=(i/(s.length-1))*100;
    var py=30-((x.v-mn)/span)*26;
    return px.toFixed(1)+','+py.toFixed(1);
  });
  return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>'+
    '<polygon points="0,34 '+pts.join(' ')+' 100,34" fill="'+color+'" opacity=".07"/>'+
  '</svg>';
}

/* ── drawer ── */
var CUR=null;
function openDrawer(key){
  var a=DATA.accounts.filter(function(x){return x.key===key;})[0]; if(!a) return;
  CUR=a;
  var p=PLATS[a.plat]||PLATS.nf;
  var n=numOf(a), d=deltaOf(a), m=DATA.metrics[a.key]||{};
  var link=(a.link)||(p.link?p.link(a.handle):null);
  var owner=DATA.names[a.owner]||a.owner||'—';
  var canKarma=(p.metric==='karma');
  document.getElementById('drawer').innerHTML=
    '<button class="d-close" onclick="closeDrawer()">✕</button>'+
    '<div class="d-plat" style="color:'+p.c+'">'+p.n+' · '+esc(a.tool)+'</div>'+
    '<div class="d-handle">'+esc(a.handle)+'</div>'+
    '<div class="d-sub">'+esc(a.status||'—')+(a.day?(' · day '+a.day):'')+' · handled by '+esc(owner)+'</div>'+
    '<div class="d-chart"><h4>'+(canKarma?'Karma':'Followers')+' · last 15 days</h4>'+bigChart(seriesOf(a),p.c)+'</div>'+
    '<div class="d-kv">'+
      '<div class="d-cell"><b>'+fmtN(n.v)+'</b><span>current '+n.label+'</span></div>'+
      '<div class="d-cell"><b style="color:'+(d?(d.abs>0?'var(--up)':(d.abs<0?'var(--dn)':'var(--t2)')):'var(--t3)')+'">'+(d?((d.abs>0?'+':'')+fmtN(d.abs)):'—')+'</b><span>change · 7 days</span></div>'+
      '<div class="d-cell"><b>'+esc(freshOf(a))+'</b><span>number updated</span></div>'+
      '<div class="d-cell"><b>'+esc((m.by||'—'))+'</b><span>last updated by</span></div>'+
    '</div>'+
    '<div class="d-edit"><h4>✍️ Update the numbers (what the platform shows right now)</h4>'+
      '<div class="row">'+
        (canKarma
          ? '<div style="flex:1"><label>Karma</label><input id="ed-karma" inputmode="numeric" placeholder="'+(n.v!=null?n.v:'—')+'"></div>'
          : '<div style="flex:1"><label>Followers</label><input id="ed-fol" inputmode="numeric" placeholder="'+(n.v!=null?n.v:'—')+'"></div>')+
      '</div>'+
      '<button class="d-save" onclick="saveMetric()">Save → snapshot today</button>'+
    '</div>'+
    (link?('<a class="d-link" target="_blank" rel="noopener" href="'+esc(link)+'">↗ Open on '+p.n+'</a>'):'');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
function bigChart(s, color){
  if(!s||s.length<2) return '<div style="color:var(--t3);font-size:12px;padding:22px 4px;text-align:center">Not enough history yet — the daily snapshot builds this automatically.</div>';
  var vs=s.map(function(x){return x.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs), span=(mx-mn)||1;
  var pts=s.map(function(x,i){ return ((i/(s.length-1))*100).toFixed(1)+','+(44-((x.v-mn)/span)*36).toFixed(1); });
  return '<svg viewBox="0 0 100 50" style="width:100%;height:120px" preserveAspectRatio="none">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round"/>'+
    '<polygon points="0,50 '+pts.join(' ')+' 100,50" fill="'+color+'" opacity=".08"/>'+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--t3)" class="mono"><span>'+s[0].d.slice(5)+' · '+fmtN(mn)+'</span><span>'+s[s.length-1].d.slice(5)+' · '+fmtN(mx)+'</span></div>';
}
async function saveMetric(){
  if(!CUR) return;
  var f=document.getElementById('ed-fol'), k=document.getElementById('ed-karma');
  var fv=f?String(f.value).replace(/[^0-9]/g,''):'';
  var kv=k?String(k.value).replace(/[^0-9]/g,''):'';
  if(!fv&&!kv){ toast('Type the current number first.'); return; }
  try{
    var url=API+'?action=acct_metric_set'+authQS()
      +'&key='+encodeURIComponent(CUR.key)
      +'&platform='+encodeURIComponent(CUR.plat)
      +'&project='+encodeURIComponent(CUR.proj||'')
      +'&handle='+encodeURIComponent(CUR.handle)
      +(fv?('&followers='+fv):'')+(kv?('&karma='+kv):'')+'&_='+Date.now();
    var d=await (await fetch(url)).json();
    if(d&&d.ok){
      DATA.metrics[CUR.key]={ followers:(d.followers===''?null:Number(d.followers)), karma:(d.karma===''?null:Number(d.karma)),
        by:d.by||DATA.who, at:new Date().toISOString().slice(0,19).replace('T',' ') };
      var sn=DATA.snaps[CUR.key]=DATA.snaps[CUR.key]||[];
      var today=new Date().toISOString().slice(0,10);
      var last=sn[sn.length-1];
      var rec={ d:today, f:(fv?Number(fv):null), k:(kv?Number(kv):null) };
      if(last&&last.d===today){ if(rec.f!=null)last.f=rec.f; if(rec.k!=null)last.k=rec.k; } else sn.push(rec);
      toast('Saved — snapshotted for today.');
      render(); openDrawer(CUR.key);
    } else toast('Not saved: '+((d&&d.error)||'unknown'));
  }catch(e){ toast('Connection error.'); }
}

/* ── misc ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var _tt=null;
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(function(){ el.classList.remove('on'); },2600); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDrawer(); });
window.addEventListener('focus', function(){ if(AUTH && document.getElementById('app').style.display==='block') loadAll(); });

/* resume session */
(function(){
  var saved=null; try{ saved=JSON.parse(sessionStorage.getItem('acctc_auth')||'null'); }catch(e){}
  if(saved){ AUTH=saved;
    loadAll().then(function(ok){
      if(ok){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; }
      else { AUTH=null; try{ sessionStorage.removeItem('acctc_auth'); }catch(e){} }
    });
  }
  document.getElementById('g-pin').addEventListener('keydown',function(e){ if(e.key==='Enter') gateGo(); });
  document.getElementById('g-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') gateGo(); });
})();
</script>
