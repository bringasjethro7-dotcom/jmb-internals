<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Center — JMB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ═══ ACCOUNT CENTER — candy edition: light, bubbly, and it dresses itself in whichever
   platform you click. Pick Snapchat and the whole room turns yellow; pick IG and it blushes. ═══ */
:root{
  --acc:#8b5cf6; --acc-ink:#fff; --wash1:#f3eeff; --wash2:#fff7fb; --wash3:#eefaff;
  --bg:#fdfcff; --card:#ffffff; --line:#eee9f5; --line2:#ddd4ee;
  --t1:#3a3352; --t2:#7a7394; --t3:#a9a3c0;
  --up:#10b981; --dn:#f43f5e; --warn:#f59e0b;
  --reddit:#ff5722; --x:#1f2430; --ig:#ff2d92; --snap:#f5c800; --nf:#10c4a0; --altr:#2fa8ff;
}
body[data-theme="reddit"]{ --acc:#ff5722; --wash1:#ffece4; --wash2:#fff6f0; --wash3:#fffaf5 }
body[data-theme="x"]     { --acc:#1f2430; --wash1:#e9edf4; --wash2:#f4f6fa; --wash3:#fbfcfe }
body[data-theme="ig"]    { --acc:#ff2d92; --wash1:#ffe6f2; --wash2:#f4e9ff; --wash3:#fff2ea }
body[data-theme="snap"]  { --acc:#e8b800; --wash1:#fff6c4; --wash2:#fffbe0; --wash3:#fffef2 }
body[data-theme="altr"]  { --acc:#2fa8ff; --wash1:#e0f2ff; --wash2:#eef8ff; --wash3:#f7fcff }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(700px 420px at 90% -8%, var(--wash1), transparent 60%),
    radial-gradient(600px 400px at -8% 25%, var(--wash2), transparent 55%),
    radial-gradient(700px 450px at 55% 115%, var(--wash3), transparent 60%),
    var(--bg);
  color:var(--t1); font:14px/1.5 'Baloo 2',system-ui,sans-serif;
  transition:background .35s;
}
.mono{font-family:'JetBrains Mono',monospace}
::selection{background:var(--wash1)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ── gate ── */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:inherit}
.gate-card{width:min(420px,92vw);background:var(--card);border:2px solid var(--line);border-radius:28px;
  padding:30px 30px 26px;box-shadow:0 24px 60px rgba(120,90,200,.14)}
.gate-card h1{font-size:23px}
.gate-card .gsub{color:var(--t2);font-size:12.5px;margin:4px 0 20px}
.gtabs{display:flex;gap:8px;margin-bottom:16px}
.gtab{flex:1;text-align:center;padding:9px;border:2px solid var(--line);border-radius:14px;cursor:pointer;
  font-weight:700;font-size:12.5px;color:var(--t2)}
.gtab.on{border-color:var(--acc);color:var(--acc);background:var(--wash1)}
.gate-card input{width:100%;background:#faf8ff;border:2px solid var(--line2);color:var(--t1);
  border-radius:14px;padding:11px 13px;font:600 14px 'Baloo 2',sans-serif;margin-bottom:10px}
.gate-card input:focus{outline:none;border-color:var(--acc)}
.gbtn{width:100%;padding:12px;border:none;border-radius:14px;cursor:pointer;font:800 14.5px 'Baloo 2',sans-serif;
  color:#fff;background:var(--acc);box-shadow:0 8px 20px rgba(120,90,200,.25)}
.gbtn:hover{filter:brightness(1.06)}
.gbtn:disabled{opacity:.55}
.gerr{color:var(--dn);font-size:12px;margin-top:10px;display:none;font-weight:600}

/* ── shell ── */
#app{display:none;min-height:100vh}
.deck{display:grid;grid-template-columns:225px 1fr;min-height:100vh}
@media(max-width:860px){.deck{grid-template-columns:1fr}.rail{position:sticky;top:0;z-index:20;flex-direction:row!important;overflow-x:auto;border-right:none!important;border-bottom:2px solid var(--line)}}
.rail{display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:2px solid var(--line);
  background:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.brand{padding:4px 10px 16px}
.brand b{font-size:16px}
.brand span{display:block;font-size:10px;color:var(--t3);letter-spacing:.24em;text-transform:uppercase;margin-top:1px}
.rl{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:16px;cursor:pointer;
  color:var(--t2);font-size:13.5px;font-weight:700;border:2px solid transparent;white-space:nowrap;
  transition:transform .1s}
.rl:hover{background:var(--wash2);transform:translateX(2px)}
.rl.on{background:var(--wash1);border-color:var(--acc);color:var(--t1)}
.rl .ico{width:20px;text-align:center;font-size:14px}
.rl .n{margin-left:auto;font-size:11px;color:var(--t3);background:var(--wash2);border-radius:20px;padding:1px 8px}
.rl.on .n{color:var(--acc);background:#fff}
.railsep{height:2px;background:var(--line);margin:10px 8px;border-radius:2px}

.main{padding:22px 26px 60px;max-width:1500px}
.tops{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tops h2{font-size:21px;margin-right:auto}
.tops h2 em{font-style:normal;color:var(--acc)}
.search{background:#fff;border:2px solid var(--line2);border-radius:16px;padding:9px 14px;
  color:var(--t1);font:600 13px 'Baloo 2',sans-serif;width:215px}
.search:focus{outline:none;border-color:var(--acc)}
select.ctl{background:#fff;border:2px solid var(--line2);border-radius:16px;color:var(--t1);
  padding:9px 12px;font:700 12.5px 'Baloo 2',sans-serif;cursor:pointer}
.ib{background:#fff;border:2px solid var(--line2);color:var(--t1);border-radius:16px;padding:9px 14px;
  cursor:pointer;font:800 13px 'Baloo 2',sans-serif}
.ib:hover{border-color:var(--acc);color:var(--acc)}

/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:20px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:13px 16px;position:relative}
.kpi i{position:absolute;top:12px;right:13px;font-style:normal;font-size:16px}
.kpi b{display:block;font:800 22px/1.2 'JetBrains Mono',monospace;color:var(--kc,var(--acc))}
.kpi span{font-size:10.5px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;font-weight:700}

/* grid of account tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:13px 15px 11px;cursor:pointer;
  position:relative;transition:transform .12s, border-color .12s, box-shadow .12s}
.tile:hover{transform:translateY(-3px) rotate(-.3deg);border-color:var(--pc);box-shadow:0 14px 30px rgba(120,90,200,.14)}
.t-top{display:flex;align-items:center;gap:7px}
.t-plat{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pc);
  background:color-mix(in srgb, var(--pc) 12%, #fff);border-radius:20px;padding:2px 9px}
.t-fresh{margin-left:auto;font-size:10px;color:var(--t3);font-weight:600}
.t-handle{font-weight:800;font-size:15.5px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-sub{font-size:11px;color:var(--t3);margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.t-mid{display:flex;align-items:flex-end;gap:9px;margin-top:9px}
.t-num{font:800 21px/1 'JetBrains Mono',monospace}
.t-num small{font:700 9.5px 'Baloo 2',sans-serif;color:var(--t3);display:block;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.delta{font:800 11px 'JetBrains Mono',monospace;padding:3px 9px;border-radius:20px;margin-left:auto}
.delta.up{color:#067a58;background:#d9f7ec}
.delta.dn{color:#c0184a;background:#ffe1e8}
.delta.flat{color:var(--t3);background:var(--wash2)}
.spark{margin-top:9px;height:34px;width:100%}
.t-foot{display:flex;gap:6px;align-items:center;margin-top:8px}
.spill{font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2.5px 9px;border-radius:20px;text-transform:uppercase}
.flag{font-size:13px}
.t-owner{font-size:10.5px;color:var(--t3);font-weight:600}

/* drawer */
#drawer{position:fixed;top:0;right:-470px;bottom:0;width:min(445px,96vw);z-index:40;
  background:var(--card);border-left:2px solid var(--line2);box-shadow:-24px 0 60px rgba(90,70,160,.18);
  transition:right .22s ease;padding:24px 24px 30px;overflow:auto;border-radius:26px 0 0 26px}
#drawer.open{right:0}
.d-close{position:absolute;top:16px;right:16px;background:var(--wash2);border:none;color:var(--t2);
  font-size:15px;cursor:pointer;width:32px;height:32px;border-radius:50%}
.d-plat{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.d-handle{font-size:24px;font-weight:800;margin:2px 0 3px;word-break:break-all}
.d-sub{color:var(--t2);font-size:12.5px;margin-bottom:16px;font-weight:600}
.d-chart{background:var(--wash2);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:16px}
.d-chart h4{font-size:10.5px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.d-kv{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.d-cell{background:var(--card);border:2px solid var(--line);border-radius:15px;padding:9px 12px}
.d-cell b{display:block;font:800 15px 'JetBrains Mono',monospace}
.d-cell span{font-size:9.5px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.d-edit{background:var(--wash1);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.d-edit h4{font-size:12px;color:var(--t1);margin-bottom:10px}
.d-edit .row{display:flex;gap:8px;margin-bottom:9px}
.d-edit input{flex:1;background:#fff;border:2px solid var(--line2);color:var(--t1);border-radius:12px;
  padding:9px 12px;font:800 13.5px 'JetBrains Mono',monospace;width:100%}
.d-edit input:focus{outline:none;border-color:var(--acc)}
.d-edit label{font-size:10px;color:var(--t2);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px;font-weight:800}
.d-save{width:100%;padding:11px;border:none;border-radius:13px;cursor:pointer;
  font:800 13.5px 'Baloo 2',sans-serif;color:#fff;background:var(--acc);box-shadow:0 6px 16px rgba(120,90,200,.22)}
.d-link{display:inline-flex;align-items:center;gap:7px;color:var(--acc);text-decoration:none;font-size:13.5px;font-weight:800}
.d-link:hover{text-decoration:underline}
#scrim{position:fixed;inset:0;background:rgba(70,55,120,.22);z-index:35;display:none}
#scrim.open{display:block}

.empty{color:var(--t3);text-align:center;padding:60px 20px;font-size:13.5px;font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--t1);
  color:#fff;padding:10px 20px;border-radius:16px;font-size:12.5px;font-weight:700;opacity:0;
  pointer-events:none;transition:.2s;z-index:60;box-shadow:0 14px 40px rgba(60,45,110,.3)}
.toast.on{opacity:1}
.who{font-size:11px;color:var(--t3);padding:8px 11px;font-weight:600}
.who b{color:var(--t2)}
</style>
</head>
<body data-theme="">

<!-- ═════ GATE ═════ -->
<div id="gate">
  <div class="gate-card">
    <h1>🏠 Account Center</h1>
    <div class="gsub">Every account, every platform, one cozy frame. Admin &amp; CL7–9 leads only.</div>
    <div class="gtabs">
      <div class="gtab on" id="gt-lead" onclick="gateMode('lead')">Lead sign-in</div>
      <div class="gtab" id="gt-adm" onclick="gateMode('adm')">Admin</div>
    </div>
    <div id="g-lead">
      <input id="g-id" placeholder="Employee ID" autocomplete="off">
      <input id="g-pin" type="password" placeholder="PIN">
    </div>
    <div id="g-adm" style="display:none">
      <input id="g-pass" type="password" placeholder="Admin password">
    </div>
    <button class="gbtn" id="g-go" onclick="gateGo()">Come on in ✨</button>
    <div class="gerr" id="g-err"></div>
  </div>
</div>

<!-- ═════ APP ═════ -->
<div id="app">
<div class="deck">
  <div class="rail" id="rail"></div>
  <div class="main">
    <div class="tops">
      <h2>🏠 <em id="view-title">Account Center</em> <span style="font-size:11px;color:var(--t3);font-weight:600">· all your accounts, one home</span></h2>
      <input class="search" id="q" placeholder="🔎 handle / owner…" oninput="render()">
      <select class="ctl" id="sort" onchange="render()">
        <option value="move">Sort · biggest movers</option>
        <option value="num">Sort · highest number</option>
        <option value="fresh">Sort · recently updated</option>
        <option value="handle">Sort · handle A→Z</option>
      </select>
      <select class="ctl" id="live" onchange="render()">
        <option value="1">Active only</option>
        <option value="">Include dead</option>
      </select>
      <button class="ib" id="scrape-btn" style="display:none" onclick="scrapeVisible()">🪄 Scrape visible</button>
      <button class="ib" onclick="loadAll(true)">↻</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Nothing matches this view 🫧</div>
  </div>
</div>
</div>

<div id="scrim" onclick="closeDrawer()"></div>
<div id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbwK8rVJlkv5YLgNLe7cGIz73KJc0hedmZcutoiRviDEowiZPglzBnznswBaZ0TVIV8t/exec';
var ALTR_API='https://script.google.com/macros/s/AKfycbxp7wcIf48urxm2DcPoNgdmQreYUGia-YNnXwIXfyMqOLkyWpaqI3hoMZa4VPmjZa9_Mg/exec';

var PLATS={
  reddit:{ n:'Reddit',   ico:'👽', c:'#ff5722', metric:'karma',     link:function(h){return 'https://www.reddit.com/user/'+encodeURIComponent(h);} },
  x:     { n:'X',        ico:'🖤', c:'#1f2430', metric:'followers', link:function(h){return 'https://x.com/'+encodeURIComponent(h.replace(/^@+/,''));} },
  ig:    { n:'Instagram',ico:'📸', c:'#ff2d92', metric:'followers', link:function(h){return 'https://www.instagram.com/'+encodeURIComponent(h.replace(/^@+/,''));} },
  snap:  { n:'Snapchat', ico:'👻', c:'#e8b800', metric:'friends', link:function(h){return 'https://www.snapchat.com/add/'+encodeURIComponent(h);} },
  altr:  { n:'ALTR · IG',ico:'🌊', c:'#2fa8ff', metric:'followers', link:function(h){return 'https://www.instagram.com/'+encodeURIComponent(h.replace(/^@+/,''));} }
};
var PLAT_FB={ n:'Other', ico:'✨', c:'#8b5cf6', metric:'followers', link:function(){return null;} };
var DEAD=['banned','suspended','tempban','closed','dead','archived'];
var STATUS_COLORS={ banned:'#f43f5e', suspended:'#f43f5e', tempban:'#f59e0b', recovery:'#f59e0b',
  warmup:'#f59e0b', warming:'#f59e0b', onhold:'#7a7394', reserved:'#7a7394', flagged:'#f59e0b', rest:'#7a7394' };

var AUTH=null;
var DATA={ accounts:[], metrics:{}, snaps:{}, names:{}, who:'' };
var VIEW='all';

/* ── gate ── */
function gateMode(m){
  document.getElementById('gt-lead').classList.toggle('on',m==='lead');
  document.getElementById('gt-adm').classList.toggle('on',m==='adm');
  document.getElementById('g-lead').style.display=(m==='lead')?'block':'none';
  document.getElementById('g-adm').style.display=(m==='adm')?'block':'none';
  window._gm=m;
}
window._gm='lead';
function authQS(){
  if(!AUTH) return '';
  return AUTH.mode==='adm' ? ('&pass='+encodeURIComponent(AUTH.pass))
       : ('&viewer_id='+encodeURIComponent(AUTH.id)+'&pin='+encodeURIComponent(AUTH.pin));
}
async function gateGo(){
  var btn=document.getElementById('g-go'), err=document.getElementById('g-err');
  err.style.display='none';
  var cand=(window._gm==='adm')
    ? { mode:'adm', pass:document.getElementById('g-pass').value }
    : { mode:'lead', id:document.getElementById('g-id').value.trim(), pin:document.getElementById('g-pin').value.trim() };
  if(cand.mode==='lead' && (!cand.id||!cand.pin)){ err.textContent='Enter your Employee ID and PIN.'; err.style.display='block'; return; }
  if(cand.mode==='adm' && !cand.pass){ err.textContent='Enter the admin password.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Checking…';
  AUTH=cand;
  var ok=await loadAll();
  btn.disabled=false; btn.textContent='Come on in ✨';
  if(ok){
    try{ sessionStorage.setItem('acctc_auth', JSON.stringify(AUTH)); }catch(e){}
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    AUTH=null;
    err.textContent='Not authorized — wrong credentials, or not a CL7–9 lead.';
    err.style.display='block';
  }
}

/* ── data ── */
async function loadAll(isRefresh){
  try{
    if(isRefresh) toast('Refreshing…');
    var pMain=fetch(API+'?action=acct_center'+authQS()+'&_='+Date.now()).then(function(r){return r.json();});
    var pAltr=fetch(ALTR_API+'?action=state&_='+Date.now()).then(function(r){return r.json();}).catch(function(){return null;});
    var pNames=fetch(API+'?action=get_all_employees&_='+Date.now()).then(function(r){return r.json();}).catch(function(){return null;});
    var d=await pMain;
    if(!d || !d.ok){ return false; }
    DATA.who=d.who||'';
    DATA.metrics=d.metrics||{};
    DATA.snaps={};
    (d.snaps||[]).forEach(function(s){ (DATA.snaps[s[1]]=DATA.snaps[s[1]]||[]).push({d:s[0],f:s[2],k:s[3]}); });
    Object.keys(DATA.snaps).forEach(function(k){ DATA.snaps[k].sort(function(a,b){ return a.d<b.d?-1:1; }); });
    var accounts=(d.accounts||[]);
    var alt=await pAltr;
    if(alt && alt.accounts){
      alt.accounts.forEach(function(a){
        var h=String(a.handle||a.acct||'').trim(); if(!h) return;
        accounts.push({ key:('altr|altr|'+h).toLowerCase(), plat:'altr', tool:'ALTR Media', proj:'ALTR',
          handle:h, status:String(a.status||'active'), day:0, owner:'',
          followers_live:(parseInt(a.followers,10)||null), karma:null, link:a.link||'' });
      });
    }
    DATA.accounts=accounts;
    var nm=await pNames;
    if(nm && nm.employees){ nm.employees.forEach(function(e){ DATA.names[String(e.employee_id).toLowerCase()]=e.full_name||e.employee_id; }); }
    buildRail(); render();
    if(isRefresh) toast('Freshly fluffed ✨');
    return true;
  }catch(e){ return false; }
}

/* ── derived numbers ── */
function numOf(a){
  var m=DATA.metrics[a.key]||{};
  var plat=PLATS[a.plat]||PLAT_FB;
  if(plat.metric==='karma'){
    var k=(a.karma!=null)?a.karma:(m.karma!=null?m.karma:null);
    return { v:k, label:'karma' };
  }
  /* freshest wins: today's VA gate entry (board meta) → lead's manual entry → ALTR live scrape */
  var f=(a.fol!=null && a.mday)?a.fol:(m.followers!=null?m.followers:(a.fol!=null?a.fol:(a.followers_live!=null?a.followers_live:null)));
  return { v:f, label:plat.metric };
}
function seriesOf(a){
  var sn=DATA.snaps[a.key]||[];
  var useK=(PLATS[a.plat]||{}).metric==='karma';
  var out=[]; sn.forEach(function(s){ var v=useK?s.k:s.f; if(v!=null) out.push({d:s.d,v:v}); });
  return out;
}
function deltaOf(a){
  var s=seriesOf(a); if(s.length<2) return null;
  var last=s[s.length-1];
  var target=null;
  for(var i=s.length-2;i>=0;i--){ target=s[i]; var days=(new Date(last.d)-new Date(s[i].d))/86400000; if(days>=6) break; }
  if(!target) return null;
  var base=target.v||0;
  var abs=last.v-target.v;
  var pct=base>0 ? (abs/base*100) : (abs>0?100:0);
  return { abs:abs, pct:pct };
}
function freshOf(a){
  var m=DATA.metrics[a.key]||{};
  var s=seriesOf(a);
  var td=new Date().toISOString().slice(0,10);
  if(a.mday===td) return 'today ✓';
  if(a.plat==='altr'||a.plat==='reddit') return 'auto';
  var at=m.at?new Date(String(m.at).replace(' ','T')):null;
  if(!at||isNaN(at)) return s.length?'—':'no data';
  var ddays=Math.floor((Date.now()-at.getTime())/86400000);
  return ddays<=0?'today':(ddays+'d ago');
}
function isDead(a){ return DEAD.indexOf(String(a.status||'').toLowerCase())>=0; }
function flagOf(a){
  var d=deltaOf(a); if(!d) return '';
  if(d.pct>=20) return '🔥';
  if(d.pct<=-20) return '🫠';
  return '';
}

/* ── rail + theme ── */
function buildRail(){
  var counts={}; DATA.accounts.forEach(function(a){ if(!isDead(a)) counts[a.plat]=(counts[a.plat]||0)+1; });
  var total=DATA.accounts.filter(function(a){return !isDead(a);}).length;
  var html='<div class="brand"><b>🏠 Account Center</b><span>all in one frame</span></div>';
  function rl(id,label,icon,n){
    return '<div class="rl'+(VIEW===id?' on':'')+'" onclick="setView(\''+id+'\')">'+
      '<span class="ico">'+icon+'</span><span>'+label+'</span>'+(n!=null?('<span class="n">'+n+'</span>'):'')+'</div>';
  }
  html+=rl('all','Overview','🌈',total);
  html+=rl('movers','Movers','🔥',null);
  html+=rl('stale','Stale numbers','🕸️',null);
  html+='<div class="railsep"></div>';
  Object.keys(PLATS).forEach(function(p){
    if(!counts[p]) return;
    html+=rl(p,PLATS[p].n,PLATS[p].ico,counts[p]);
  });
  html+='<div class="railsep"></div>';
  html+='<div class="who">signed in as <b>'+esc(DATA.who||'—')+'</b></div>';
  html+=rl('__out','Sign out','👋',null);
  document.getElementById('rail').innerHTML=html;
}
function setView(v){
  if(v==='__out'){ try{ sessionStorage.removeItem('acctc_auth'); }catch(e){} location.reload(); return; }
  VIEW=v;
  /* THE ROOM CHANGES CLOTHES: clicking a platform re-themes the whole page to its colour —
     Snapchat turns everything yellow, IG pink, X inky, Reddit orange, and so on. The overview
     and utility views go back to the neutral lilac. */
  document.body.dataset.theme = PLATS[v] ? v : '';
  var vt=document.getElementById('view-title');
  if(vt) vt.textContent = PLATS[v] ? (PLATS[v].ico+' '+PLATS[v].n) : (v==='movers'?'🔥 Movers':(v==='stale'?'🕸️ Stale numbers':'Account Center'));
  buildRail(); render();
}

/* ── render ── */
function render(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var sort=document.getElementById('sort').value;
  var liveOnly=!!document.getElementById('live').value;
  var rows=DATA.accounts.slice();
  if(liveOnly) rows=rows.filter(function(a){ return !isDead(a); });
  if(VIEW!=='all'&&VIEW!=='movers'&&VIEW!=='stale') rows=rows.filter(function(a){ return a.plat===VIEW; });
  if(VIEW==='movers') rows=rows.filter(function(a){ var d=deltaOf(a); return d && Math.abs(d.pct)>=20; });
  if(VIEW==='stale') rows=rows.filter(function(a){
    if(a.plat==='altr'||a.plat==='reddit') return false;      // auto-fed
    var m=DATA.metrics[a.key]||{};
    if(!m.at) return true;
    return (Date.now()-new Date(String(m.at).replace(' ','T')).getTime())>7*86400000;
  });
  if(q) rows=rows.filter(function(a){
    return a.handle.toLowerCase().indexOf(q)>=0 || (DATA.names[a.owner]||a.owner||'').toLowerCase().indexOf(q)>=0 || a.tool.toLowerCase().indexOf(q)>=0;
  });
  rows.sort(function(a,b){
    if(sort==='move'){ var da=deltaOf(a),db=deltaOf(b); return (db?Math.abs(db.pct):-1)-(da?Math.abs(da.pct):-1); }
    if(sort==='num'){ return (numOf(b).v||0)-(numOf(a).v||0); }
    if(sort==='handle'){ return a.handle.localeCompare(b.handle); }
    if(sort==='fresh'){ var ma=(DATA.metrics[a.key]||{}).at||'', mb=(DATA.metrics[b.key]||{}).at||''; return mb.localeCompare(ma); }
    return 0;
  });
  var live=DATA.accounts.filter(function(a){return !isDead(a);});
  var fsum=0; live.forEach(function(a){ var n=numOf(a); if(n.label==='followers'&&n.v) fsum+=n.v; });
  var risers=0,fallers=0;
  live.forEach(function(a){ var d=deltaOf(a); if(d&&d.pct>=20)risers++; else if(d&&d.pct<=-20)fallers++; });
  var deadN=DATA.accounts.length-live.length;
  document.getElementById('kpis').innerHTML=
    kpi(live.length,'accounts live','var(--acc)','🏠')+
    kpi(fmtN(fsum),'followers tracked','var(--acc)','💗')+
    kpi(risers,'rising fast', risers?'#10b981':'var(--t3)','🔥')+
    kpi(fallers,'falling fast', fallers?'#f43f5e':'var(--t3)','🫠')+
    kpi(deadN,'dead / suspended','#f43f5e','💤');
  var g=document.getElementById('grid');
  g.innerHTML=rows.map(tile).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
  window._lastRows=rows;
  var sb=document.getElementById('scrape-btn');
  if(sb) sb.style.display=(VIEW==='ig'||VIEW==='altr')?'inline-block':'none';
}
function kpi(v,l,c,i){ return '<div class="kpi" style="--kc:'+c+'"><i>'+i+'</i><b>'+v+'</b><span>'+l+'</span></div>'; }
function fmtN(n){ if(n==null) return '—'; if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=10000) return (n/1000).toFixed(1)+'k'; return String(n); }
function tile(a){
  var p=PLATS[a.plat]||PLAT_FB;
  var n=numOf(a), d=deltaOf(a);
  var dHtml=d
    ? '<span class="delta '+(d.abs>0?'up':(d.abs<0?'dn':'flat'))+'">'+(d.abs>0?'▲':(d.abs<0?'▼':'•'))+' '+(Math.abs(d.pct)>=1?Math.abs(d.pct).toFixed(0)+'%':Math.abs(d.abs))+'</span>'
    : '<span class="delta flat">— 7d</span>';
  var st=String(a.status||'').toLowerCase();
  var sc=STATUS_COLORS[st]||'#10b981';
  var owner=DATA.names[a.owner]||a.owner||'';
  return '<div class="tile" style="--pc:'+p.c+'" onclick="openDrawer(\''+esc(a.key)+'\')">'+
    '<div class="t-top"><span class="t-plat">'+p.ico+' '+p.n+'</span><span class="flag">'+flagOf(a)+'</span><span class="t-fresh">'+freshOf(a)+'</span></div>'+
    '<div class="t-handle">'+esc(a.handle)+'</div>'+
    '<div class="t-sub">'+esc(a.tool)+(owner?(' · '+esc(owner.split(',')[0])):'')+'</div>'+
    '<div class="t-mid"><div class="t-num">'+fmtN(n.v)+'<small>'+n.label+'</small></div>'+dHtml+'</div>'+
    sparkSvg(seriesOf(a), p.c)+
    '<div class="t-foot"><span class="spill" style="color:'+sc+';background:'+sc+'1a">'+esc(a.status||'—')+'</span>'+
      (a.day?('<span class="t-owner">day '+a.day+'</span>'):'')+'</div>'+
  '</div>';
}
function sparkSvg(s, color){
  if(!s || s.length<2) return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><line x1="0" y1="30" x2="100" y2="30" stroke="rgba(120,110,160,.18)" stroke-width="1.5" stroke-dasharray="3 4"/></svg>';
  var vs=s.map(function(x){return x.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  var span=(mx-mn)||1;
  var pts=s.map(function(x,i){
    var px=(i/(s.length-1))*100;
    var py=30-((x.v-mn)/span)*26;
    return px.toFixed(1)+','+py.toFixed(1);
  });
  return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>'+
    '<polygon points="0,34 '+pts.join(' ')+' 100,34" fill="'+color+'" opacity=".09"/>'+
  '</svg>';
}

/* ── drawer ── */
var CUR=null;
function openDrawer(key){
  var a=DATA.accounts.filter(function(x){return x.key===key;})[0]; if(!a) return;
  CUR=a;
  var p=PLATS[a.plat]||PLAT_FB;
  var n=numOf(a), d=deltaOf(a), m=DATA.metrics[a.key]||{};
  var link=(a.link)||(p.link?p.link(a.handle):null);
  var owner=DATA.names[a.owner]||a.owner||'—';
  var canKarma=(p.metric==='karma');
  document.getElementById('drawer').innerHTML=
    '<button class="d-close" onclick="closeDrawer()">✕</button>'+
    '<div class="d-plat" style="color:'+p.c+'">'+p.ico+' '+p.n+' · '+esc(a.tool)+'</div>'+
    '<div class="d-handle">'+esc(a.handle)+'</div>'+
    '<div class="d-sub">'+esc(a.status||'—')+(a.day?(' · day '+a.day):'')+' · handled by '+esc(owner)+'</div>'+
    '<div class="d-chart"><h4>'+(canKarma?'Karma':'Followers')+' · last 15 days</h4>'+bigChart(seriesOf(a),p.c)+'</div>'+
    '<div class="d-kv">'+
      '<div class="d-cell"><b>'+fmtN(n.v)+'</b><span>current '+n.label+'</span></div>'+
      ((a.plat==='ig'||a.plat==='altr')?('<div class="d-cell"><b>'+fmtN(m.following!=null?m.following:null)+'</b><span>following</span></div>'):'')+
      '<div class="d-cell"><b style="color:'+(d?(d.abs>0?'var(--up)':(d.abs<0?'var(--dn)':'var(--t2)')):'var(--t3)')+'">'+(d?((d.abs>0?'+':'')+fmtN(d.abs)):'—')+'</b><span>change · 7 days</span></div>'+
      '<div class="d-cell"><b>'+esc(freshOf(a))+'</b><span>number updated</span></div>'+
      '<div class="d-cell"><b>'+esc((m.by||'—'))+'</b><span>last updated by</span></div>'+
    '</div>'+
    '<div class="d-edit"><h4>✍️ Update the numbers (what the platform shows right now)</h4>'+
      '<div class="row">'+
        (canKarma
          ? '<div style="flex:1"><label>Karma</label><input id="ed-karma" inputmode="numeric" placeholder="'+(n.v!=null?n.v:'—')+'"></div>'
          : '<div style="flex:1"><label>Followers</label><input id="ed-fol" inputmode="numeric" placeholder="'+(n.v!=null?n.v:'—')+'"></div>')+
      '</div>'+
      '<button class="d-save" onclick="saveMetric()">Save → snapshot today 📌</button>'+
      ((a.plat==='ig'||a.plat==='altr')?('<button class="d-save" style="margin-top:8px;background:#fff;color:var(--acc);border:2px solid var(--acc);box-shadow:none" onclick="scrapeIG()">🪄 Pull live from IG scraper</button>'):'')+
    '</div>'+
    (link?('<a class="d-link" target="_blank" rel="noopener" href="'+esc(link)+'">↗ Open on '+p.n+'</a>'):'');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
function bigChart(s, color){
  if(!s||s.length<2) return '<div style="color:var(--t3);font-size:12px;padding:22px 4px;text-align:center;font-weight:600">Not enough history yet — the daily snapshot builds this automatically 🌱</div>';
  var vs=s.map(function(x){return x.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs), span=(mx-mn)||1;
  var pts=s.map(function(x,i){ return ((i/(s.length-1))*100).toFixed(1)+','+(44-((x.v-mn)/span)*36).toFixed(1); });
  return '<svg viewBox="0 0 100 50" style="width:100%;height:120px" preserveAspectRatio="none">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round"/>'+
    '<polygon points="0,50 '+pts.join(' ')+' 100,50" fill="'+color+'" opacity=".1"/>'+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--t3)" class="mono"><span>'+s[0].d.slice(5)+' · '+fmtN(mn)+'</span><span>'+s[s.length-1].d.slice(5)+' · '+fmtN(mx)+'</span></div>';
}
async function saveMetric(){
  if(!CUR) return;
  var f=document.getElementById('ed-fol'), k=document.getElementById('ed-karma');
  var fv=f?String(f.value).replace(/[^0-9]/g,''):'';
  var kv=k?String(k.value).replace(/[^0-9]/g,''):'';
  if(!fv&&!kv){ toast('Type the current number first.'); return; }
  try{
    var url=API+'?action=acct_metric_set'+authQS()
      +'&key='+encodeURIComponent(CUR.key)
      +'&platform='+encodeURIComponent(CUR.plat)
      +'&project='+encodeURIComponent(CUR.proj||'')
      +'&handle='+encodeURIComponent(CUR.handle)
      +(fv?('&followers='+fv):'')+(kv?('&karma='+kv):'')+'&_='+Date.now();
    var d=await (await fetch(url)).json();
    if(d&&d.ok){
      DATA.metrics[CUR.key]={ followers:(d.followers===''?null:Number(d.followers)), karma:(d.karma===''?null:Number(d.karma)),
        by:d.by||DATA.who, at:new Date().toISOString().slice(0,19).replace('T',' ') };
      var sn=DATA.snaps[CUR.key]=DATA.snaps[CUR.key]||[];
      var today=new Date().toISOString().slice(0,10);
      var last=sn[sn.length-1];
      var rec={ d:today, f:(fv?Number(fv):null), k:(kv?Number(kv):null) };
      if(last&&last.d===today){ if(rec.f!=null)last.f=rec.f; if(rec.k!=null)last.k=rec.k; } else sn.push(rec);
      toast('Saved — snapshotted for today 📌');
      render(); openDrawer(CUR.key);
    } else toast('Not saved: '+((d&&d.error)||'unknown'));
  }catch(e){ toast('Connection error.'); }
}

/* ── IG SCRAPER BRIDGE — reuses ALTR's worker/RapidAPI pipe, so IG numbers can be pulled
   instead of typed. One account from the drawer, or every visible IG account in a slow, polite
   queue (the scraping API rate-limits hard; 1.6s spacing keeps it happy). ── */
async function scrapeIG(){
  if(!CUR) return;
  toast('🪄 Asking the scraper…');
  var d=await scrapeOne(CUR);
  if(!d){ toast('Scraper could not read this account (private, renamed, or rate-limited).'); return; }
  toast('Got it — '+fmtN(d.count)+' followers'+(d.following!=null?(' · '+fmtN(d.following)+' following'):'')+' · saved.');
  render(); openDrawer(CUR.key);
}
async function scrapeOne(a){
  try{
    var h=String(a.handle||'').replace(/^@+/,'');
    var d=await (await fetch(ALTR_API+'?action=ig_debug&handle='+encodeURIComponent(h)+'&_='+Date.now())).json();
    var c=(d&&d.count!==''&&d.count!=null)?Number(d.count):null;
    var fw=(d&&d.following!==''&&d.following!=null)?Number(d.following):null;
    if(c==null) return null;
    var url=API+'?action=acct_metric_set'+authQS()
      +'&key='+encodeURIComponent(a.key)+'&platform='+encodeURIComponent(a.plat)
      +'&project='+encodeURIComponent(a.proj||'')+'&handle='+encodeURIComponent(a.handle)
      +'&followers='+c+(fw!=null?('&following='+fw):'')+'&_='+Date.now();
    var r=await (await fetch(url)).json();
    if(!(r&&r.ok)) return null;
    DATA.metrics[a.key]={ followers:c, following:fw, karma:(DATA.metrics[a.key]||{}).karma||null,
      by:'IG scraper', at:new Date().toISOString().slice(0,19).replace('T',' ') };
    var sn=DATA.snaps[a.key]=DATA.snaps[a.key]||[];
    var td=new Date().toISOString().slice(0,10), last=sn[sn.length-1];
    if(last&&last.d===td) last.f=c; else sn.push({d:td,f:c,k:null});
    return { count:c, following:fw };
  }catch(e){ return null; }
}
var _bulkBusy=false;
async function scrapeVisible(){
  if(_bulkBusy){ toast('Already scraping — give it a moment.'); return; }
  var rows=(window._lastRows||[]).filter(function(a){ return a.plat==='ig'||a.plat==='altr'; }).slice(0,30);
  if(!rows.length){ toast('No IG accounts in this view.'); return; }
  _bulkBusy=true;
  var ok=0, fail=0;
  for(var i=0;i<rows.length;i++){
    toast('🪄 Scraping '+(i+1)+'/'+rows.length+' — '+rows[i].handle);
    var d=await scrapeOne(rows[i]);
    if(d) ok++; else fail++;
    render();
    await new Promise(function(r){ setTimeout(r,1600); });
  }
  _bulkBusy=false;
  toast('Done — '+ok+' pulled'+(fail?(' · '+fail+' unreadable (private/limits)'):'')+'.');
}
/* ── misc ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var _tt=null;
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(function(){ el.classList.remove('on'); },2600); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDrawer(); });
window.addEventListener('focus', function(){ if(AUTH && document.getElementById('app').style.display==='block') loadAll(); });

(function(){
  var saved=null; try{ saved=JSON.parse(sessionStorage.getItem('acctc_auth')||'null'); }catch(e){}
  if(saved){ AUTH=saved;
    loadAll().then(function(ok){
      if(ok){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; }
      else { AUTH=null; try{ sessionStorage.removeItem('acctc_auth'); }catch(e){} }
    });
  }
  document.getElementById('g-pin').addEventListener('keydown',function(e){ if(e.key==='Enter') gateGo(); });
  document.getElementById('g-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') gateGo(); });
})();
</script>
