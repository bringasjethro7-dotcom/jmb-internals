<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Center — JMB Virtuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══ ACCOUNT CENTER — professional edition. Quiet, precise, information-first: white cards,
   hairline borders, tabular numerals. The selected platform sets the ACCENT (chips, active
   states, charts) and a faint page tint — presence without noise. ═══ */
:root{
  --acc:#4f46e5; --tint:rgba(79,70,229,.045);
  --bg:#f7f8fa; --card:#ffffff; --line:#e6e8ee; --line2:#d4d8e2;
  --t1:#111827; --t2:#4b5563; --t3:#9ca3af;
  --up:#059669; --up-bg:#ecfdf5; --dn:#dc2626; --dn-bg:#fef2f2; --warn:#d97706;
  --reddit:#d93a00; --x:#111827; --ig:#c13584; --snap:#b48b00; --altr:#0369a1;
}
body[data-theme="reddit"]{ --acc:#d93a00; --tint:rgba(217,58,0,.045) }
body[data-theme="x"]     { --acc:#111827; --tint:rgba(17,24,39,.04) }
body[data-theme="ig"]    { --acc:#c13584; --tint:rgba(193,53,132,.045) }
body[data-theme="snap"]  { --acc:#b48b00; --tint:rgba(180,139,0,.05) }
body[data-theme="altr"]  { --acc:#0369a1; --tint:rgba(3,105,161,.045) }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:linear-gradient(var(--tint), var(--tint)), var(--bg);
  color:var(--t1);
  font:13.5px/1.5 'Inter',system-ui,-apple-system,sans-serif;
  transition:background .25s;
  font-feature-settings:'cv11';
}
.num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
::selection{background:rgba(79,70,229,.15)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ── gate ── */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:inherit}
.gate-card{width:min(400px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:32px 32px 28px;box-shadow:0 1px 2px rgba(16,24,40,.04), 0 20px 50px rgba(16,24,40,.08)}
.g-mark{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;margin-bottom:14px;letter-spacing:.02em}
.gate-card h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.gate-card .gsub{color:var(--t2);font-size:12.5px;margin:5px 0 22px}
.gtabs{display:flex;border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:16px;background:var(--bg)}
.gtab{flex:1;text-align:center;padding:7px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--t2)}
.gtab.on{background:var(--card);color:var(--t1);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.gate-card input{width:100%;background:var(--card);border:1px solid var(--line2);color:var(--t1);
  border-radius:9px;padding:10px 12px;font:500 13.5px 'Inter',sans-serif;margin-bottom:10px}
.gate-card input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.gbtn{width:100%;padding:11px;border:none;border-radius:9px;cursor:pointer;font:600 13.5px 'Inter',sans-serif;
  color:#fff;background:var(--acc)}
.gbtn:hover{filter:brightness(1.08)}
.gbtn:disabled{opacity:.55}
.gerr{color:var(--dn);font-size:12px;margin-top:10px;display:none;font-weight:500}

/* ── shell ── */
#app{display:none;min-height:100vh}
.deck{display:grid;grid-template-columns:222px 1fr;min-height:100vh}
@media(max-width:860px){.deck{grid-template-columns:1fr}.rail{position:sticky;top:0;z-index:20;flex-direction:row!important;overflow-x:auto;border-right:none!important;border-bottom:1px solid var(--line)}}
.rail{display:flex;flex-direction:column;gap:2px;padding:18px 12px;border-right:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:9px;padding:2px 10px 18px}
.b-mark{width:26px;height:26px;border-radius:7px;background:var(--acc);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:10.5px;flex:none}
.brand b{font-size:13.5px;font-weight:700;letter-spacing:-.01em;display:block}
.brand span{display:block;font-size:10px;color:var(--t3);font-weight:500}
.rlab{font-size:10.5px;color:var(--t3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:12px 11px 5px}
.rl{display:flex;align-items:center;gap:9px;padding:7.5px 11px;border-radius:8px;cursor:pointer;
  color:var(--t2);font-size:13px;font-weight:500;white-space:nowrap}
.rl:hover{background:var(--bg);color:var(--t1)}
.rl.on{background:linear-gradient(var(--tint),var(--tint)),var(--bg);color:var(--t1);font-weight:600;box-shadow:inset 2px 0 0 var(--acc)}
.rl .dot{width:8px;height:8px;border-radius:50%;flex:none}
.rl .glyph{width:8px;text-align:center;color:var(--t3);font-size:11px;flex:none}
.rl .n{margin-left:auto;font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.rl.on .n{color:var(--acc);font-weight:600}
.who{font-size:11px;color:var(--t3);padding:10px 11px 4px;margin-top:auto}
.who b{color:var(--t2);font-weight:600}

.main{padding:24px 28px 60px;max-width:1500px}
.tops{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tops h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-right:auto}
.tops h2 span{color:var(--t3);font-size:12px;font-weight:500;margin-left:8px}
.search{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;
  color:var(--t1);font:500 13px 'Inter',sans-serif;width:220px}
.search:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
select.ctl{background:var(--card);border:1px solid var(--line2);border-radius:9px;color:var(--t1);
  padding:8px 10px;font:500 12.5px 'Inter',sans-serif;cursor:pointer}
.ib{background:var(--card);border:1px solid var(--line2);color:var(--t1);border-radius:9px;padding:8px 13px;
  cursor:pointer;font:600 12.5px 'Inter',sans-serif}
.ib:hover{border-color:var(--acc);color:var(--acc)}

/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--kc,var(--t1));font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--t3);font-weight:500}

/* per-platform breakdown cards (Overview) — active vs inactive, click through to the platform */
.platboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;transition:border-color .15s,transform .1s}
.pcard:hover{border-color:var(--t3);transform:translateY(-1px)}
.pc-h{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);margin-bottom:7px}
.pc-h b{font-weight:650;color:var(--t1)}
.pc-n{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1}
.pc-n small{font-size:11px;font-weight:500;color:var(--t3);margin-left:6px;letter-spacing:0}
.pc-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:9px 0 7px}
.pc-bar i{display:block;height:100%;border-radius:3px}
.pc-s{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600}
.pc-dead{color:var(--dn)} .pc-ok{color:var(--up)} .pc-tot{color:var(--t3);font-weight:500}

/* open-on-platform button (row + drawer) */
.goplat{border:1px solid var(--line);background:transparent;color:var(--t2);border-radius:7px;
  padding:4px 9px;font-size:11px;font-weight:650;cursor:pointer;white-space:nowrap}
.goplat:hover{border-color:var(--t3);color:var(--t1)}

/* vertical account list — one row per account, built for scanning down a column of numbers */
.lst{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lst th{text-align:left;font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
.lst th.r, .lst td.r{text-align:right}
.lst td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
.lst tbody tr:last-child td{border-bottom:none}
.lst tbody tr{cursor:pointer}
.lst tbody tr:hover td{background:linear-gradient(var(--tint),var(--tint)),var(--card)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.l-plat{font-size:11px;font-weight:600;color:var(--t2);white-space:nowrap}
.l-handle{font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.l-tool{font-size:11px;color:var(--t3);white-space:nowrap}
.l-owner{font-size:12px;color:var(--t2);white-space:nowrap}
.l-num{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.l-num small{font-size:10px;color:var(--t3);font-weight:500;margin-left:4px;text-transform:uppercase}
.l-fresh{font-size:11px;color:var(--t3);white-space:nowrap}
.l-fresh.ok{color:var(--up)}
.delta{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--up);background:var(--up-bg)}
.delta.dn{color:var(--dn);background:var(--dn-bg)}
.delta.flat{color:var(--t3);background:var(--bg)}
.spark{height:26px;width:104px;display:block}
.spill{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:2.5px 9px;border-radius:6px;text-transform:capitalize;white-space:nowrap}
.mv{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;text-transform:uppercase;margin-left:7px}
.mv.up{color:var(--up);background:var(--up-bg)}
.mv.dn{color:var(--dn);background:var(--dn-bg)}
@media(max-width:1100px){ .hide-md{display:none} }
@media(max-width:760px){ .hide-sm{display:none} }

/* drawer */
#drawer{position:fixed;top:0;right:-470px;bottom:0;width:min(440px,96vw);z-index:40;
  background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(16,24,40,.12);
  transition:right .2s ease;padding:26px 26px 32px;overflow:auto}
#drawer.open{right:0}
.d-close{position:absolute;top:18px;right:18px;background:var(--bg);border:1px solid var(--line);color:var(--t2);
  font-size:13px;cursor:pointer;width:30px;height:30px;border-radius:8px}
.d-close:hover{color:var(--t1);border-color:var(--line2)}
.d-plat{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.d-handle{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:3px 0 3px;word-break:break-all}
.d-sub{color:var(--t2);font-size:12.5px;margin-bottom:18px}
.d-chart{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:14px}
.d-chart h4{font-size:10.5px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.d-kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.d-cell{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.d-cell b{display:block;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.d-cell span{font-size:10px;color:var(--t3);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.d-edit{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:14px}
.d-edit h4{font-size:12px;color:var(--t1);font-weight:600;margin-bottom:10px}
.d-edit .row{display:flex;gap:8px;margin-bottom:9px}
.d-edit input{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--t1);border-radius:8px;
  padding:9px 11px;font:600 13.5px 'Inter',sans-serif;font-variant-numeric:tabular-nums;width:100%}
.d-edit input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.d-edit label{font-size:10.5px;color:var(--t2);font-weight:600;display:block;margin-bottom:4px}
.d-save{width:100%;padding:10px;border:none;border-radius:8px;cursor:pointer;
  font:600 13px 'Inter',sans-serif;color:#fff;background:var(--acc)}
.d-save:hover{filter:brightness(1.08)}
.d-save.alt{background:var(--card);color:var(--acc);border:1px solid var(--acc);margin-top:8px}
.d-link{display:inline-flex;align-items:center;gap:6px;color:var(--acc);text-decoration:none;font-size:13px;font-weight:600}
.d-link:hover{text-decoration:underline}
#scrim{position:fixed;inset:0;background:rgba(16,24,40,.32);z-index:35;display:none}
#scrim.open{display:block}

.empty{color:var(--t3);text-align:center;padding:60px 20px;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--t1);
  color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;font-weight:500;opacity:0;
  pointer-events:none;transition:.2s;z-index:60;box-shadow:0 12px 32px rgba(16,24,40,.28)}
.toast.on{opacity:1}
</style>
</head>
<body data-theme="">

<!-- ═════ GATE ═════ -->
<div id="gate">
  <div class="gate-card">
    <div class="g-mark">AC</div>
    <h1>Account Center</h1>
    <div class="gsub">Cross-platform account intelligence. Restricted to admin and CL7–9 leads.</div>
    <div class="gtabs">
      <div class="gtab on" id="gt-lead" onclick="gateMode('lead')">Lead sign-in</div>
      <div class="gtab" id="gt-adm" onclick="gateMode('adm')">Admin</div>
    </div>
    <div id="g-lead">
      <input id="g-id" placeholder="Employee ID" autocomplete="off">
      <input id="g-pin" type="password" placeholder="PIN">
    </div>
    <div id="g-adm" style="display:none">
      <input id="g-pass" type="password" placeholder="Admin password">
    </div>
    <button class="gbtn" id="g-go" onclick="gateGo()">Sign in</button>
    <div class="gerr" id="g-err"></div>
  </div>
</div>

<!-- ═════ APP ═════ -->
<div id="app">
<div class="deck">
  <div class="rail" id="rail"></div>
  <div class="main">
    <div class="tops">
      <h2 id="view-title">Overview<span>· all accounts, one frame</span></h2>
      <input class="search" id="q" placeholder="Search handle, owner, tool…" oninput="render()">
      <select class="ctl" id="sort" onchange="render()">
        <option value="move">Biggest movers</option>
        <option value="num">Highest number</option>
        <option value="fresh">Recently updated</option>
        <option value="handle">Handle A–Z</option>
      </select>
      <select class="ctl" id="live" onchange="render()">
        <option value="1">Active only</option>
        <option value="">Include inactive</option>
      </select>
      <button class="ib" id="scrape-btn" style="display:none" onclick="scrapeVisible()">Scrape visible</button>
      <button class="ib" id="scrape-all-btn" onclick="scrapeAllIG()">Scrape all IG</button>
      <button class="ib" onclick="loadAll(true)" title="Refresh">Refresh</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <!-- Per-platform breakdown (Overview only): active vs inactive, click to open that platform. -->
    <div class="platboard" id="platboard" style="display:none"></div>
    <div id="grid"></div>
    <div class="empty" id="empty" style="display:none">No accounts match this view.</div>
  </div>
</div>
</div>

<div id="scrim" onclick="closeDrawer()"></div>
<div id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbwK8rVJlkv5YLgNLe7cGIz73KJc0hedmZcutoiRviDEowiZPglzBnznswBaZ0TVIV8t/exec';
var ALTR_API='https://script.google.com/macros/s/AKfycbxp7wcIf48urxm2DcPoNgdmQreYUGia-YNnXwIXfyMqOLkyWpaqI3hoMZa4VPmjZa9_Mg/exec';

var PLATS={
  reddit:{ n:'Reddit',    c:'var(--reddit)', hex:'#d93a00', metric:'karma',     link:function(h){return 'https://www.reddit.com/user/'+encodeURIComponent(h);} },
  x:     { n:'X',         c:'var(--x)',      hex:'#111827', metric:'followers', link:function(h){return 'https://x.com/'+encodeURIComponent(h.replace(/^@+/,''));} },
  ig:    { n:'Instagram', c:'var(--ig)',     hex:'#c13584', metric:'followers', link:function(h){return 'https://www.instagram.com/'+encodeURIComponent(h.replace(/^@+/,''));} },
  snap:  { n:'Snapchat',  c:'var(--snap)',   hex:'#b48b00', metric:'friends',   link:function(h){return 'https://www.snapchat.com/add/'+encodeURIComponent(h);} },
  altr:  { n:'ALTR · IG', c:'var(--altr)',   hex:'#0369a1', metric:'followers', link:function(h){return 'https://www.instagram.com/'+encodeURIComponent(h.replace(/^@+/,''));} }
};
var PLAT_FB={ n:'Other', c:'var(--acc)', hex:'#4f46e5', metric:'followers', link:function(){return null;} };
/* NOT ACTIVE (his rule, Aug 25): a suspended / blacked-out / logged-out account is NOT an active
   account and must never be counted as one. Anything listed here is excluded from every "active"
   number on the page and reported separately under Inactive. */
var DEAD=['banned','suspended','tempban','closed','dead','archived',
          'blackout','blacked_out','blocked','logged_out','loggedout','logout',
          'inactive','disabled','deactivated','paused','onhold','on_hold','restricted','shadowban','shadowbanned'];
var STATUS_COLORS={ banned:'#dc2626', suspended:'#dc2626', tempban:'#d97706', recovery:'#d97706',
  warmup:'#d97706', warming:'#d97706', onhold:'#6b7280', reserved:'#6b7280', flagged:'#d97706', rest:'#6b7280' };

var AUTH=null;
var DATA={ accounts:[], metrics:{}, snaps:{}, names:{}, who:'' };
var VIEW='all';

/* ── gate ── */
function gateMode(m){
  document.getElementById('gt-lead').classList.toggle('on',m==='lead');
  document.getElementById('gt-adm').classList.toggle('on',m==='adm');
  document.getElementById('g-lead').style.display=(m==='lead')?'block':'none';
  document.getElementById('g-adm').style.display=(m==='adm')?'block':'none';
  window._gm=m;
}
window._gm='lead';
function authQS(){
  if(!AUTH) return '';
  return AUTH.mode==='adm' ? ('&pass='+encodeURIComponent(AUTH.pass))
       : ('&viewer_id='+encodeURIComponent(AUTH.id)+'&pin='+encodeURIComponent(AUTH.pin));
}
async function gateGo(){
  var btn=document.getElementById('g-go'), err=document.getElementById('g-err');
  err.style.display='none';
  var cand=(window._gm==='adm')
    ? { mode:'adm', pass:document.getElementById('g-pass').value }
    : { mode:'lead', id:document.getElementById('g-id').value.trim(), pin:document.getElementById('g-pin').value.trim() };
  if(cand.mode==='lead' && (!cand.id||!cand.pin)){ err.textContent='Enter your Employee ID and PIN.'; err.style.display='block'; return; }
  if(cand.mode==='adm' && !cand.pass){ err.textContent='Enter the admin password.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Verifying…';
  AUTH=cand;
  var ok=await loadAll();
  btn.disabled=false; btn.textContent='Sign in';
  if(ok){
    try{ sessionStorage.setItem('acctc_auth', JSON.stringify(AUTH)); }catch(e){}
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    AUTH=null;
    err.textContent='Not authorized — wrong credentials, or not a CL7–9 lead.';
    err.style.display='block';
  }
}

/* ── data ── */
async function loadAll(isRefresh){
  try{
    if(isRefresh) toast('Refreshing…');
    var pMain=fetch(API+'?action=acct_center'+authQS()+'&_='+Date.now()).then(function(r){return r.json();});
    var pAltr=fetch(ALTR_API+'?action=state&_='+Date.now()).then(function(r){return r.json();}).catch(function(){return null;});
    var pNames=fetch(API+'?action=get_all_employees&_='+Date.now()).then(function(r){return r.json();}).catch(function(){return null;});
    var d=await pMain;
    if(!d || !d.ok){ return false; }
    DATA.who=d.who||'';
    DATA.metrics=d.metrics||{};
    DATA.snaps={};
    (d.snaps||[]).forEach(function(s){ (DATA.snaps[s[1]]=DATA.snaps[s[1]]||[]).push({d:s[0],f:s[2],k:s[3]}); });
    Object.keys(DATA.snaps).forEach(function(k){ DATA.snaps[k].sort(function(a,b){ return a.d<b.d?-1:1; }); });
    var accounts=(d.accounts||[]);
    var alt=await pAltr;
    if(alt && alt.accounts){
      alt.accounts.forEach(function(a){
        var h=String(a.handle||a.acct||'').trim(); if(!h) return;
        accounts.push({ key:('altr|altr|'+h).toLowerCase(), plat:'altr', tool:'ALTR Media', proj:'ALTR',
          handle:h, status:String(a.status||'active'), day:0, owner:'',
          followers_live:(parseInt(a.followers,10)||null), karma:null, link:a.link||'' });
      });
    }
    DATA.accounts=accounts;
    var nm=await pNames;
    if(nm && nm.employees){ nm.employees.forEach(function(e){ DATA.names[String(e.employee_id).toLowerCase()]=e.full_name||e.employee_id; }); }
    buildRail(); render();
    if(isRefresh) toast('Refreshed.');
    return true;
  }catch(e){ return false; }
}

/* ── derived numbers ── */
function numOf(a){
  var m=DATA.metrics[a.key]||{};
  var plat=PLATS[a.plat]||PLAT_FB;
  if(plat.metric==='karma'){
    var k=(a.karma!=null)?a.karma:(m.karma!=null?m.karma:null);
    return { v:k, label:'karma' };
  }
  /* freshest wins: today's VA gate entry (board meta) → lead's manual entry → ALTR live scrape */
  var f=(a.fol!=null && a.mday)?a.fol:(m.followers!=null?m.followers:(a.fol!=null?a.fol:(a.followers_live!=null?a.followers_live:null)));
  return { v:f, label:plat.metric };
}
function seriesOf(a){
  var sn=DATA.snaps[a.key]||[];
  var useK=(PLATS[a.plat]||{}).metric==='karma';
  var out=[]; sn.forEach(function(s){ var v=useK?s.k:s.f; if(v!=null) out.push({d:s.d,v:v}); });
  return out;
}
function deltaOf(a){
  var s=seriesOf(a); if(s.length<2) return null;
  var last=s[s.length-1];
  var target=null;
  for(var i=s.length-2;i>=0;i--){ target=s[i]; var days=(new Date(last.d)-new Date(s[i].d))/86400000; if(days>=6) break; }
  if(!target) return null;
  var base=target.v||0;
  var abs=last.v-target.v;
  var pct=base>0 ? (abs/base*100) : (abs>0?100:0);
  return { abs:abs, pct:pct };
}
function freshOf(a){
  var m=DATA.metrics[a.key]||{};
  var s=seriesOf(a);
  var td=new Date().toISOString().slice(0,10);
  if(a.mday===td) return 'updated today';
  if(a.plat==='altr'||a.plat==='reddit') return 'auto';
  var at=m.at?new Date(String(m.at).replace(' ','T')):null;
  if(!at||isNaN(at)) return s.length?'—':'no data';
  var ddays=Math.floor((Date.now()-at.getTime())/86400000);
  return ddays<=0?'updated today':(ddays+'d old');
}
function isDead(a){
  var s=String(a.status||'').toLowerCase().replace(/[\s-]+/g,'_');
  return DEAD.indexOf(s)>=0;
}
/* Direct link to the account ON its platform (X, IG, Reddit, Snapchat, ALTR-IG).
   A stored link from the source tool wins; otherwise the platform builds it from the handle. */
function platUrl(a){
  if(a.link && /^https?:/i.test(String(a.link))) return String(a.link);
  var p=PLATS[a.plat]||PLAT_FB;
  try{ return p.link(String(a.handle||'')) || null; }catch(e){ return null; }
}
function openPlat(key, ev){
  try{ if(ev){ ev.stopPropagation(); ev.preventDefault(); } }catch(_e){}
  var a=DATA.accounts.filter(function(x){ return x.key===key; })[0]; if(!a) return;
  var u=platUrl(a);
  if(!u){ toast('No profile link for this account.'); return; }
  window.open(u,'_blank','noopener');
}
function moveTag(a){
  var d=deltaOf(a); if(!d) return '';
  if(d.pct>=20) return '<span class="mv up">Rising</span>';
  if(d.pct<=-20) return '<span class="mv dn">Falling</span>';
  return '';
}

/* ── rail + theme ── */
function buildRail(){
  var counts={}; DATA.accounts.forEach(function(a){ if(!isDead(a)) counts[a.plat]=(counts[a.plat]||0)+1; });
  var total=DATA.accounts.filter(function(a){return !isDead(a);}).length;
  var html='<div class="brand"><div class="b-mark">AC</div><div><b>Account Center</b><span>JMB Virtuals</span></div></div>';
  function rl(id,label,color,n,glyph){
    return '<div class="rl'+(VIEW===id?' on':'')+'" onclick="setView(\''+id+'\')">'+
      (color?('<span class="dot" style="background:'+color+'"></span>'):('<span class="glyph">'+(glyph||'')+'</span>'))+
      '<span>'+label+'</span>'+(n!=null?('<span class="n">'+n+'</span>'):'')+'</div>';
  }
  html+='<div class="rlab">Views</div>';
  html+=rl('all','Overview',null,total,'▦');
  html+=rl('movers','Movers',null,null,'↗');
  html+=rl('stale','Stale numbers',null,null,'◌');
  html+='<div class="rlab">Platforms</div>';
  Object.keys(PLATS).forEach(function(p){
    if(!counts[p]) return;
    html+=rl(p,PLATS[p].n,PLATS[p].hex,counts[p]);
  });
  html+='<div class="who">Signed in as <b>'+esc(DATA.who||'—')+'</b></div>';
  html+=rl('__out','Sign out',null,null,'→');
  document.getElementById('rail').innerHTML=html;
}
function setView(v){
  if(v==='__out'){ try{ sessionStorage.removeItem('acctc_auth'); }catch(e){} location.reload(); return; }
  VIEW=v;
  /* The selected platform sets the page accent — a working context cue, kept deliberately quiet. */
  document.body.dataset.theme = PLATS[v] ? v : '';
  var vt=document.getElementById('view-title');
  if(vt) vt.innerHTML = (PLATS[v] ? esc(PLATS[v].n) : (v==='movers'?'Movers':(v==='stale'?'Stale numbers':'Overview')))+
    '<span>· '+(PLATS[v]?'platform view':(v==='movers'?'±20% in 7 days':(v==='stale'?'no update in 7+ days':'all accounts, one frame')))+'</span>';
  buildRail(); render();
}

/* ── render ── */
function render(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var sort=document.getElementById('sort').value;
  var liveOnly=!!document.getElementById('live').value;
  var rows=DATA.accounts.slice();
  if(liveOnly) rows=rows.filter(function(a){ return !isDead(a); });
  if(VIEW!=='all'&&VIEW!=='movers'&&VIEW!=='stale') rows=rows.filter(function(a){ return a.plat===VIEW; });
  if(VIEW==='movers') rows=rows.filter(function(a){ var d=deltaOf(a); return d && Math.abs(d.pct)>=20; });
  if(VIEW==='stale') rows=rows.filter(function(a){
    if(a.plat==='altr'||a.plat==='reddit') return false;      // auto-fed
    var td=new Date().toISOString().slice(0,10);
    if(a.mday===td) return false;
    var m=DATA.metrics[a.key]||{};
    if(!m.at) return true;
    return (Date.now()-new Date(String(m.at).replace(' ','T')).getTime())>7*86400000;
  });
  if(q) rows=rows.filter(function(a){
    return a.handle.toLowerCase().indexOf(q)>=0 || (DATA.names[a.owner]||a.owner||'').toLowerCase().indexOf(q)>=0 || a.tool.toLowerCase().indexOf(q)>=0;
  });
  rows.sort(function(a,b){
    if(sort==='move'){ var da=deltaOf(a),db=deltaOf(b); return (db?Math.abs(db.pct):-1)-(da?Math.abs(da.pct):-1); }
    if(sort==='num'){ return (numOf(b).v||0)-(numOf(a).v||0); }
    if(sort==='handle'){ return a.handle.localeCompare(b.handle); }
    if(sort==='fresh'){ var ma=(DATA.metrics[a.key]||{}).at||'', mb=(DATA.metrics[b.key]||{}).at||''; return mb.localeCompare(ma); }
    return 0;
  });
  var live=DATA.accounts.filter(function(a){return !isDead(a);});
  var fsum=0; live.forEach(function(a){ var n=numOf(a); if(n.label!=='karma'&&n.v) fsum+=n.v; });
  var risers=0,fallers=0;
  live.forEach(function(a){ var d=deltaOf(a); if(d&&d.pct>=20)risers++; else if(d&&d.pct<=-20)fallers++; });
  var deadN=DATA.accounts.length-live.length;
  /* PLATFORM VIEW gets its own KPI row: that platform's active count, its inactive count, and
     the audience behind the ACTIVE accounts only. The Overview keeps the whole-network numbers. */
  var isPlatView=!!PLATS[VIEW];
  if(isPlatView){
    var pAll=DATA.accounts.filter(function(a){ return a.plat===VIEW; });
    var pLive=pAll.filter(function(a){ return !isDead(a); });
    var pDead=pAll.length-pLive.length;
    var pSum=0; pLive.forEach(function(a){ var n=numOf(a); if(n.label!=='karma'&&n.v) pSum+=n.v; });
    var pRise=0,pFall=0; pLive.forEach(function(a){ var d=deltaOf(a); if(d&&d.pct>=20)pRise++; else if(d&&d.pct<=-20)pFall++; });
    document.getElementById('kpis').innerHTML=
      kpi(pLive.length,'Active accounts','var(--t1)')+
      kpi(pDead,'Inactive · not counted', pDead?'var(--dn)':'var(--t3)')+
      kpi(pAll.length,'Total on platform','var(--t3)')+
      kpi(fmtN(pSum),'Audience · active only','var(--t1)')+
      kpi(pRise,'Rising · 7d', pRise?'var(--up)':'var(--t3)')+
      kpi(pFall,'Falling · 7d', pFall?'var(--dn)':'var(--t3)');
  } else {
  document.getElementById('kpis').innerHTML=
    kpi(live.length,'Active accounts','var(--t1)')+
    kpi(fmtN(fsum),'Audience tracked','var(--t1)')+
    kpi(risers,'Rising · 7d', risers?'var(--up)':'var(--t3)')+
    kpi(fallers,'Falling · 7d', fallers?'var(--dn)':'var(--t3)')+
    kpi(deadN,'Inactive / banned', deadN?'var(--dn)':'var(--t3)');
  }
  /* Per-platform breakdown strip on the Overview — active vs inactive at a glance, each card
     clicking through to that platform's own dashboard. */
  var pb=document.getElementById('platboard');
  if(pb){
    if(VIEW==='all'){
      var byP={};
      DATA.accounts.forEach(function(a){
        var b=byP[a.plat]||(byP[a.plat]={live:0,dead:0});
        if(isDead(a)) b.dead++; else b.live++;
      });
      var order=Object.keys(PLATS).filter(function(p){ return byP[p]; });
      Object.keys(byP).forEach(function(p){ if(order.indexOf(p)<0) order.push(p); });
      pb.innerHTML=order.map(function(p){
        var P=PLATS[p]||PLAT_FB, b=byP[p], tot=b.live+b.dead;
        var pct=tot?Math.round(b.live/tot*100):0;
        return '<div class="pcard" onclick="setView(\''+p+'\')" title="Open the '+esc(P.n)+' dashboard">'+
          '<div class="pc-h"><span class="pdot" style="background:'+P.hex+'"></span><b>'+esc(P.n)+'</b></div>'+
          '<div class="pc-n">'+b.live+'<small>active</small></div>'+
          '<div class="pc-bar"><i style="width:'+pct+'%;background:'+P.hex+'"></i></div>'+
          '<div class="pc-s">'+(b.dead?('<span class="pc-dead">'+b.dead+' inactive</span>'):'<span class="pc-ok">all active</span>')+
            '<span class="pc-tot">'+tot+' total</span></div>'+
        '</div>';
      }).join('');
      pb.style.display=order.length?'grid':'none';
    } else { pb.style.display='none'; }
  }
  var g=document.getElementById('grid');
  g.innerHTML=rows.length
    ? '<table class="lst"><thead><tr>'+
        '<th>Platform</th><th>Account</th><th class="hide-sm">Handler</th><th>Status</th>'+
        '<th class="r">Number</th><th class="r">7d change</th><th class="hide-md">Trend · 15d</th><th class="hide-md">Updated</th><th></th>'+
      '</tr></thead><tbody>'+rows.map(rowHtml).join('')+'</tbody></table>'
    : '';
  document.getElementById('empty').style.display=rows.length?'none':'block';
  window._lastRows=rows;
  var sb=document.getElementById('scrape-btn');
  if(sb) sb.style.display=(VIEW==='ig'||VIEW==='altr')?'inline-block':'none';
}
function kpi(v,l,c){ return '<div class="kpi" style="--kc:'+c+'"><b>'+v+'</b><span>'+l+'</span></div>'; }
function fmtN(n){ if(n==null) return '—'; if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=10000) return (n/1000).toFixed(1)+'k'; return String(n); }
function rowHtml(a){
  var p=PLATS[a.plat]||PLAT_FB;
  var n=numOf(a), d=deltaOf(a);
  var dHtml=d
    ? '<span class="delta '+(d.abs>0?'up':(d.abs<0?'dn':'flat'))+'">'+(d.abs>0?'▲':(d.abs<0?'▼':'—'))+' '+(Math.abs(d.pct)>=1?Math.abs(d.pct).toFixed(0)+'%':Math.abs(d.abs))+'</span>'
    : '<span class="delta flat">—</span>';
  var st=String(a.status||'').toLowerCase();
  var sc=STATUS_COLORS[st]||'#059669';
  var owner=DATA.names[a.owner]||a.owner||'—';
  var fresh=freshOf(a);
  return '<tr onclick="openDrawer(\''+esc(a.key)+'\')">'+
    '<td class="l-plat"><span class="pdot" style="background:'+p.hex+'"></span>'+p.n+'</td>'+
    '<td><div class="l-handle">'+esc(a.handle)+moveTag(a)+'</div><div class="l-tool">'+esc(a.tool)+(a.day?(' · day '+a.day):'')+'</div></td>'+
    '<td class="l-owner hide-sm">'+esc(owner.split(',')[0])+'</td>'+
    '<td><span class="spill" style="color:'+sc+';background:'+sc+'14">'+esc(a.status||'—')+'</span></td>'+
    '<td class="r"><span class="l-num">'+fmtN(n.v)+'<small>'+n.label+'</small></span></td>'+
    '<td class="r">'+dHtml+'</td>'+
    '<td class="hide-md">'+sparkSvg(seriesOf(a), p.hex)+'</td>'+
    '<td class="l-fresh hide-md'+(fresh==='updated today'||fresh==='auto'?' ok':'')+'">'+fresh+'</td>'+
    /* Straight to the account on its own platform — stopPropagation so it doesn't open the drawer. */
    '<td class="r">'+(platUrl(a)
      ? '<button class="goplat" onclick="openPlat(\''+esc(a.key)+'\',event)" title="Open '+esc(a.handle)+' on '+esc(p.n)+'">Open ↗</button>'
      : '')+'</td>'+
  '</tr>';
}
function sparkSvg(s, color){
  if(!s || s.length<2) return '<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none"><line x1="0" y1="26" x2="100" y2="26" stroke="#e6e8ee" stroke-width="1.5" stroke-dasharray="3 4"/></svg>';
  var vs=s.map(function(x){return x.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  var span=(mx-mn)||1;
  var pts=s.map(function(x,i){
    var px=(i/(s.length-1))*100;
    var py=28-((x.v-mn)/span)*24;
    return px.toFixed(1)+','+py.toFixed(1);
  });
  return '<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>'+
    '<polygon points="0,32 '+pts.join(' ')+' 100,32" fill="'+color+'" opacity=".06"/>'+
  '</svg>';
}

/* ── drawer ── */
var CUR=null;
function openDrawer(key){
  var a=DATA.accounts.filter(function(x){return x.key===key;})[0]; if(!a) return;
  CUR=a;
  var p=PLATS[a.plat]||PLAT_FB;
  var n=numOf(a), d=deltaOf(a), m=DATA.metrics[a.key]||{};
  var link=(a.link)||(p.link?p.link(a.handle):null);
  var owner=DATA.names[a.owner]||a.owner||'—';
  var canKarma=(p.metric==='karma');
  document.getElementById('drawer').innerHTML=
    '<button class="d-close" onclick="closeDrawer()">✕</button>'+

    '<div class="d-handle">'+esc(a.handle)+'</div>'+
    '<div class="d-sub">'+esc(a.status||'—')+(a.day?(' · day '+a.day):'')+' · handled by '+esc(owner)+'</div>'+
    '<div class="d-chart"><h4>'+(canKarma?'Karma':(p.metric==='friends'?'Friends':'Followers'))+' · last 15 days</h4>'+bigChart(seriesOf(a),p.hex)+'</div>'+
    '<div class="d-kv">'+
      '<div class="d-cell"><b>'+fmtN(n.v)+'</b><span>current '+n.label+'</span></div>'+
      ((a.plat==='ig'||a.plat==='altr')?('<div class="d-cell"><b>'+fmtN(m.following!=null?m.following:null)+'</b><span>following</span></div>'):'')+
      '<div class="d-cell"><b style="color:'+(d?(d.abs>0?'var(--up)':(d.abs<0?'var(--dn)':'var(--t2)')):'var(--t3)')+'">'+(d?((d.abs>0?'+':'')+fmtN(d.abs)):'—')+'</b><span>change · 7 days</span></div>'+
      '<div class="d-cell"><b>'+esc(freshOf(a))+'</b><span>freshness</span></div>'+
      '<div class="d-cell"><b>'+esc((m.by||'—'))+'</b><span>last updated by</span></div>'+
    '</div>'+
    '<div class="d-edit"><h4>Update the numbers — exactly what the platform shows now</h4>'+
      '<div class="row">'+
        (canKarma
          ? '<div style="flex:1"><label>Karma</label><input id="ed-karma" inputmode="numeric" placeholder="'+(n.v!=null?n.v:'—')+'"></div>'
          : '<div style="flex:1"><label>'+(p.metric==='friends'?'Friends':'Followers')+'</label><input id="ed-fol" inputmode="numeric" placeholder="'+(n.v!=null?n.v:'—')+'"></div>')+
      '</div>'+
      '<button class="d-save" onclick="saveMetric()">Save &amp; snapshot today</button>'+
      ((a.plat==='ig'||a.plat==='altr')?('<button class="d-save alt" onclick="scrapeIG()">Pull live from IG scraper</button>'):'')+
    '</div>'+
    (link?('<a class="d-link" target="_blank" rel="noopener" href="'+esc(link)+'">Open on '+p.n+' ↗</a>'):'');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}
function bigChart(s, color){
  if(!s||s.length<2) return '<div style="color:var(--t3);font-size:12px;padding:22px 4px;text-align:center">Not enough history yet — the daily snapshot builds this automatically.</div>';
  var vs=s.map(function(x){return x.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs), span=(mx-mn)||1;
  var pts=s.map(function(x,i){ return ((i/(s.length-1))*100).toFixed(1)+','+(44-((x.v-mn)/span)*36).toFixed(1); });
  return '<svg viewBox="0 0 100 50" style="width:100%;height:120px" preserveAspectRatio="none">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linecap="round"/>'+
    '<polygon points="0,50 '+pts.join(' ')+' 100,50" fill="'+color+'" opacity=".07"/>'+
    '</svg>'+
    '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3)" class="num"><span>'+s[0].d.slice(5)+' · '+fmtN(mn)+'</span><span>'+s[s.length-1].d.slice(5)+' · '+fmtN(mx)+'</span></div>';
}
async function saveMetric(){
  if(!CUR) return;
  var f=document.getElementById('ed-fol'), k=document.getElementById('ed-karma');
  var fv=f?String(f.value).replace(/[^0-9]/g,''):'';
  var kv=k?String(k.value).replace(/[^0-9]/g,''):'';
  if(!fv&&!kv){ toast('Type the current number first.'); return; }
  try{
    var url=API+'?action=acct_metric_set'+authQS()
      +'&key='+encodeURIComponent(CUR.key)
      +'&platform='+encodeURIComponent(CUR.plat)
      +'&project='+encodeURIComponent(CUR.proj||'')
      +'&handle='+encodeURIComponent(CUR.handle)
      +(fv?('&followers='+fv):'')+(kv?('&karma='+kv):'')+'&_='+Date.now();
    var d=await (await fetch(url)).json();
    if(d&&d.ok){
      DATA.metrics[CUR.key]={ followers:(d.followers===''?null:Number(d.followers)),
        following:(d.following===''?null:(d.following!=null?Number(d.following):((DATA.metrics[CUR.key]||{}).following||null))),
        karma:(d.karma===''?null:Number(d.karma)),
        by:d.by||DATA.who, at:new Date().toISOString().slice(0,19).replace('T',' ') };
      var sn=DATA.snaps[CUR.key]=DATA.snaps[CUR.key]||[];
      var today=new Date().toISOString().slice(0,10);
      var last=sn[sn.length-1];
      var rec={ d:today, f:(fv?Number(fv):null), k:(kv?Number(kv):null) };
      if(last&&last.d===today){ if(rec.f!=null)last.f=rec.f; if(rec.k!=null)last.k=rec.k; } else sn.push(rec);
      toast('Saved — snapshotted for today.');
      render(); openDrawer(CUR.key);
    } else toast('Not saved: '+((d&&d.error)||'unknown'));
  }catch(e){ toast('Connection error.'); }
}

/* ── IG SCRAPER BRIDGE — reuses ALTR's worker/RapidAPI pipe so IG numbers can be pulled instead
   of typed. One account from the drawer, or every visible IG account in a slow, polite queue
   (the scraping API rate-limits hard; 1.6s spacing keeps it happy). ── */
async function scrapeIG(){
  if(!CUR) return;
  toast('Contacting the scraper…');
  var d=await scrapeOne(CUR);
  if(!d){ toast('Scraper could not read this account (private, renamed, or rate-limited).'); return; }
  toast('Pulled '+fmtN(d.count)+' followers'+(d.following!=null?(' · '+fmtN(d.following)+' following'):'')+' — saved.');
  render(); openDrawer(CUR.key);
}
async function scrapeOne(a){
  try{
    var h=String(a.handle||'').replace(/^@+/,'');
    var d=await (await fetch(ALTR_API+'?action=ig_debug&handle='+encodeURIComponent(h)+'&_='+Date.now())).json();
    var c=(d&&d.count!==''&&d.count!=null)?Number(d.count):null;
    var fw=(d&&d.following!==''&&d.following!=null)?Number(d.following):null;
    if(c==null) return null;
    var url=API+'?action=acct_metric_set'+authQS()
      +'&key='+encodeURIComponent(a.key)+'&platform='+encodeURIComponent(a.plat)
      +'&project='+encodeURIComponent(a.proj||'')+'&handle='+encodeURIComponent(a.handle)
      +'&followers='+c+(fw!=null?('&following='+fw):'')+'&_='+Date.now();
    var r=await (await fetch(url)).json();
    if(!(r&&r.ok)) return null;
    DATA.metrics[a.key]={ followers:c, following:fw, karma:(DATA.metrics[a.key]||{}).karma||null,
      by:'IG scraper', at:new Date().toISOString().slice(0,19).replace('T',' ') };
    var sn=DATA.snaps[a.key]=DATA.snaps[a.key]||[];
    var td=new Date().toISOString().slice(0,10), last=sn[sn.length-1];
    if(last&&last.d===td) last.f=c; else sn.push({d:td,f:c,k:null});
    return { count:c, following:fw };
  }catch(e){ return null; }
}
var _bulkBusy=false, _bulkCancel=false;
async function _scrapeRun(rows, label){
  if(_bulkBusy){ toast('A scrape run is already going.'); return; }
  if(!rows.length){ toast('No IG accounts to scrape here.'); return; }
  _bulkBusy=true; _bulkCancel=false;
  var btn=document.getElementById('scrape-all-btn');
  var ok=0, fail=0;
  for(var i=0;i<rows.length;i++){
    if(_bulkCancel) break;
    if(btn) btn.textContent='Stop ('+(i+1)+'/'+rows.length+')';
    toast(label+' '+(i+1)+' of '+rows.length+' — '+rows[i].handle);
    var d=await scrapeOne(rows[i]);
    if(d) ok++; else fail++;
    if(i%5===4) render();                                   // repaint every few pulls, not every one
    await new Promise(function(r){ setTimeout(r,1600); });
  }
  _bulkBusy=false;
  if(btn) btn.textContent='Scrape all IG';
  render();
  toast((_bulkCancel?'Stopped — ':'Done — ')+ok+' pulled'+(fail?(' · '+fail+' unreadable (private or rate-limited)'):'')+'.');
}
async function scrapeVisible(){
  _scrapeRun((window._lastRows||[]).filter(function(a){ return a.plat==='ig'||a.plat==='altr'; }).slice(0,30), 'Scraping');
}
/* ONE BUTTON, EVERY INSTAGRAM — Dream IRL, Moma AND the whole ALTR board in a single queue.
   Runs at 1.6s per account (the scraping API rate-limits hard), so ~350 accounts is roughly
   ten minutes; the button turns into a live counter and clicking it again stops the run. */
async function scrapeAllIG(){
  if(_bulkBusy){ _bulkCancel=true; toast('Stopping after the current account…'); return; }
  var rows=DATA.accounts.filter(function(a){ return (a.plat==='ig'||a.plat==='altr') && !isDead(a); });
  if(!rows.length){ toast('No IG accounts loaded.'); return; }
  var mins=Math.max(1, Math.round(rows.length*1.6/60));
  if(!confirm('Scrape ALL Instagram accounts?\n\n'+rows.length+' accounts (Dream IRL + Moma + ALTR) · about '+mins+' minute'+(mins>1?'s':'')+' · uses the RapidAPI quota.\n\nYou can stop anytime by clicking the button again.')) return;
  _scrapeRun(rows, 'Scraping all IG');
}

/* ── misc ── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var _tt=null;
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(function(){ el.classList.remove('on'); },2600); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDrawer(); });
window.addEventListener('focus', function(){ if(AUTH && document.getElementById('app').style.display==='block') loadAll(); });

(function(){
  var saved=null; try{ saved=JSON.parse(sessionStorage.getItem('acctc_auth')||'null'); }catch(e){}
  if(saved){ AUTH=saved;
    loadAll().then(function(ok){
      if(ok){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; }
      else { AUTH=null; try{ sessionStorage.removeItem('acctc_auth'); }catch(e){} }
    });
  }
  document.getElementById('g-pin').addEventListener('keydown',function(e){ if(e.key==='Enter') gateGo(); });
  document.getElementById('g-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') gateGo(); });
})();
