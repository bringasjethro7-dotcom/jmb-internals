<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening Reddit…</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#171717;color:#f4f2ee;font:16px/1.4 -apple-system,system-ui,sans-serif;text-align:center}
.box{padding:28px;max-width:360px}
a.btn{display:block;margin-top:18px;padding:16px 20px;border-radius:14px;background:#ff4500;color:#fff;font-weight:700;text-decoration:none;font-size:17px}
small{display:block;margin-top:14px;color:#a8a29a}
</style></head><body><div class="box">
<div id="t">Opening the post in the Reddit app…</div>
<a class="btn" id="b" href="#">Open in Reddit app</a>
<small>If nothing happens, tap the button above.</small>
</div>
<script>
/* Reply Desk (Reddit Central): Telegram buttons can only carry https links, so the bot links here and this page hands
   the post to the Reddit app with its reddit:// link. Only reddit post paths are accepted. */
(function(){
  var p=(new URLSearchParams(location.search).get('p')||'').replace(/^\/+/,'');
  if(!/^r\/[A-Za-z0-9_]{2,40}\/comments\/[a-z0-9]{3,16}(\/[^?#\s]*)?$/.test(p)){ document.getElementById('t').textContent='This link is not a Reddit post.'; document.getElementById('b').style.display='none'; return; }
  var app='reddit://reddit.com/'+p;
  document.getElementById('b').href=app;
  location.href=app;
})();
</script></body></html>
