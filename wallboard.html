<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>JMB Virtuals — Office Login Codes</title>
<style>
  :root{
    --bg:#0b1020; --panel:#131a2e; --line:rgba(255,255,255,.10);
    --t1:#f4f7ff; --t2:#9fb0d6; --t3:#6b7d90;
    --o1:#ff8a4a; --o2:#ff6b1a; --green:#34d399; --amber:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(255,107,26,.16), transparent 60%),
      radial-gradient(1000px 620px at 100% 0%, rgba(56,189,248,.12), transparent 60%),
      var(--bg);
    color:var(--t1); font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    min-height:100%; overflow-x:hidden;
  }

  /* ── HEADER ── */
  .top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 40px 18px;}
  .brand{display:flex;align-items:center;gap:16px;min-width:0;}
  .brand-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--o1),var(--o2));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#1a1205;flex-shrink:0;
    box-shadow:0 8px 26px rgba(255,107,26,.4);}
  .brand-txt h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.2px;}
  .brand-txt p{margin:2px 0 0;font-size:13.5px;color:var(--t2);font-weight:500;}
  .top-right{display:flex;align-items:center;gap:18px;flex-shrink:0;}
  .clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;}
  .clock small{display:block;text-align:right;font-size:12px;color:var(--t2);font-weight:600;letter-spacing:.5px;margin-top:2px;}
  .status{font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;}
  .status.on{background:rgba(52,211,153,.16);color:var(--green);border-color:rgba(52,211,153,.4);}
  .status.window{background:rgba(52,211,153,.20);color:#8affc9;border-color:rgba(52,211,153,.5);}
  .status.off{background:rgba(148,163,184,.14);color:#c3ccdd;}
  .status.warn{background:rgba(251,191,36,.16);color:var(--amber);border-color:rgba(251,191,36,.4);}
  .lockbtn{background:none;border:1px solid var(--line);color:var(--t2);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:13px;}
  .lockbtn:hover{color:var(--t1);border-color:rgba(255,255,255,.3);}

  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent);margin:0 40px;}

  /* ── GRID ── */
  .wrap{padding:26px 40px 48px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;}
  .card{background:linear-gradient(180deg,var(--panel),#0e1424);border:1px solid var(--line);border-radius:20px;
    padding:24px 26px;position:relative;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.34);
    animation:pop .35s cubic-bezier(.2,1.1,.3,1) both;}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(180deg,var(--o1),var(--o2));}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
  .card .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .card .nm{font-size:22px;font-weight:700;}
  .card .id{font-size:14px;font-weight:600;color:var(--t3);}
  .card .code{font-size:76px;font-weight:800;letter-spacing:14px;line-height:.98;
    background:linear-gradient(180deg,#fff,#ffd9bd);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 30px rgba(255,138,74,.25);}
  .card .exp{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:var(--t2);font-weight:600;}
  .card .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.10);margin-top:10px;overflow:hidden;}
  .card .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--o1),var(--o2));transition:width .9s linear;}
  .card.soon .code{background:linear-gradient(180deg,#fff,#ffb0b0);-webkit-background-clip:text;background-clip:text;}
  .card.soon .bar > i{background:linear-gradient(90deg,#f87171,#ef4444);}

  /* ── EMPTY / OFF states ── */
  .msg{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;color:var(--t2);}
  .msg .big{font-size:30px;font-weight:800;color:var(--t1);}
  .msg .sub{font-size:16px;max-width:640px;line-height:1.55;}
  .msg .ico{width:76px;height:76px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:38px;}

  /* ── LOCK SCREEN ── */
  .lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .lock-card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 30px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.5);}
  .lock-card .brand-logo{margin:0 auto 18px;width:56px;height:56px;font-size:26px;}
  .lock-card h2{margin:0 0 6px;font-size:22px;font-weight:800;}
  .lock-card p{margin:0 0 22px;font-size:14px;color:var(--t2);line-height:1.5;}
  .lock-card input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#0c1223;color:var(--t1);
    font-size:16px;text-align:center;letter-spacing:1px;outline:none;}
  .lock-card input:focus{border-color:var(--o2);box-shadow:0 0 0 3px rgba(255,107,26,.2);}
  .lock-card button{width:100%;margin-top:14px;padding:14px;border-radius:12px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--o1),var(--o2));color:#1a1205;font-size:16px;font-weight:800;font-family:inherit;}
  .lock-err{color:#fca5a5;font-size:13px;margin-top:12px;min-height:16px;font-weight:600;}

  @media (max-width:640px){
    .top{padding:18px 20px 12px;flex-wrap:wrap;} .divider{margin:0 20px;} .wrap{padding:20px;}
    .clock{font-size:24px;} .card .code{font-size:60px;letter-spacing:10px;} .brand-txt h1{font-size:20px;}
  }
</style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div class="lock" id="lock">
    <div class="lock-card">
      <div class="brand-logo">JMB</div>
      <h2>Office Wallboard</h2>
      <p>Enter the office wallboard key to display live login codes on this screen. You only need to do this once on this monitor.</p>
      <input id="lock-key" type="password" placeholder="Wallboard key" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">
      <button onclick="unlock()">Unlock display</button>
      <div class="lock-err" id="lock-err"></div>
    </div>
  </div>

  <!-- WALLBOARD -->
  <div id="board" style="display:none;">
    <div class="top">
      <div class="brand">
        <div class="brand-logo">JMB</div>
        <div class="brand-txt">
          <h1>Office Login Codes</h1>
          <p>Ask for your code, then read it here to sign in.</p>
        </div>
      </div>
      <div class="top-right">
        <span class="status off" id="status">…</span>
        <div class="clock" id="clock">--:--<small id="clock-date"></small></div>
        <button class="lockbtn" onclick="relock()" title="Lock this display">🔒</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="wrap">
      <div class="grid" id="grid"></div>
    </div>
  </div>

<script>
  var API = "https://script.google.com/macros/s/AKfycbxbOUn-0xO4r8H4bw4nA7YMfVb0yByOLL4TuRPKvtPh2rjY-b3rOJ5aBoIc8sOmO9kP/exec";
  var KEY_STORE = "jmb_wall_key";
  var pollTimer = null, key = "";

  function esc(v){ return (v==null?'':String(v)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  // ── Clock ──
  function tickClock(){
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ap = h>=12?'PM':'AM'; var hh = h%12; if(hh===0) hh=12;
    var el = document.getElementById('clock');
    if(el) el.firstChild.nodeValue = hh+':'+(m<10?'0':'')+m+' '+ap;
    var dd = document.getElementById('clock-date');
    if(dd) dd.textContent = d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
  }

  // ── Lock / unlock ──
  function showLock(msg){
    document.getElementById('lock').style.display='flex';
    document.getElementById('board').style.display='none';
    if(msg){ document.getElementById('lock-err').textContent=msg; }
    if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
    var i=document.getElementById('lock-key'); if(i){ i.focus(); }
  }
  function startBoard(){
    document.getElementById('lock').style.display='none';
    document.getElementById('board').style.display='block';
    poll();
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, 4000);
  }
  function unlock(){
    var k = (document.getElementById('lock-key').value||'').trim();
    if(!k){ document.getElementById('lock-err').textContent='Enter the key.'; return; }
    // Validate against the backend before saving.
    document.getElementById('lock-err').textContent='Checking…';
    fetch(API+'?action=office_otp_board&pass='+encodeURIComponent(k)+'&_='+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){
        if(d && d.ok){ key=k; try{ localStorage.setItem(KEY_STORE,k); }catch(e){} startBoard(); }
        else { document.getElementById('lock-err').textContent='Wrong key. Try again.'; }
      })
      .catch(function(){ document.getElementById('lock-err').textContent='Network error. Try again.'; });
  }
  function relock(){
    try{ localStorage.removeItem(KEY_STORE); }catch(e){}
    key=''; var i=document.getElementById('lock-key'); if(i) i.value='';
    showLock('');
  }

  // ── Poll + render ──
  function poll(){
    fetch(API+'?action=office_otp_board&pass='+encodeURIComponent(key)+'&_='+Date.now())
      .then(function(r){return r.json();})
      .then(render)
      .catch(function(){ /* keep last frame on a network blip */ });
  }
  function render(d){
    if(!d || d.error){
      if(d && d.error==='UNAUTHORIZED'){ relock(); showLock('Key no longer valid.'); }
      return;
    }
    var st = document.getElementById('status');
    if(st){
      if(!d.on){ st.className='status off'; st.textContent='OFF — codes not required'; }
      else if(d.in_window){ st.className='status window'; st.textContent='● LIVE — office code required'; }
      else { st.className='status on'; st.textContent='ON — outside enforced hours'; }
    }
    var grid = document.getElementById('grid');
    var codes = d.codes || [];
    if(!codes.length){
      grid.innerHTML =
        '<div class="msg" style="grid-column:1/-1;">'+
          '<div class="ico">🔑</div>'+
          '<div class="big">'+(d.on ? 'Waiting for requests' : 'Codes are currently OFF')+'</div>'+
          '<div class="sub">'+(d.on
            ? 'On the login screen, tap “Request office code”. Your name and a 4-digit code will appear here within a couple of seconds.'
            : 'An admin can turn the office-code requirement on from the admin panel. When on, requested codes show here.')+'</div>'+
        '</div>';
      return;
    }
    grid.innerHTML = codes.map(function(c){
      var s = Math.max(0, c.expires_in|0), mm=Math.floor(s/60), ss=s%60;
      var pct = Math.max(0, Math.min(100, Math.round((s/300)*100)));
      var soon = s <= 60 ? ' soon' : '';
      return '<div class="card'+soon+'">'+
        '<div class="who"><span class="nm">'+esc(c.name)+'</span><span class="id">'+esc(c.id)+'</span></div>'+
        '<div class="code">'+esc(c.code)+'</div>'+
        '<div class="exp">⏳ expires in '+mm+':'+(ss<10?'0':'')+ss+'</div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '</div>';
    }).join('');
  }

  // Keep the screen awake on supported devices (best-effort).
  async function keepAwake(){ try{ if('wakeLock' in navigator){ await navigator.wakeLock.request('screen'); } }catch(e){} }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) keepAwake(); });

  // ── Boot ──
  tickClock(); setInterval(tickClock, 1000);
  try{ key = localStorage.getItem(KEY_STORE) || ''; }catch(e){ key=''; }
  if(key){ startBoard(); keepAwake(); } else { showLock(''); }
</script>
</body>
</html>
