<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTR Studio · music & reels promotion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════ ALTR STUDIO — night studio console (Oct 2026) ═══════════
   Its own look: dark console, lime + magenta on ink, waveform meters, vinyl discs for promoted audios.
   Nothing here is shared with Reddit Central — ALTR is music and reels promotion, not Reddit posting. */
:root{
  --bg:#0b0a14; --bg2:#100e1d; --s1:#15132a; --s2:#1b1836; --s3:#221e45; --s4:#2a2554;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13); --line3:rgba(255,255,255,.22);
  --ink:#f3f1ff; --ink2:#b8b3d9; --ink3:#7f79a6; --ink4:#55507a;
  --lime:#c6ff4d; --lime2:#a3e635; --mag:#ff3d9a; --mag2:#ff6ab3; --vio:#8b5cf6; --cy:#22d3ee; --amb:#fbbf24; --red:#ff4d6d; --grn:#34d399;
  --gl:linear-gradient(120deg,#c6ff4d 0%,#22d3ee 100%);
  --gm:linear-gradient(120deg,#ff3d9a 0%,#8b5cf6 100%);
  --gw:linear-gradient(90deg,#c6ff4d 0%,#22d3ee 55%,#8b5cf6 100%);
  --r:18px; --rs:12px;
  --sh:0 18px 50px -24px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.04) inset;
  --sidew:236px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;font-size:13.5px;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.22),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(255,61,154,.14),transparent 60%),radial-gradient(600px 380px at 40% 120%,rgba(34,211,238,.08),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cy)}
.h-d{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.01em}
.muted{color:var(--ink3)}
.lime{color:var(--lime)} .mag{color:var(--mag)} .cy{color:var(--cy)}
::selection{background:rgba(198,255,77,.35)}
input,select,textarea{background:var(--s2);border:1px solid var(--line2);border-radius:var(--rs);color:var(--ink);padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,255,77,.14)}
input::placeholder{color:var(--ink4)}
select option{background:#1b1836;color:#fff}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}

/* ── sign in ── */
#signin{position:relative;z-index:1;max-width:400px;margin:12vh auto 0;background:rgba(21,19,42,.85);border:1px solid var(--line2);border-radius:26px;padding:34px 30px;box-shadow:var(--sh);text-align:center;backdrop-filter:blur(16px)}
#signin .eq{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:34px;margin-bottom:16px}
#signin .eq i{width:6px;border-radius:3px;background:var(--gw);animation:eqb 1.1s ease-in-out infinite}
#signin .eq i:nth-child(2){animation-delay:-.2s}#signin .eq i:nth-child(3){animation-delay:-.4s}#signin .eq i:nth-child(4){animation-delay:-.6s}#signin .eq i:nth-child(5){animation-delay:-.8s}
@keyframes eqb{0%,100%{height:8px}50%{height:34px}}
#signin h1{font-size:24px}
#signin h1 em{font-style:normal;background:var(--gl);-webkit-background-clip:text;background-clip:text;color:transparent}
#signin p{color:var(--ink2);font-size:12.5px;margin-top:6px}
#signin input{width:100%;margin-top:10px;font-size:14px;padding:12px 14px}
#signin .go{width:100%;margin-top:14px;border:none;border-radius:var(--rs);padding:13px;font-weight:800;color:#0b0a14;background:var(--gl);font-size:14px;box-shadow:0 12px 30px -12px rgba(198,255,77,.6)}
#si-err{display:none;color:var(--mag2);font-size:12.5px;margin-top:10px}

/* ── console shell ── */
#app{display:none}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--sidew);z-index:40;padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:rgba(16,14,29,.86);border-right:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:12px;background:var(--gm);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -10px rgba(255,61,154,.8);position:relative;overflow:hidden}
.brand .lg i{position:absolute;bottom:9px;width:4px;border-radius:2px;background:#fff;animation:eqb 1.3s ease-in-out infinite}
.brand .lg i:nth-child(1){left:10px;animation-delay:-.1s}.brand .lg i:nth-child(2){left:17px;animation-delay:-.5s}.brand .lg i:nth-child(3){left:24px;animation-delay:-.9s}
.brand b{font-family:'Space Grotesk',sans-serif;font-size:17px;display:block;letter-spacing:-.01em}
.brand small{display:block;font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button,.nav a{display:flex;align-items:center;gap:11px;border:none;background:none;border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;color:var(--ink2);text-align:left;width:100%;text-decoration:none;transition:background .15s,color .15s}
.nav button svg,.nav a svg{opacity:.75;flex:none}
.nav button:hover,.nav a:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.nav button.on{background:var(--lime);color:#0b0a14;box-shadow:0 10px 28px -12px rgba(198,255,77,.8)}
.nav button.on svg{opacity:1}
.nav .sect{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);padding:14px 12px 4px}
.nav .bd{margin-left:auto;background:var(--mag);color:#fff;font-size:10px;font-weight:800;border-radius:100px;padding:1px 7px;min-width:18px;text-align:center}
.nav button.on .bd{background:#0b0a14;color:var(--lime)}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--gm);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;object-fit:cover;flex:none}
.me b{display:block;font-size:12.5px}
.me small{display:block;color:var(--ink3);font-size:10.5px;font-weight:700}
.so{border:1px solid var(--line2);background:none;border-radius:10px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--ink3);margin-left:auto}
.so:hover{color:var(--mag2);border-color:rgba(255,61,154,.5)}
main{margin-left:var(--sidew);padding:18px 26px 90px;max-width:1500px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:'Space Grotesk',sans-serif;font-size:26px;letter-spacing:-.02em}
.top h1 em{font-style:normal;background:var(--gl);-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{color:var(--ink2);font-size:12.5px;margin-top:3px}
.top .sp{flex:1}
.clock{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:100px;padding:6px 12px;font-weight:800;font-size:12px;color:var(--ink2);background:var(--s1)}
.clock i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.pres{display:flex;align-items:center}
.pres .pv{width:28px;height:28px;border-radius:50%;background:var(--gm);border:2px solid var(--bg);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;object-fit:cover}
.pres .pv:first-child{margin-left:0}
.pres .more{font-size:10.5px;font-weight:800;color:var(--ink3);margin-left:6px}
@media(max-width:900px){
  :root{--sidew:0px}
  .side{top:auto;right:0;width:100%;height:64px;flex-direction:row;padding:6px 8px;border-right:none;border-top:1px solid var(--line);align-items:center}
  .brand,.side .foot,.nav .sect{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button,.nav a{flex-direction:column;gap:3px;padding:6px 4px;font-size:10px;border-radius:10px}
  main{margin-left:0;padding:14px 12px 90px}
}

/* ── blocks ── */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px 18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:var(--rs);padding:9px 15px;font-weight:800;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--gl);color:#0b0a14;box-shadow:0 10px 24px -12px rgba(198,255,77,.7)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.mag{background:var(--gm);color:#fff;box-shadow:0 10px 24px -12px rgba(255,61,154,.7)}
.btn.sec{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--ink)}
.btn.sec:hover{border-color:var(--line3);background:rgba(255,255,255,.08)}
.btn.sm{padding:6px 11px;font-size:11.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1px solid var(--line2);background:none;border-radius:9px;padding:5px 9px;font-weight:700;font-size:11.5px;color:var(--ink2)}
.ghost:hover{border-color:var(--line3);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:3px 10px;font-size:11px;font-weight:800;background:var(--s3);color:var(--ink2);white-space:nowrap;border:1px solid transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button.chip{cursor:pointer;background:var(--s2);border-color:var(--line2)}
.chips button.chip.sel{background:var(--lime);color:#0b0a14;border-color:var(--lime)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.search{position:relative;display:flex;align-items:center}
.search input{height:40px;width:320px;max-width:100%;padding:0 40px 0 38px;border-radius:12px;background:var(--s2);font-weight:600}
.search>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--lime);width:16px;height:16px;pointer-events:none}
.search .kb{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:800 11px ui-monospace,Menlo,monospace;color:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:1px 7px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;border-radius:7px;background:var(--s4);color:var(--ink);font-size:14px}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sec-h{display:flex;align-items:center;gap:10px;margin:24px 0 12px}
.sec-h b{font-family:'Space Grotesk',sans-serif;font-size:15px}
.sec-h span{font-size:11.5px;color:var(--ink3);font-weight:700}
.sec-h hr{flex:1;border:none;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.lbl{font-size:10.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.empty{padding:40px 20px;text-align:center;color:var(--ink3);font-weight:600}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--s1) 0%,var(--s3) 50%,var(--s1) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;margin-bottom:14px;border:1px solid;font-weight:600}
.banner.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.35);color:#fde68a}
.banner.bad{background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.35);color:#fecdd3}
.banner.info{background:rgba(34,211,238,.07);border-color:rgba(34,211,238,.3);color:#cffafe}
.banner b{font-weight:800}
.ig{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.ig>*{grid-column:span 12}
@media(min-width:980px){ .ig>.s3{grid-column:span 3} .ig>.s4{grid-column:span 4} .ig>.s6{grid-column:span 6} .ig>.s8{grid-column:span 8} .ig>.s9{grid-column:span 9} }
.ch-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ch-h b{font-family:'Space Grotesk',sans-serif;font-size:14.5px}
.ch-h span{font-size:11.5px;color:var(--ink3);font-weight:600}
.ch-h .sp{flex:1}

/* ── meters ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px;position:relative;overflow:hidden}
.kpi .k-l{font-size:10.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.kpi .k-v{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin-top:6px;line-height:1}
.kpi .k-s{font-size:11.5px;color:var(--ink3);margin-top:5px;font-weight:600}
.kpi .glow{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;filter:blur(30px);opacity:.35}
.wave{display:flex;align-items:flex-end;gap:3px;height:34px}
.wave i{flex:1;border-radius:2px;background:var(--s4);min-width:2px;transition:background .3s}
.wave i.on{background:var(--gw);background-size:400% 100%;box-shadow:0 0 8px rgba(198,255,77,.25)}
.big{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;line-height:1}
.big small{font-size:15px;color:var(--ink3);margin-left:3px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink2)}
.legend b{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--ink);margin-right:3px}

/* ── promotions ── */
.promo{padding:16px 18px;position:relative;overflow:hidden;display:flex;gap:16px;align-items:center}
.promo::before{content:'';position:absolute;left:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,154,.22),transparent 65%);pointer-events:none}
.promo.partial::before{background:radial-gradient(circle,rgba(34,211,238,.2),transparent 65%)}
.promo.done{opacity:.85}
.disc{width:64px;height:64px;border-radius:50%;flex:none;position:relative;background:repeating-radial-gradient(circle at 50% 50%,#1b1836 0 2px,#262253 2px 4px);box-shadow:0 0 0 2px var(--line3),0 12px 30px -12px #000}
.disc::before{content:'';position:absolute;inset:18px;border-radius:50%;background:var(--gm)}
.promo.partial .disc::before{background:var(--gl)}
.disc::after{content:'';position:absolute;inset:29px;border-radius:50%;background:var(--bg)}
.promo.live .disc{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.promo .t{flex:1;min-width:0}
.promo .t b{font-family:'Space Grotesk',sans-serif;font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo .t small{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink3);font-size:11px;font-weight:700;margin-top:3px}
.promo .n{text-align:right;flex:none}
.promo .n .v{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1;cursor:pointer}
.promo .n .v:hover{color:var(--lime)}
.promo .n .g{font-size:11.5px;font-weight:800;margin-top:3px}
.promo .n .g.up{color:var(--lime)} .promo .n .g.dn{color:var(--mag2)} .promo .n .g.flat{color:var(--ink3)}
/* live = the hero: bigger disc with a pulsing halo, LIVE pill, equaliser bars — so what's being used right now is unmistakable (Jeth, Oct 5) */
.promo.hero{padding:22px 24px;gap:22px;min-height:150px}
.promo.hero::before{width:280px;height:280px;left:-70px;top:-90px}
.promo.hero .disc{width:92px;height:92px;animation:spin 5s linear infinite,halo 2.2s ease-out infinite}
.promo.hero .disc::before{inset:26px} .promo.hero .disc::after{inset:40px}
.promo.hero.partial .disc{animation-name:spin,halo2}
@keyframes halo{0%{box-shadow:0 0 0 2px var(--line3),0 0 0 0 rgba(255,61,154,.55)}100%{box-shadow:0 0 0 2px var(--line3),0 0 0 24px rgba(255,61,154,0)}}
@keyframes halo2{0%{box-shadow:0 0 0 2px var(--line3),0 0 0 0 rgba(34,211,238,.5)}100%{box-shadow:0 0 0 2px var(--line3),0 0 0 24px rgba(34,211,238,0)}}
.promo.hero .t b{font-size:21px;white-space:normal;line-height:1.15}
.promo.hero .t small{font-size:11.5px;margin-top:7px}
.promo.hero .t .row{margin-top:12px!important}
.promo.hero .rank{font-size:14px;padding:5px 13px}
.promo.hero .spark{width:200px;height:56px}
.promo.hero .n .v{font-size:42px} .promo.hero .n .g{font-size:12.5px;margin-top:5px}
.livebar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:10.5px;font-weight:800;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.livepill{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border-radius:100px;padding:3px 10px 3px 8px;font:800 11px 'Space Grotesk',sans-serif;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 6px 18px -8px rgba(255,77,109,.9)}
.livepill i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.eqz{display:inline-flex;align-items:flex-end;gap:2.5px;height:18px}
.eqz i{width:3px;border-radius:2px;background:var(--gw);background-size:400% 100%;animation:eqs .85s ease-in-out infinite;box-shadow:0 0 6px rgba(198,255,77,.5)}
.eqz i:nth-child(2){animation-delay:.12s;animation-duration:.95s} .eqz i:nth-child(3){animation-delay:.25s;animation-duration:.72s} .eqz i:nth-child(4){animation-delay:.07s;animation-duration:1.05s} .eqz i:nth-child(5){animation-delay:.32s;animation-duration:.9s}
@keyframes eqs{0%,100%{height:4px}50%{height:18px}}
.promo:not(.hero) .livebar{display:none}
@media(max-width:900px){ .promo.hero{flex-wrap:wrap;padding:18px} .promo.hero .spark{display:none} .promo.hero .t b{font-size:18px} }
/* archive = small: achieved promotions stay on the page but step back */
.promo.mini{padding:10px 12px;gap:10px}
.promo.mini .disc{width:40px;height:40px} .promo.mini .disc::before{inset:11px} .promo.mini .disc::after{inset:18px}
.promo.mini .t b{font-size:13px} .promo.mini .t small{font-size:10.5px}
.promo.mini .n .v{font-size:18px} .promo.mini .n .g{font-size:10.5px}
.promo.mini .spark{display:none} .promo.mini .rank{font-size:11px;padding:2px 8px}
.rank{display:inline-flex;align-items:center;gap:4px;background:var(--gm);color:#fff;border-radius:100px;padding:3px 10px;font:800 12px 'Space Grotesk',sans-serif;box-shadow:0 8px 20px -10px rgba(255,61,154,.8);cursor:pointer}
.rank.none{background:var(--s3);color:var(--ink3);box-shadow:none}
.spark{width:120px;height:36px;flex:none}
.spark polyline{fill:none;stroke:var(--lime);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(198,255,77,.6))}
.spark .area{fill:url(#sg);stroke:none}
.cov{font-size:11px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:6px}
.cov .pb{width:70px;height:6px;border-radius:100px;background:var(--s4);overflow:hidden}
.cov .pb i{display:block;height:100%;background:var(--gl)}
.alarm{border:1px solid rgba(255,61,154,.45);background:linear-gradient(120deg,rgba(255,61,154,.12),rgba(139,92,246,.12))}
.alarm .t b{color:#fff}
.hof{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.hof-c{padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;border-color:rgba(251,191,36,.35);background:linear-gradient(120deg,rgba(251,191,36,.08),rgba(255,61,154,.06) 60%,var(--s1))}
.hof-c.top{border-color:rgba(251,191,36,.7);box-shadow:0 0 0 1px rgba(251,191,36,.25),0 20px 50px -24px rgba(251,191,36,.6)}
.hof-c::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.25),transparent 65%);pointer-events:none}
.hof-c .trophy{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;line-height:1;color:#fde68a;text-shadow:0 0 18px rgba(251,191,36,.6);min-width:50px}
.hof-c .disc{width:36px;height:36px} .hof-c .disc::before{inset:10px} .hof-c .disc::after{inset:16px}
.hof-c .trophy small{display:block;font:800 9px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(253,230,138,.7);margin-bottom:4px}
.hof-c .disc::before{background:linear-gradient(120deg,#fbbf24,#ff3d9a)}
.hof-c .t{flex:1;min-width:0} .hof-c .t b{font-family:'Space Grotesk',sans-serif;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hof-c .t small{display:block;color:var(--ink3);font-size:11px;font-weight:700;margin-top:3px}
.rep{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rep:first-child{border-top:none}

/* ── phones ── */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.comp{margin-bottom:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.02)}
.comp-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.comp-h b{font-family:'Space Grotesk',sans-serif;font-size:13.5px}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.comp-grid .comp{margin:0;padding:12px 12px 10px}
.comp.dead{border-color:rgba(255,77,109,.45)}
.comp-h .pb{flex:1;min-width:36px;height:5px;border-radius:100px;background:var(--s4);overflow:hidden;margin-left:auto}
.comp-h .pb i{display:block;height:100%;background:var(--gl)}
.ph-list{display:flex;flex-direction:column;gap:5px}
.phr{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:var(--s2);border:1px solid var(--line2);cursor:pointer;user-select:none;min-width:0;overflow:hidden;transition:border-color .15s,transform .1s}
.phr:hover{border-color:var(--line3)} .phr:active{transform:scale(.99)}
.phr .st{width:9px;height:9px;border-radius:50%;flex:none}
.phr.connected .st{background:var(--lime);box-shadow:0 0 8px var(--lime)} .phr.disconnected .st{background:var(--red);box-shadow:0 0 8px var(--red)} .phr.issue .st{background:var(--amb);box-shadow:0 0 8px var(--amb)} .phr.hold .st{background:var(--ink4)}
.phr b{font-family:'Space Grotesk',sans-serif;font-size:13px;white-space:nowrap;flex:none}
.phr .stl{flex:none}
.phr .rs{font-size:10.5px;font-weight:700;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.phr .who{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.phr .who.none{color:var(--ink4);font-weight:600;font-style:italic}
.phr.disconnected,.phr.hold{opacity:.62} .phr.hold{border-style:dashed}
.phr .km{border:none;background:none;color:var(--ink3);width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;margin-right:-4px}
.phr .km:hover{background:var(--s4);color:var(--ink)}
.ph{position:relative;border:1px solid var(--line2);border-radius:14px;padding:11px 12px;background:var(--s2);cursor:pointer;user-select:none;transition:border-color .15s,transform .1s}
.ph:hover{border-color:var(--line3)} .ph:active{transform:scale(.985)}
.ph b{font-family:'Space Grotesk',sans-serif;font-size:14px;display:block}
.ph small{display:block;color:var(--ink3);font-size:10.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .st{position:absolute;top:11px;right:11px;width:10px;height:10px;border-radius:50%}
.ph.connected .st{background:var(--lime);box-shadow:0 0 10px var(--lime)} .ph.disconnected .st{background:var(--red);box-shadow:0 0 10px var(--red)} .ph.issue .st{background:var(--amb);box-shadow:0 0 10px var(--amb)} .ph.hold .st{background:var(--ink4)}
.ph.hold{opacity:.75;border-style:dashed}
.ph .rs{display:block;font-size:10.5px;font-weight:700;color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .km{position:absolute;right:6px;bottom:6px;border:none;background:none;color:var(--ink3);width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.ph .km:hover{background:var(--s4);color:var(--ink)}
.stl{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:2px 9px;font-size:10.5px;font-weight:800}
.stl.connected{background:rgba(198,255,77,.14);color:var(--lime)} .stl.disconnected{background:rgba(255,77,109,.16);color:#ff8fa3} .stl.issue{background:rgba(251,191,36,.14);color:#fde68a} .stl.hold{background:var(--s3);color:var(--ink3)}
.nextup{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,rgba(198,255,77,.1),rgba(34,211,238,.08));border:1px solid rgba(198,255,77,.35);border-radius:14px;padding:12px 14px;margin-top:12px}
.nextup .arrow{width:36px;height:36px;border-radius:11px;background:var(--gl);color:#0b0a14;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 18px -8px rgba(198,255,77,.7)}
.nextup b{font-family:'Space Grotesk',sans-serif;font-size:14.5px}
.nextup small{display:block;color:var(--ink2);font-size:11.5px;font-weight:600;margin-top:1px}

/* ── cells (same meaning as always: red target · orange queued · green posted) ── */
.cells{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cell{width:30px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font:800 11px ui-monospace,Menlo,monospace;border:1px solid var(--line2);background:var(--s2);color:var(--ink3);cursor:pointer;user-select:none;transition:transform .08s}
.cell:active{transform:scale(.92)}
.cell.s1{background:rgba(255,77,109,.2);border-color:rgba(255,77,109,.55);color:#ffb3c0} .cell.s2{background:rgba(255,159,28,.2);border-color:rgba(255,159,28,.6);color:#ffd59a} .cell.s3{background:rgba(198,255,77,.16);border-color:rgba(198,255,77,.5);color:var(--lime)}
.cells.locked .cell{opacity:.4;cursor:not-allowed}
.cell.post{width:48px;height:34px;font-size:12.5px}
.cell.post.s2{background:rgba(198,255,77,.18);border-color:var(--lime);color:var(--lime);box-shadow:0 0 14px -4px rgba(198,255,77,.6)}
.cell.post.nxt{box-shadow:0 0 0 3px rgba(198,255,77,.35);border-color:var(--lime)}
.addbox{width:28px;height:28px;border-radius:8px;border:1px dashed var(--ink4);background:none;color:var(--ink3);font-weight:800}
.addbox:hover{border-color:var(--lime);color:var(--lime)}
.ar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.ar:first-child{border-top:none}
.ar.nxt{background:rgba(198,255,77,.05)}
.ar.hold{opacity:.55}
.ar .h{min-width:170px;flex:0 0 auto}
.ar .h b{font-size:13px;display:block}
.ar .h small{display:block;color:var(--ink3);font-size:10.5px;font-weight:600}
.ar .by{font-size:10.5px;font-weight:800;color:#d8ccff;background:rgba(139,92,246,.22);border-radius:100px;padding:2px 8px}
.ar .notes{display:flex;gap:5px;flex:1;min-width:280px;flex-wrap:wrap}
.ar .notes input{flex:1 1 120px;min-width:0;padding:6px 9px;font-size:12px}
.ar .notes input.has{border-color:rgba(198,255,77,.4);background:rgba(198,255,77,.06)}
.ar .audsel{padding:6px 8px;font-size:11.5px;max-width:180px;color:var(--ink2)}
.ar .audsel.has{border-color:rgba(255,61,154,.5);color:#ffd1e6;background:rgba(255,61,154,.1)}
.ar .cnt{font-size:11.5px;font-weight:800;color:var(--ink3);white-space:nowrap} .ar .cnt b{color:var(--ink)}
.ar .tag{font-size:10.5px;font-weight:800;color:#fde68a;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);border-radius:100px;padding:2px 8px;cursor:pointer}
.grp{margin-bottom:12px;overflow:hidden}
.grp .gh{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--s2);border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.grp .gh b{font-family:'Space Grotesk',sans-serif;font-size:14px}
.grp .gh .pb{flex:1;min-width:120px;max-width:260px;height:7px;border-radius:100px;background:var(--s4);overflow:hidden}
.grp .gh .pb i{display:block;height:100%;background:var(--gl)}
.grp .gh .n{font-size:11.5px;font-weight:800;color:var(--ink3);white-space:nowrap}
.grp .gh .offn{font-size:11px;font-weight:700;color:var(--ink3);white-space:nowrap;border:1px dashed var(--line2);border-radius:100px;padding:2px 9px}
.grp .gh .offn a{color:var(--ink);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.grp .gb{display:none} .grp.open .gb{display:block}
.grp.down .gh{background:var(--bg2)}
.hidnote{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 12px;border-radius:11px;border:1px dashed var(--pg-line2);color:var(--pg-ink3);font-size:11.5px;font-weight:700}
.hidnote svg{width:14px;height:14px;flex:none} .hidnote span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidnote a{cursor:pointer;color:var(--pg-ink);text-decoration:underline;text-underline-offset:3px;font-weight:800}
.caret{transition:transform .15s;color:var(--ink3)} .grp.open .caret{transform:rotate(90deg)}
.tp{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tp .card{padding:12px 14px;display:flex;gap:12px;align-items:center}
.tp .nm{font-weight:800;font-size:13px} .tp .sb{font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.tp .prog{height:6px;border-radius:100px;background:var(--s4);overflow:hidden;margin-top:6px} .tp .prog i{display:block;height:100%}
.tp .pc{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;text-align:right;min-width:52px}
.av2{width:36px;height:36px;border-radius:50%;background:var(--gm);color:#fff;display:flex;align-items:center;justify-content:center;font:800 12px Inter,sans-serif;flex:none;object-fit:cover}
img.av,img.av2,img.pv{object-fit:cover;background:var(--s3)}

/* ── tables ── */
.tbl-w{overflow:auto;max-height:calc(100vh - 240px);border-radius:var(--r);border:1px solid var(--line);background:var(--s1)}
table.db{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.db th{position:sticky;top:0;z-index:2;background:var(--s2);text-align:left;font-size:10.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
table.db th:hover{color:var(--ink)} table.db th .ar{opacity:.6;margin-left:3px}
table.db td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.db tr.r:hover td{background:rgba(255,255,255,.03)}
table.db td.c1,table.db th.c1{position:sticky;left:0;background:var(--s1);z-index:1;font-weight:800} table.db th.c1{z-index:3;background:var(--s2)}
.num{font-variant-numeric:tabular-nums}
.ta{width:100%;min-height:260px;padding:12px;font:500 12.5px ui-monospace,Menlo,monospace;white-space:pre-wrap;line-height:1.45}
.danger{border-color:rgba(255,77,109,.35)} .danger .ch-h b{color:#ff8fa3}
.hint{font-size:11px;color:var(--ink3);margin-top:4px}
.fld{margin-bottom:12px} .fld label{display:block;font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:5px} .fld input,.fld select{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:11px;margin-bottom:6px;cursor:pointer;font-size:12.5px;font-weight:600}
.chk input{margin-top:2px;accent-color:var(--lime);width:auto}
.seg{display:flex;background:var(--s2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:7px 10px;font-weight:700;font-size:12px;color:var(--ink2)}
.seg button.on{background:var(--s4);color:var(--ink)}
.menu{position:absolute;right:8px;top:36px;background:var(--s2);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh);z-index:20;min-width:200px;padding:6px}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink)}
.menu button:hover{background:var(--s4)}

/* ── overlays ── */
.scrim{position:fixed;inset:0;background:rgba(5,4,12,.6);backdrop-filter:blur(4px);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--s2);border:1px solid var(--line2);border-radius:22px;box-shadow:0 40px 100px -20px #000;z-index:95;opacity:0;pointer-events:none;transition:all .2s}
#modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.md-h{padding:20px 22px 6px} .md-h h3{font-family:'Space Grotesk',sans-serif;font-size:18px} .md-h p{color:var(--ink2);font-size:12.5px;margin-top:4px;line-height:1.5}
.md-b{padding:10px 22px} .md-f{padding:12px 22px 20px;display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:var(--lime);color:#0b0a14;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:120;box-shadow:0 20px 40px -14px rgba(198,255,77,.6);max-width:calc(100vw - 30px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){ .toast{bottom:78px} #modal{width:calc(100vw - 16px)} }
.hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px} .hero h2{font-family:'Space Grotesk',sans-serif;font-size:22px} .hero p{color:var(--ink2);font-size:12.5px;margin-top:4px}
.inp,.sel{min-width:0}
.qz-st{display:none}

/* ═══════════ LIGHT STAGE (Jeth, Oct 5): the page goes light so the dark cards stand out. Cards, rail, modals and
   menus keep the night-studio look; everything that sits directly on the page reads in dark ink. ═══════════ */
:root{ --pg:#f4f2fb; --pg-ink:#17142b; --pg-ink2:#4a4668; --pg-ink3:#7d789c; --pg-line:rgba(23,20,43,.12); --pg-line2:rgba(23,20,43,.2); }
html,body{background:var(--pg)}
body{color:var(--pg-ink);background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.16),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(255,61,154,.10),transparent 60%),radial-gradient(600px 380px at 40% 120%,rgba(34,211,238,.10),transparent 60%),var(--pg);background-attachment:fixed}
main{color:var(--pg-ink)}
.card,.side,#modal,.menu,.comp,.tbl-w,.toast,#signin{color:var(--ink)}
.comp{background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh)}
.side{box-shadow:12px 0 40px -30px rgba(23,20,43,.5);border-right:1px solid rgba(23,20,43,.08)}
@media(max-width:900px){ .side{border-top:1px solid rgba(23,20,43,.08);box-shadow:0 -12px 40px -30px rgba(23,20,43,.5)} }
.top h1{color:var(--pg-ink)} .top h1 em{background:var(--gm);-webkit-background-clip:text;background-clip:text;color:transparent} .top p{color:var(--pg-ink2)}
.sec-h b{color:var(--pg-ink)} .sec-h span{color:var(--pg-ink3)} .sec-h hr{background:linear-gradient(90deg,var(--pg-line2),transparent)}
.muted{color:var(--pg-ink3)} .card .muted,#modal .muted,.side .muted,.comp .muted,.menu .muted{color:var(--ink3)}
.lbl{color:var(--pg-ink3)} .card .lbl,#modal .lbl{color:var(--ink3)}
.hint{color:var(--pg-ink3)} .card .hint,#modal .hint{color:var(--ink3)}
.clock{background:#fff;border-color:var(--pg-line2);color:var(--pg-ink2)}
.top input,.top select,.tbar select,.tbar input,.search input{background:#fff;border-color:var(--pg-line2);color:var(--pg-ink)}
.top input:focus,.tbar select:focus,.tbar input:focus,.search input:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.search input::placeholder{color:var(--pg-ink3)} .search>svg{color:var(--vio)} .search .kb{color:var(--pg-ink3);border-color:var(--pg-line2)} .search .clr{background:#ece9f7;color:var(--pg-ink)}
.chips button.chip{background:#fff;border-color:var(--pg-line2);color:var(--pg-ink2)} .chips button.chip.sel{background:var(--pg-ink);color:#fff;border-color:var(--pg-ink)}
.card .chips button.chip,#modal .chips button.chip{background:var(--s2);border-color:var(--line2);color:var(--ink2)} .card .chips button.chip.sel,#modal .chips button.chip.sel{background:var(--lime);color:#0b0a14;border-color:var(--lime)}
.chip{background:#ebe8f6;color:var(--pg-ink2)} .card .chip,#modal .chip,.comp .chip{background:var(--s3);color:var(--ink2)}
.btn.sec{background:#fff;border-color:var(--pg-line2);color:var(--pg-ink)} .btn.sec:hover{border-color:var(--pg-ink3);background:#fff}
.card .btn.sec,#modal .btn.sec,.menu .btn.sec{background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--ink)} .card .btn.sec:hover,#modal .btn.sec:hover{border-color:var(--line3);background:rgba(255,255,255,.08)}
.ghost{border-color:var(--pg-line2);color:var(--pg-ink2)} .ghost:hover{border-color:var(--pg-ink3);color:var(--pg-ink)}
.card .ghost,#modal .ghost,.comp .ghost{border-color:var(--line2);color:var(--ink2)} .card .ghost:hover,#modal .ghost:hover,.comp .ghost:hover{border-color:var(--line3);color:var(--ink)}
.seg{background:#e9e6f4} .seg button{color:var(--pg-ink2)} .seg button.on{background:#fff;color:var(--pg-ink);box-shadow:0 1px 2px rgba(23,20,43,.12)}
.card .seg,#modal .seg{background:var(--s2)} .card .seg button,#modal .seg button{color:var(--ink2)} .card .seg button.on,#modal .seg button.on{background:var(--s4);color:var(--ink);box-shadow:none}
.banner.warn{background:#fff6e0;border-color:#f5d48a;color:#7a4b00} .banner.bad{background:#ffe9ee;border-color:#ffb3c1;color:#9f1239} .banner.info{background:#e6f9fd;border-color:#9fe3f2;color:#0b5566}
.banner .btn.pri{box-shadow:none}
.kpi .glow{opacity:.45}
.pres .pv{border-color:var(--pg)}
.rank.none{background:var(--s3)}
/* cards whose background was a see-through gradient (fine on the old dark page) now sit on a solid dark base */
.hof-c{background:linear-gradient(120deg,rgba(251,191,36,.10),rgba(255,61,154,.08) 60%,rgba(21,19,42,0)),var(--s1)}
.alarm{background:linear-gradient(120deg,rgba(255,61,154,.14),rgba(139,92,246,.14)),var(--s1)}
.side{background:rgba(16,14,29,.97)}
#signin{background:rgba(21,19,42,.97)}
.hof-c .t b,.hof-c .trophy{text-shadow:0 1px 2px rgba(0,0,0,.5)}
/* ── sign-in intro (Oct 6, 2026): ~5.5 s, a synthesised beat + the disc, the bars and the wordmark — skippable ── */
#intro{position:fixed;inset:0;z-index:200;display:none;background:#0b0a14;color:#f3f1ff;overflow:hidden;align-items:center;justify-content:center}
#intro.on{display:flex} #intro.out{opacity:0;transition:opacity .5s}
#intro .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6}
#intro .g1{width:520px;height:520px;left:-120px;top:-160px;background:#ff3d9a;animation:iglow 5.5s ease-in-out infinite alternate}
#intro .g2{width:460px;height:460px;right:-120px;bottom:-160px;background:#8b5cf6;animation:iglow 4.5s ease-in-out infinite alternate-reverse}

<script>
/* ═══════════════════════════════════════════════════════════════════════════════════════════
   ALTR STUDIO — music & reels promotion console (Phase 1, Oct 2026)
   Same backend and the same red / orange / green cycle system the team already knows, in a console built
   around what ALTR actually does: promoting audios and reels. Promotions are the home screen; phones, posting
   and sourcing are the delivery system underneath. What is new in this phase:
     • Today board: phones first, then your own posting tracker — total · posted · left · %  (Andrea
       Gabuyo's September innovation idea, score 91), and "Next up", the account after the last one you
       completed, so a refresh or a lunch break never loses your place or double-posts.
     • On Hold for phones: a parked phone (repair, swap, missing) takes its accounts out of every target,
       out of auto-assign and out of the End-of-Day report — with the reason shown where the phone is.
     • Roles: owner (JMBEAST / ADMIN) · lead (the team leads, editable in Settings) · VA (own phones only).
       Every write carries by_id, and the backend checks it.
     • Dates are PHT everywhere (the classic page used the laptop's local day).
   The classic page is retired: promotions, the count-check alarm, the daily reel and the Instagram session
   settings all live here. The auto QA scan (10:00) keeps running in the backend and feeds the scorecard.
   Backend: altr-apps-script.gs version 2026-10-05-aura or later.
   ═══════════════════════════════════════════════════════════════════════════════════════════ */
var PORTAL_URL = "https://script.google.com/macros/s/AKfycbwK8rVJlkv5YLgNLe7cGIz73KJc0hedmZcutoiRviDEowiZPglzBnznswBaZ0TVIV8t/exec";   // employee ID + PIN login (portal backend)
var ALTR_URL   = "https://script.google.com/macros/s/AKfycbxp7wcIf48urxm2DcPoNgdmQreYUGia-YNnXwIXfyMqOLkyWpaqI3hoMZa4VPmjZa9_Mg/exec";   // altr-apps-script.gs /exec
var OWNERS=['jmbeast','admin'], LEADS_DEFAULT=['jmb006','jmb013','jmb034'];
var ACCT_TAGS=['Incorrect bio','Incorrect username','Duplicate','Fix highlights'];
var ACCT_ST=[['active','Active','#047857','#ecfdf5'],['suspended','Suspended','#b45309','#fffbeb'],['logged_out','Logged out','#be123c','#fff1f2'],['restricted','Restricted','#7c2d12','#fff7ed'],['action_blocked','Action blocked','#9f1239','#fff1f2'],['under_review','Under review','#4338ca','#eef2ff']];

/* ── tiny helpers ── */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function fnum(n){ n=parseInt(n,10); return isNaN(n)?0:n; }
var _tt=null;
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove('on'); },2600); }
function phtParts(d){ var f=new Intl.DateTimeFormat('en-CA',{ timeZone:'Asia/Manila', year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false }); var o={}; f.formatToParts(d||new Date()).forEach(function(p){ o[p.type]=p.value; }); if(o.hour==='24') o.hour='00'; return o; }
function phtToday(){ var o=phtParts(); return o.year+'-'+o.month+'-'+o.day; }
function phtClock(){ var o=phtParts(); var h=parseInt(o.hour,10), ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+o.minute+' '+ap; }

function firstName(n){ n=String(n||'').trim(); if(n.indexOf(',')>=0) return (n.split(',')[1]||'').trim().split(/\s+/)[0]||n; return n.split(/\s+/)[0]||n; }
/* Faces: the same chain the portal uses — portal.jmbvirtuals.com/headshots/JMB0XX.{jpg,webp,png} → the Drive photo from the sheet → initials.
   Nothing to sync: drop a headshot in the portal's headshots folder and it shows here too. */
var FACE_BASE='https://portal.jmbvirtuals.com/headshots/';
function drivePhoto(u){ u=String(u||'').trim(); if(!u) return ''; if(/drive\.google\.com\/.*\/folders\//.test(u)) return ''; var m=u.match(/[-\w]{25,}/); return m?('https://drive.google.com/thumbnail?id='+m[0]+'&sz=w160'):u; }
function faceChain(eid, photo){ var e=String(eid||'').trim().toUpperCase(), c=[]; if(/^JMB\d{3}$/.test(e)){ c.push(FACE_BASE+e+'.jpg'); c.push(FACE_BASE+e+'.webp'); c.push(FACE_BASE+e+'.png'); } var d=drivePhoto(photo); if(d) c.push(d); return c; }
function face(eid, name, photo, cls, style){ var chain=faceChain(eid, photo), ini=initials(name||eid||'?'); if(!chain.length) return '<span class="'+cls+'"'+(style?' style="'+style+'"':'')+'>'+esc(ini)+'</span>'; return '<img class="'+cls+'"'+(style?' style="'+style+'"':'')+' src="'+esc(chain[0])+'" alt="" referrerpolicy="no-referrer" data-alt="'+esc(chain.slice(1).join('|'))+'" data-ini="'+esc(ini)+'" onerror="faceErr(this)">'; }
function faceErr(img){ var a=String(img.getAttribute('data-alt')||'').split('|').filter(Boolean); if(a.length){ img.setAttribute('data-alt', a.slice(1).join('|')); img.src=a[0]; return; } var sp=document.createElement('span'); sp.className=img.className; sp.setAttribute('style', img.getAttribute('style')||''); sp.textContent=img.getAttribute('data-ini')||'?'; if(img.parentNode) img.parentNode.replaceChild(sp, img); }
function initials(n){ return natName(n).replace(/[^A-Za-z0-9\s]/g,' ').split(/\s+/).filter(Boolean).slice(0,2).map(function(x){ return x.charAt(0).toUpperCase(); }).join('')||'?'; }
var SI=function(p,w){ return '<svg width="'+(w||15)+'" height="'+(w||15)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;flex:none">'+p+'</svg>'; };
var IC={
 plus:SI('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
 check:SI('<polyline points="20 6 9 17 4 12"/>',12),
 clock:SI('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',14),
 phone:SI('<rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12" y2="18.01"/>',14),

 ext:SI('<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',11),
 copy:SI('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',13),
 flag:SI('<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',12),
 chev:SI('<polyline points="9 18 15 12 9 6"/>',13),
 hold:SI('<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',12),
 refresh:SI('<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',12)
};
var TAB_IC={
 today:SI('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'),
 sourcing:SI('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'),
 posting:SI('<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>'),
 accounts:SI('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
 history:SI('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'),
 settings:SI('<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>'),
 insights:SI('<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'),
 qa:SI('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>')
};

/* ── API ── */
var _cache={}, _inflight={}, PENDING=0, LAST_ACT=0;
function _text(url,tries,timeout){
  return new Promise(function(res,rej){
    var ctrl=window.AbortController?new AbortController():null;
    var to=setTimeout(function(){ try{ ctrl&&ctrl.abort(); }catch(e){} }, timeout||20000);
    fetch(url, ctrl?{signal:ctrl.signal}:undefined).then(function(r){ return r.text(); }).then(function(t){ clearTimeout(to); res(t); })
      .catch(function(e){ clearTimeout(to); if((tries||1)>1) _text(url,(tries||1)-1,timeout).then(res,rej); else rej(e); });
  });
}
function apiGet(params, ttl){
  ttl=(ttl==null?1500:ttl);
  var qs=Object.keys(params).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
  var url=ALTR_URL+'?'+qs+'&_='+Date.now(), key=qs, now=Date.now(), c=_cache[key];
  var clone=function(d){ return d==null?d:JSON.parse(JSON.stringify(d)); };
  if(ttl>0 && c && (now-c.t)<ttl) return Promise.resolve(clone(c.d));
  if(ttl>0 && _inflight[key]) return _inflight[key].then(clone);
  var p=_text(url, 2, 20000).then(function(t){ var d=null; try{ d=JSON.parse(t); }catch(e){} if(ttl>0&&d) _cache[key]={t:Date.now(),d:d}; delete _inflight[key]; return d; }, function(e){ delete _inflight[key]; throw e; });
  if(ttl>0) _inflight[key]=p;
  return p.then(clone);
}
function apiPost(obj){
  PENDING++; LAST_ACT=Date.now();
  obj=Object.assign({}, obj, { by: obj.by||myName(), by_id: obj.by_id||myId() });   // every write says who, by ID — the backend checks the role
  return fetch(ALTR_URL, { method:'POST', body:JSON.stringify(obj) }).then(function(r){ return r.json(); })
    .finally(function(){ _cache={}; PENDING=Math.max(0,PENDING-1); LAST_ACT=Date.now(); });
}
/* box writes: collapse fast clicks into one call */
var _cellQ=[], _cellT=null, _lastCellEdit=0;
function queueCell(item){ _cellQ.push(item); _lastCellEdit=Date.now(); if(_cellT) clearTimeout(_cellT); if(_cellQ.length>=14) flushCells(); else _cellT=setTimeout(flushCells,700); }
function flushCells(){
  if(_cellT){ clearTimeout(_cellT); _cellT=null; }
  if(!_cellQ.length) return;
  var batch=_cellQ.slice(); _cellQ=[];
  apiPost({ action:'cells_batch', items:batch }).then(function(r){ if(!(r&&(r.ok||r.applied!==undefined))){ _cellQ=batch.concat(_cellQ); if(!_cellT) _cellT=setTimeout(flushCells,1500); } })
    .catch(function(){ _cellQ=batch.concat(_cellQ); if(!_cellT) _cellT=setTimeout(flushCells,1500); toast('Saving boxes… retrying'); });
}
document.addEventListener('visibilitychange', function(){ if(document.hidden) flushCells(); });
window.addEventListener('pagehide', flushCells);
function cellsBusy(){ return _cellQ.length>0 || (Date.now()-_lastCellEdit<1600); }

/* ── session / roles ── */
var USER=null, ROLE='va', CFG={ leads:LEADS_DEFAULT.slice(), version:'' }, BE_VER='';
function myId(){ return String(USER&&USER.id||'').toLowerCase(); }
function myName(){ return (USER&&USER.name)||(USER&&USER.id)||''; }
function isOwner(){ return ROLE==='owner'; }
function isLead(){ return ROLE==='owner'||ROLE==='lead'; }
function roleOf(id){ id=String(id||'').toLowerCase(); if(OWNERS.indexOf(id)>=0) return 'owner'; if((CFG.leads||[]).indexOf(id)>=0) return 'lead'; return 'va'; }
/* ══ SIGN-IN INTRO — ~5.5 s. The beat is synthesised in Web Audio (no file, nothing to license): kick on every
   beat, snare on 2 & 4, closed hats on 8ths, a bass line, a riser into the hit at beat 10, and a chord stab under the
   name. Plays only on a real sign-in click (browsers allow sound after a gesture); a session restore skips it. ══ */
var INTRO={ ctx:null, t:null, done:false, timers:[] };
function introArm(){ try{ if(!INTRO.ctx) INTRO.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(INTRO.ctx.state==='suspended') INTRO.ctx.resume(); }catch(e){} }
function introSkip(){ if(INTRO.done) return; INTRO.done=true; INTRO.timers.forEach(clearTimeout); try{ if(INTRO.master) INTRO.master.gain.setTargetAtTime(0, INTRO.ctx.currentTime, .08); }catch(e){} var el=$('intro'); el.classList.add('out'); setTimeout(function(){ el.classList.remove('on','out'); }, 520); }
function introBeat(){
  var ctx=INTRO.ctx; if(!ctx) return; try{ if(ctx.state==='suspended') ctx.resume(); }catch(e){}
  var t0=ctx.currentTime+.05, B=.5;   // 120 BPM
  var comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; var master=ctx.createGain(); master.gain.value=.55; master.connect(comp); comp.connect(ctx.destination); INTRO.master=master;
  var noiseBuf=(function(){ var b=ctx.createBuffer(1, ctx.sampleRate*1.2, ctx.sampleRate), d=b.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; })();
  function kick(t,v){ var o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(165,t); o.frequency.exponentialRampToValueAtTime(45,t+.28); g.gain.setValueAtTime(v||1,t); g.gain.exponentialRampToValueAtTime(.001,t+.38); o.connect(g); g.connect(master); o.start(t); o.stop(t+.4); }
  function noise(t,len,hp,lp,v,q){ var src=ctx.createBufferSource(); src.buffer=noiseBuf; var f=ctx.createBiquadFilter(); f.type=hp?'highpass':'bandpass'; f.frequency.value=hp||lp; if(q) f.Q.value=q; var g=ctx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+len); src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+len+.05); }
  function snare(t,v){ noise(t,.22,0,1800,v||.6,.8); var o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(210,t); o.frequency.exponentialRampToValueAtTime(120,t+.12); g.gain.setValueAtTime(.45*(v||1),t); g.gain.exponentialRampToValueAtTime(.001,t+.16); o.connect(g); g.connect(master); o.start(t); o.stop(t+.2); }
  function hat(t,open){ noise(t, open?.3:.06, 8500, 0, open?.22:.16); }
  function bass(t,f,len){ var o=ctx.createOscillator(), fl=ctx.createBiquadFilter(), g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=f; fl.type='lowpass'; fl.frequency.setValueAtTime(900,t); fl.frequency.exponentialRampToValueAtTime(220,t+len); fl.Q.value=6; g.gain.setValueAtTime(.32,t); g.gain.exponentialRampToValueAtTime(.001,t+len); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+len+.05); }
  function stab(t){ [0,7,12,16].forEach(function(st,i){ var o=ctx.createOscillator(), g=ctx.createGain(); o.type='sawtooth'; o.frequency.value=110*Math.pow(2,st/12); o.detune.value=(i%2?8:-8); var fl=ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(3200,t); fl.frequency.exponentialRampToValueAtTime(500,t+1.6); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+1.8); o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+1.9); }); }
  function riser(t,len){ var src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true; var f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(7000,t+len); var g=ctx.createGain(); g.gain.setValueAtTime(.02,t); g.gain.linearRampToValueAtTime(.3,t+len); g.gain.setValueAtTime(0,t+len+.01); src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+len+.05); }
  var bassLine=[55,55,82.4,55, 55,55,65.4,73.4, 55,55,82.4,55, 55,65.4,73.4,82.4];
  for(var b=0;b<10;b++){ var t=t0+b*B; kick(t, b===0?1:.9); if(b%2===1) snare(t); hat(t); hat(t+B/2, b===7); if(b<8){ bass(t, bassLine[(b*2)%16], B*.45); bass(t+B/2, bassLine[(b*2+1)%16], B*.45); } }
  riser(t0+7*B, 3*B);
  var hit=t0+10*B; kick(hit,1.2); snare(hit,1.1); noise(hit,.9,0,3000,.5,.5); stab(hit); hat(hit+B/2,true); kick(hit+B,.7);
}
function introPlay(){

var MONTHS_={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function monthNum_(w){ w=String(w||'').toLowerCase().replace(/\./g,''); return MONTHS_[w]||MONTHS_[w.slice(0,3)]||0; }
function yearFor_(mo){ var t=phtToday(), y=parseInt(t.slice(0,4),10), tm=parseInt(t.slice(5,7),10); if(mo-tm<-6) y++; else if(mo-tm>6) y--; return y; }   // "January 3" pasted in December = next year
function parseSchedLines(txt){
  // accepts: 2026-10-05 · 10/5 · 10/5/26 · October 5 · Oct 5, 2026 · 5 October — then any label — then the link; "October 3, Anllela: https://…" (the client's format) is the common case
  var out=[]; String(txt||'').split(/\r?\n/).forEach(function(line){ line=line.trim(); if(!line) return;
    line=line.replace(/^([A-Za-z]{3,9}\.?\s+\d{1,2}(?:st|nd|rd|th)?)\s*,\s*(\d{4})\b/, '$1 $2');   // "October 3, 2026" → one token
    var parts=line.split(/\t|,|\s{2,}|\s[-–—·|]\s|:\s|\s(?=https?:\/\/)/).map(function(x){ return x.trim(); }).filter(Boolean);
    var date='', link='', note=[];
    parts.forEach(function(p){
      if(!link && /^https?:\/\//i.test(p)){ var sp=p.search(/\s/); if(sp>0){ note.push(p.slice(sp+1).trim()); p=p.slice(0,sp); } link=p; return; }
      if(!date){
        var m=p.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)||p.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
        if(m){ if(m[0].indexOf('-')>0) date=m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2); else { var y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):phtToday().slice(0,4); date=y+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2); } return; }
        var mo=0, dd=0, yy='', w=p.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:\s+(\d{4}))?:?$/);
        if(w){ mo=monthNum_(w[1]); dd=parseInt(w[2],10); yy=w[3]||''; }
        else { w=p.match(/^(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,9})\.?(?:\s+(\d{4}))?:?$/); if(w){ mo=monthNum_(w[2]); dd=parseInt(w[1],10); yy=w[3]||''; } }
        if(mo && dd>=1 && dd<=31){ date=(yy||yearFor_(mo))+'-'+('0'+mo).slice(-2)+'-'+('0'+dd).slice(-2); return; }
      }
      p=p.replace(/^[\-–—:]+\s*|\s*[:\-–—]+$/g,'').trim(); if(p) note.push(p);
    });
    if(date && link) out.push({ date:date, link:link, note:note.join(' ') });
  });

  var boxes=[], n=srcLen(r); for(var i=0;i<n;i++) boxes.push({ s:cellAt(r.cells,i), num:gdGet(r.nums,i), gd:gdGet(r.gdates,i) });
  var v=await askText('Box '+(idx+1)+' of @'+a.handle, 'Cycle number for this box — later boxes are renumbered to follow. Leave empty to delete the box.', boxes[idx].num||'');
  if(v===null) return; v=String(v).trim();
  if(v===''){ boxes.splice(idx,1); } else { var nv=parseInt(v,10); if(isNaN(nv)){ toast('Enter a number'); return; } boxes[idx].num=String(nv); for(var j=idx+1;j<boxes.length;j++){ nv++; boxes[j].num=String(nv); } for(var p=idx-1;p>=0;p--){ var cur=parseInt(boxes[p+1].num,10); boxes[p].num=String(cur-1); } }
  r.cells=boxes.map(function(b){ return b.s; }).join(''); r.nums=boxes.map(function(b){ return b.num||''; }).join(','); r.gdates=boxes.map(function(b){ return b.gd||''; }).join(',');

  apiPost({ action:'src_set_account', phone:a.phone, user:a.user, acct:a.acct, handle:a.handle, cells:r.cells, nums:r.nums, gdates:r.gdates, va_code:myName() }).then(function(d){ if(d&&d.error) toast(d.error); }).catch(function(){ toast('Save failed'); });
}

    if(_pageTag===null){ _pageTag=tag; return; }
    if(tag===_pageTag) return;
    var ae=document.activeElement, typing=ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type!=='checkbox';

  var lead=isLead(), all=repostAccts(), mine=lead?null:Object.assign({}, myPostPhones(), mySrcPhones());
  var sched=(STATE.repost_schedule||[]).slice().sort(function(a,b){ return a.date<b.date?1:-1; });
  var todayL=sched.filter(function(x){ return x.date===DATE; }), overdue=sched.filter(function(x){ return x.date<DATE && String(x.status)!=='done' && doneList(x).length<all.length; }).slice(0,5), next=sched.filter(function(x){ return x.date>DATE; }).sort(function(a,b){ return a.date<b.date?-1:1; }).slice(0,3);
  var schedLinks={}; sched.forEach(function(x){ schedLinks[String(x.link||'').trim()]=1; });
  var extras=(STATE.reposts||[]).filter(function(r){ return String(r.status||'').toLowerCase()!=='done' && !schedLinks[String(r.link||'').trim()]; });
  var h=topBar('Daily <em>reel</em>', 'the client\'s scheduled reel, reposted on the big accounts · one reel a day, extras when asked', lead?'<button class="btn sm sec" onclick="schedModal()">Schedule…</button><button class="btn sm mag" onclick="addRepost()">'+IC.plus+' Extra reel</button>':'');
  if(!all.length) h+='<div class="banner warn">'+IC.phone+'<div><b>No repost accounts set yet.</b> '+(lead?'Settings → Reposts: pick the big accounts the client reposts on, and each day\'s reel gets one tick per account.':'Ask your lead to set the repost accounts in Settings.')+'</div></div>';
  if(!todayL.length) h+='<div class="card pad" style="margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:220px"><div class="ch-h" style="margin:0"><b>No reel scheduled for '+esc(fmtD(DATE))+'</b></div><div class="muted">'+(lead?(schedMissing().length?'The client\'s October schedule is built into the page — add it with one click, or paste a newer one with Schedule…':'Paste the client\'s schedule with Schedule… — the day\'s reel then shows here with a tick per account.'):'Nothing to repost today.')+'</div></div>'+(lead&&schedMissing().length?'<button class="btn pri" onclick="schedLoadClient()">Add the October schedule</button>':'')+'</div>';
  todayL.forEach(function(it){ h+=reelCard(it, all, mine, true); });
  if(overdue.length){ h+='<div class="sec-h"><b>Not finished</b><span>earlier days still missing accounts</span><hr></div>'; overdue.forEach(function(it){ h+=reelCard(it, all, mine, false); }); }
  h+='<div class="ig" style="margin-top:12px"><div class="card pad s6"><div class="ch-h"><b>Next</b><span>coming up</span></div>'+(next.length?next.map(function(x){ return '<div class="rep"><span class="chip">'+esc(fmtD(x.date))+'</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.note||x.link)+'</span></div>'; }).join(''):'<div class="muted">Nothing scheduled after today'+(lead?' — paste the next days with Schedule…':'')+'.</div>')+'</div>';
  h+='<div class="card pad s6"><div class="ch-h"><b>Extra reels</b><span>promoted outside the schedule</span></div>'+(extras.length?extras.map(function(r){ var rs=repostStats(r); return '<div class="rep"><span class="chip">'+esc(fmtD(r.date))+'</span><a href="'+esc(r.link||'#')+'" target="_blank" rel="noopener" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700">'+esc(r.link||('Reel '+r.id))+'</a><span class="num" style="font:700 15px \'Space Grotesk\',sans-serif;cursor:pointer" onclick="editRepost(\''+jsq(r.id)+'\')">'+fmtN(rs.cur)+' <small class="muted">reach</small></span><span class="'+(rs.gain>0?'lime':(rs.gain<0?'mag':'muted'))+'" style="font-size:11.5px;font-weight:800;min-width:60px">'+(rs.gain>0?'+':'')+fmtN(rs.gain)+' today</span>'+(lead?'<button class="ghost" onclick="repostDone(\''+jsq(r.id)+'\')">Done</button>':'')+'</div>'; }).join(''):'<div class="muted">None in progress.</div>')+'</div></div>';
  var past=sched.filter(function(x){ return x.date<DATE; }).slice(0,10);
  if(past.length) h+='<div class="sec-h"><b>Last days</b><span>how each reel went</span><hr></div><div class="card pad">'+past.map(function(x){ var d=doneList(x).length, rp=reelRepostRow(x), rs=rp?repostStats(rp):null; return '<div class="rep"><span class="chip">'+esc(fmtD(x.date))+'</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.note||x.link)+'</span><span class="pill" style="background:'+(all.length&&d>=all.length?'rgba(198,255,77,.14)':'rgba(255,61,154,.12)')+';color:'+(all.length&&d>=all.length?'var(--lime)':'#ffb3d1')+'">'+d+'/'+(all.length||d)+' accounts</span>'+(rs?'<span class="num muted" style="min-width:80px;text-align:right">'+fmtN(rs.cur)+' reach</span>':'')+'</div>'; }).join('')+'</div>';
  return h;
}
function reelCard(it, all, mine, isToday){
  var done=doneList(it), rp=reelRepostRow(it), rs=rp?repostStats(rp):null, pct=all.length?Math.round(done.length/all.length*100):0, lead=isLead();
  var list=all.filter(function(k){ if(!mine) return true; var a=acctByKey(k); return a && mine[String(a.phone)]; });
  var h='<div class="card pad" style="margin-bottom:12px;position:relative;overflow:hidden"><div class="row" style="gap:16px;align-items:flex-start"><div class="disc" style="width:56px;height:56px;animation:none"></div><div style="flex:1;min-width:220px"><div class="lbl">'+(isToday?'Today\'s reel':esc(fmtD(it.date))+' · not finished')+'</div><b style="font-family:\'Space Grotesk\',sans-serif;font-size:17px;display:block;margin-top:2px">'+esc(it.note||'Scheduled reel')+'</b><a href="'+esc(it.link)+'" target="_blank" rel="noopener" style="font-size:12px;word-break:break-all">'+esc(it.link)+' ↗</a></div>'+
    '<div style="text-align:right"><div class="big" style="font-size:30px;color:'+(all.length&&done.length>=all.length?'var(--lime)':'var(--ink)')+'">'+done.length+'<small>/'+(all.length||'—')+'</small></div><div class="muted" style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em">reposted</div></div></div>';
  h+=wave(pct, 32);
  if(list.length){ h+='<div class="lbl" style="margin:12px 0 6px">'+(mine?'Your repost accounts':'Repost accounts')+' · tick when the reel is up</div><div class="row" style="gap:8px">'+list.map(function(k){ var on=done.indexOf(k)>=0, a=acctByKey(k); return '<button class="chip" style="padding:7px 12px;font-size:12px;cursor:pointer;background:'+(on?'rgba(198,255,77,.16)':'var(--s2)')+';border:1px solid '+(on?'var(--lime)':'var(--line2)')+';color:'+(on?'var(--lime)':'var(--ink2)')+'" onclick="reelTick(\''+jsq(it.id)+'\',\''+jsq(k)+'\','+(on?'false':'true')+')">'+(on?IC.check+' ':'')+esc(acctLbl(k))+(a?' <span class="muted">P'+esc(a.phone)+'</span>':'')+'</button>'; }).join('')+'</div>'; }
  else if(all.length) h+='<div class="muted" style="margin-top:10px">None of the repost accounts are on your phones.</div>';
  h+='<div class="row" style="margin-top:12px;gap:12px">'+(rs?'<span class="num" style="font:700 16px \'Space Grotesk\',sans-serif;cursor:pointer" onclick="editRepost(\''+jsq(rp.id)+'\')">'+fmtN(rs.cur)+' <small class="muted">reach</small></span><span class="'+(rs.gain>0?'lime':(rs.gain<0?'mag':'muted'))+'" style="font-size:11.5px;font-weight:800">'+(rs.gain>0?'+':'')+fmtN(rs.gain)+' today</span>':'<span class="muted" style="font-size:12px">Reach is asked at the count checks once the first account has reposted.</span>')+(lead&&all.length&&done.length<all.length?'<span class="sp"></span><button class="btn sm sec" onclick="reelAll(\''+jsq(it.id)+'\')">Mark all reposted</button>':'')+'</div></div>';
  return h;
}
async function reelTick(id, key, on){
  var it=(STATE.repost_schedule||[]).filter(function(x){ return String(x.id)===String(id); })[0]; if(!it) return;
  if(on && !(await linkGate('A reel tick'))) return;   // portal timer must be running on ALTR (Oct 7)
  var d=doneList(it); if(on&&d.indexOf(key)<0) d.push(key); if(!on) d=d.filter(function(k){ return k!==key; }); it.done_accts=d.join('|||'); renderView();
  try{ var r=await apiPost({ action:'repost_sched_tick', id:id, key:key, on:on }); if(r&&r.error) toast(r.error); else { if(r.repost_id) it.repost_id=r.repost_id; it.status=r.status; toast(on?'Reposted on '+acctLbl(key):'Un-ticked'); loadState(true); } }catch(e){ toast('Save failed'); }
}
async function reelAll(id){ var it=(STATE.repost_schedule||[]).filter(function(x){ return String(x.id)===String(id); })[0]; if(!it) return; var all=repostAccts(), d=doneList(it); for(var i=0;i<all.length;i++){ if(d.indexOf(all[i])<0){ try{ await apiPost({ action:'repost_sched_tick', id:id, key:all[i], on:true }); }catch(e){} } } toast('All accounts marked'); loadState(true); }
/* Settings → Reposts: the big accounts */
function vRepostSettings(){
  var all=repostAccts();
  return '<div class="ig"><div class="card pad s6"><div class="ch-h"><b>Repost accounts</b><span>the big accounts the client reposts the daily reel on</span></div>'+(all.length?all.map(function(k){ var a=acctByKey(k); return '<div class="rep"><b style="flex:1">'+esc(acctLbl(k))+'</b><span class="muted">'+(a?'P'+esc(a.phone)+' · U'+esc(a.user)+' · A'+esc(a.acct)+(a.followers?' · '+esc(a.followers)+' fol':''):'not in the fleet any more')+'</span>'+(isLead()?'<button class="ghost" onclick="repostAcctDel(\''+jsq(k)+'\')">remove</button>':'')+'</div>'; }).join(''):'<div class="muted">None yet. Each day\'s reel gets one tick per account listed here.</div>')+
    (isLead()?'<div class="row" style="margin-top:12px"><input id="ra-q" placeholder="type a handle to add…" oninput="repostAcctSuggest(this.value)" style="flex:1;min-width:200px"></div><div id="ra-sug" class="row" style="gap:6px;margin-top:8px"></div>':'')+'</div>'+
    (isOwner()?'<div class="card pad s6"><div class="ch-h"><b>Instagram session</b><span>used by followers refresh and the auto QA scan</span></div><div class="fld"><label>Session cookie (burner account\'s sessionid)</label><input id="ig-ck" type="password" placeholder="'+(STATE.ig_cookie?'set — paste to replace':'not set')+'"></div><div class="fld"><label>Bio proxy / worker URL</label><input id="ig-wk" placeholder="'+(STATE.ig_worker?'set — paste to replace':'not set')+'"></div><div class="row"><button class="btn sm pri" onclick="igSave()">Save</button><span class="hint">Only what you paste is sent; empty fields are left as they are.</span></div></div>':'')+'</div>';
}
function repostAcctSuggest(q){ q=String(q||'').trim().toLowerCase(); var box=$('ra-sug'); if(!box) return; if(q.length<2){ box.innerHTML=''; return; } var all=repostAccts(); var hits=(STATE.accounts||[]).filter(function(a){ return String(a.handle).toLowerCase().indexOf(q)>=0 && all.indexOf(keyOf(a))<0; }).slice(0,8); box.innerHTML=hits.map(function(a){ return '<button class="chip" style="cursor:pointer" onclick="repostAcctAdd(\''+jsq(keyOf(a))+'\')">'+IC.plus+' @'+esc(a.handle)+' <span class="muted">P'+esc(a.phone)+'</span></button>'; }).join('')||'<span class="muted">no match</span>'; }
async function repostAcctAdd(k){ var all=repostAccts(); if(all.indexOf(k)<0) all.push(k); await saveRepostAccts(all); }
async function repostAcctDel(k){ await saveRepostAccts(repostAccts().filter(function(x){ return x!==k; })); }
async function saveRepostAccts(all){ CFG.repost_accts=all; renderView(); try{ var d=await apiPost({ action:'altr_cfg_set', repost_accts:JSON.stringify(all) }); if(d&&d.ok){ CFG=d; toast('Repost accounts saved'); renderView(); } else toast((d&&d.error)||'Only the owner can change this'); }catch(e){ toast('Save failed'); } }
async function igSave(){ var ck=$('ig-ck').value.trim(), wk=$('ig-wk').value.trim(); if(!ck&&!wk){ toast('Nothing to save'); return; } try{ if(ck){ var a=await apiPost({ action:'ig_cookie_set', cookie:ck }); if(a&&a.error){ toast(a.error); return; } } if(wk){ var b=await apiPost({ action:'ig_worker_set', url:wk }); if(b&&b.error){ toast(b.error); return; } } toast('Saved'); $('ig-ck').value=''; $('ig-wk').value=''; loadState(true); }catch(e){ toast('Save failed'); } }

/* ── start ── */
async function start(){
  $('signin').style.display='none'; $('app').style.display='block'; document.body.style.paddingBottom='0';
  try{ fetch(PORTAL_URL+'?action=tool_used&employee_id='+encodeURIComponent(USER.id)+'&tool=altr&_='+Date.now()).catch(function(){}); }catch(e){}
  await loadCfg();
  try{ var want=sessionStorage.getItem('altr2_view'); if(want && tabsFor().some(function(t){ return t[0]===want; })) VIEW=want; }catch(e){}
  paintTabs(); paintTop();
  try{ var c=JSON.parse(sessionStorage.getItem('altr2_state')||'null'); if(c&&c.d&&Date.now()-c.t<10*60*1000&&c.d.date===DATE){ STATE=c.d; } }catch(e){}
  renderView();
  loadState(!!STATE); pingPresence();
  if(VIEW==='history') loadHistory();
  if(isLead()){ try{ var _dk='altr2_dc_'+phtToday(); if(!localStorage.getItem(_dk)){ localStorage.setItem(_dk,'1'); apiGet({ action:'altr_day_close', by_id:myId(), catchup:'1' },0).then(function(d){ if(d&&d.closed&&d.closed.length) toast('Scorecard ledger: closed '+d.closed.length+' day'+(d.closed.length===1?'':'s')+'.'); }).catch(function(){ try{ localStorage.removeItem(_dk); }catch(_r){} }); } }catch(_dc){} }   // Phase 2: freeze yesterday's numbers
}
(function(){ try{ var u=JSON.parse(sessionStorage.getItem('altr2_user')||'null'); if(u&&u.id){ USER=u; start(); } }catch(e){} })();
</script>
