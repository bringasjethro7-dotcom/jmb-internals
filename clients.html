<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Hub · JMB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════ CLIENT HUB — every small client (1–3 VAs) in one link, one tab each (Jeth, Oct 9 2026) ═══════════ */
:root{
  --bg:#f4f5f9; --s1:#ffffff; --s2:#fafbfd; --s3:#f1f2f7;
  --ink:#14161f; --ink2:#4b5164; --ink3:#7f859c; --ink4:#a9aec0;
  --line:rgba(17,19,34,.08); --line2:rgba(17,19,34,.14);
  --o:#FF6B1A; --t:#14B8A6; --tl:#0F766E; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --grad:linear-gradient(120deg,#2dd4bf 0%,#0ea5e9 50%,#6366f1 100%);
  --sh1:0 1px 2px rgba(17,19,34,.05),0 1px 1px rgba(17,19,34,.03);
  --sh2:0 10px 30px -12px rgba(17,19,34,.18),0 2px 6px rgba(17,19,34,.05);
  --r:16px; --cc:#14B8A6; --cg:linear-gradient(135deg,#2dd4bf,#0e7490);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit}
.hide{display:none!important}
.muted{color:var(--ink3);font-size:12.5px}
/* ── background wash ── */
body::before{content:'';position:fixed;inset:-20% -10% auto;height:520px;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 260px at 12% 10%,rgba(45,212,191,.16),transparent 70%),radial-gradient(520px 240px at 88% 0%,rgba(99,102,241,.12),transparent 70%)}
/* ── sign-in ── */
#signin{max-width:390px;margin:12vh auto 0;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:30px 28px 26px;text-align:center;box-shadow:var(--sh2)}
#signin .mark{width:58px;height:58px;margin:0 auto 14px;border-radius:17px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 14px 30px -12px rgba(14,165,233,.8)}
#signin .mark svg{width:28px;height:28px}
#signin h1{font:800 22px Sora,sans-serif;letter-spacing:-.01em}
#signin p{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
#signin input{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:11px;font:inherit;font-size:14px;margin-top:10px;background:var(--s2);outline:none}
#signin input:focus{border-color:var(--t);box-shadow:0 0 0 3px rgba(20,184,166,.16)}
#signin button{width:100%;margin-top:14px;background:var(--grad);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;font-size:14px}
#si-err{display:none;color:#b91c1c;font-size:12.5px;margin-top:10px}
/* ── header ── */
.hb{position:sticky;top:0;z-index:40;background:rgba(244,245,249,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hb-in{max-width:1320px;margin:0 auto;padding:12px 18px 0;display:flex;flex-direction:column;gap:10px}
.hb-top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mk{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 10px 22px -12px rgba(14,165,233,.9)}
.brand .mk svg{width:20px;height:20px}
.brand b{font:800 17px Sora,sans-serif;letter-spacing:-.01em;display:block}
.brand small{font-size:11.5px;color:var(--ink3);font-weight:600}
.sp{flex:1}
.me{display:flex;align-items:center;gap:9px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 4px;box-shadow:var(--sh1)}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--cg);color:#fff;display:grid;place-items:center;font:800 11px Sora,sans-serif;overflow:hidden;flex:none}
.me .av img{width:100%;height:100%;object-fit:cover}
.me span{font-size:12.5px;font-weight:700;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me em{font-style:normal;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--tl);background:rgba(20,184,166,.12);border-radius:999px;padding:2px 7px}
.me button{border:none;background:var(--s3);color:var(--ink2);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
/* ── client tabs ── */
.ctabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:0;margin:0 -2px}
.ctabs::-webkit-scrollbar{display:none}
.ct{position:relative;display:flex;align-items:center;gap:10px;padding:9px 14px 12px 10px;border:none;background:none;cursor:pointer;border-radius:12px 12px 0 0;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.ct:hover{background:rgba(17,19,34,.04)}
.ct .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;background:var(--g);box-shadow:0 8px 16px -10px var(--c);opacity:.85;transition:transform .2s,opacity .2s}
.ct .ic svg{width:16px;height:16px}
.ct .tx{text-align:left;line-height:1.15}
.ct .tx b{display:block;font-size:13.5px;font-weight:800;color:inherit}
.ct .tx small{font-size:11px;font-weight:600;color:var(--ink3)}
.ct .soon{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a16207;background:rgba(245,158,11,.14);border-radius:999px;padding:2px 7px;margin-left:2px}
.ct::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--g);transform:scaleX(0);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.ct.on{color:var(--ink)}
.ct.on .ic{opacity:1;transform:translateY(-1px)}
.ct.on::after{transform:scaleX(1)}
.ct.gear .ic{background:linear-gradient(135deg,#64748b,#334155)}
/* ── page ── */
.wrap{max-width:1320px;margin:0 auto;padding:18px 18px 70px}
.pane{animation:paneIn .35s cubic-bezier(.2,.8,.3,1) both}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{font:800 24px Sora,sans-serif;letter-spacing:-.015em;line-height:1.1}
.phead h2 em{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.phead .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.empty{padding:46px 24px;text-align:center}
.empty .big{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;color:#fff;background:var(--g,var(--grad));box-shadow:0 16px 30px -16px var(--c,#0ea5e9)}
.empty .big svg{width:30px;height:30px}
.empty h3{font:800 18px Sora,sans-serif}
.empty p{color:var(--ink2);font-size:13px;line-height:1.6;max-width:520px;margin:8px auto 0}
.btn{border:none;border-radius:10px;padding:9px 15px;font-weight:800;font-size:12.5px;cursor:pointer;background:var(--grad);color:#fff}
.btn.sec{background:var(--s1);color:var(--ink2);border:1px solid var(--line2)}
.btn.sm{padding:6px 11px;font-size:11.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#14161f;color:#fff;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99999;max-width:min(560px,92vw);text-align:center;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ── Team (owner) ── */
.tm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tm-c{padding:16px 16px 14px;position:relative;overflow:hidden}
.tm-c::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--g)}
.tm-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tm-h .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--g);flex:none}
.tm-h .ic svg{width:17px;height:17px}
.tm-h b{font-size:14.5px;font-weight:800;display:block}
.tm-h small{font-size:11.5px;color:var(--ink3);font-weight:600}
.mem{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.mc{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border-radius:999px;padding:3px 4px 3px 3px;font-size:12px;font-weight:700}
.mc .a{width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:800 9.5px Sora,sans-serif;overflow:hidden}
.mc .a img{width:100%;height:100%;object-fit:cover}
.mc-x{border:0;background:rgba(15,23,42,.08);color:#475569;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px/1 Inter,system-ui,sans-serif;cursor:pointer;margin-left:2px}
.mc-x:hover{background:#fee2e2;color:#b91c1c}
.tm-add{display:flex;gap:6px;margin-top:10px}
.tm-add select{flex:1;min-width:0;height:32px;border-radius:9px;border:1px solid rgba(15,23,42,.12);background:#fff;padding:0 8px;font:600 12px Inter,system-ui,sans-serif;color:#0f172a}
.mc small{font-size:10px;color:var(--ink3);font-weight:700}
.mc button{border:none;background:rgba(17,19,34,.08);width:18px;height:18px;border-radius:50%;cursor:pointer;color:var(--ink2);font-size:12px;line-height:1;margin-right:2px}
.tm-add{display:flex;gap:6px;margin-top:12px}
.tm-add input{flex:1;padding:8px 11px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:12.5px;background:var(--s2);outline:none}
.tm-add input:focus{border-color:var(--t)}
/* ═══════════ DESIGN & SHOPIFY (moved in from design-shopify.html) — scoped under .c-ds ═══════════ */
.c-ds{--waiting:#94a3b8;--editing:#6366f1;--drive:#f59e0b;--shopify:#10b981;--website:#059669;--hold:#64748b;--issue:#ef4444}
.c-ds .sub{color:var(--ink2);font-size:12.5px;line-height:1.55;margin:-4px 0 14px;max-width:880px}
.c-ds .top{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:14px}
.c-ds .stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center;box-shadow:var(--sh1)}
.c-ds .stat b{font:800 21px Sora,sans-serif;display:block}
.c-ds .stat span{font-size:10.5px;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.c-ds .stat.waiting b{color:var(--waiting)} .c-ds .stat.editing b{color:var(--editing)} .c-ds .stat.drive b{color:var(--drive)} .c-ds .stat.shopify b{color:var(--shopify)} .c-ds .stat.website b{color:var(--website)} .c-ds .stat.issue b{color:var(--issue)}
.c-ds .addbox{display:flex;gap:8px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:var(--sh1)}
.c-ds .addbox input,.c-ds .addbox select{flex:1;min-width:150px;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:13px;background:var(--s2);outline:none}
.c-ds .addbox input:focus{border-color:var(--website)}
.c-ds .addbox button{background:linear-gradient(135deg,#10b981,#065f46);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer}
.c-ds .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}
.c-ds .col{background:var(--s1);border:1px solid var(--line);border-radius:15px;padding:12px;min-height:120px;box-shadow:var(--sh1)}
.c-ds .col h3{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.c-ds .col h3 i{width:9px;height:9px;border-radius:50%;flex:none}
.c-ds .col.waiting h3 i{background:var(--waiting)} .c-ds .col.editing h3 i{background:var(--editing)} .c-ds .col.drive h3 i{background:var(--drive)} .c-ds .col.shopify h3 i{background:var(--shopify)} .c-ds .col.website h3 i{background:var(--website)} .c-ds .col.hold h3 i{background:var(--hold)} .c-ds .col.issue h3 i{background:var(--issue)}
.c-ds .acct{border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;background:var(--s1);box-shadow:0 1px 2px rgba(15,23,42,.05);transition:box-shadow .15s,transform .15s}
.c-ds .acct:hover{box-shadow:0 8px 22px rgba(15,23,42,.09);transform:translateY(-1px)}
.c-ds .acct b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-ds .acct .who{font-size:10.5px;color:var(--ink3);margin:2px 0 6px}
.c-ds .acct .btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.c-ds .acct button{border:1px solid var(--line2);background:var(--s1);border-radius:8px;padding:4px 8px;font-size:10.5px;font-weight:800;cursor:pointer;color:var(--ink2)}
.c-ds .acct button.go{border-color:rgba(16,185,129,.5);color:#0f766e;background:rgba(16,185,129,.08)}
.c-ds .acct button.warn{border-color:rgba(245,158,11,.5);color:#92400e;background:rgba(245,158,11,.08)}
.c-ds .kmenu{position:relative}
.c-ds .kmenu summary{list-style:none;cursor:pointer;width:27px;height:27px;border:1px solid var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-weight:900;background:var(--s1);font-size:14px}
.c-ds .kmenu summary::-webkit-details-marker{display:none}
.c-ds .kmenu[open] summary{background:var(--bg)}
.c-ds .kmenu .dd{position:absolute;right:0;top:31px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.16);padding:6px;min-width:210px;display:flex;flex-direction:column;gap:2px}
.c-ds .kmenu .dd button{border:none;background:none;text-align:left;padding:8px 10px;border-radius:8px;font:700 12px Inter,sans-serif;color:var(--ink2);cursor:pointer;white-space:nowrap}
.c-ds .kmenu .dd button:hover{background:var(--bg)}
.c-ds .kmenu .dd button.danger{color:#b91c1c}
.c-ds .kmenu .dd .sep{height:1px;background:var(--line);margin:4px 6px}
.c-ds .pvwrap{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 18px 8px;box-shadow:var(--sh1);margin-bottom:14px}
.c-ds .pvrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.c-ds .pvrow.first{border-top:none}
.c-ds .pvav{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:800 12.5px Sora,sans-serif;color:#fff}
.c-ds .pvbar{height:14px;border-radius:9px;background:rgba(15,23,42,.07);overflow:hidden;position:relative}
.c-ds .pvbar i{display:block;height:100%;border-radius:9px;transition:width .4s;background-image:linear-gradient(90deg,#34d399,#059669);position:relative;overflow:hidden}
.c-ds .pvbar i::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);animation:dsShine 2.4s infinite}
@keyframes dsShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.c-ds .pvpct{font-family:Sora,sans-serif;font-weight:800;min-width:118px;text-align:right;line-height:1.25}
.c-ds .sopbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh1)}
.c-ds .sopbox summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--ink2)}
.c-ds .sopbox summary::-webkit-details-marker{display:none}
.c-ds .sopbox summary::after{content:' ▾'} .c-ds .sopbox[open] summary::after{content:' ▴'}
.c-ds .sopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.c-ds .sopph{background:rgba(15,23,42,.03);border-radius:10px;padding:9px 11px;font-size:11.5px;color:var(--ink2);line-height:1.55}
.c-ds .sopph b{display:block;font-size:11.5px;color:var(--ink);margin-bottom:3px}
.c-ds .vpill{border:1px solid var(--line2);background:var(--s1);color:var(--ink2);border-radius:999px;padding:6px 13px;font:800 12px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.c-ds .vpill.on{border-color:#065f46;background:rgba(16,185,129,.12);color:#065f46}
.c-ds .q{width:100%;max-width:340px;padding:9px 13px;border:1px solid var(--line2);border-radius:999px;font:inherit;font-size:13px;background:var(--s1);margin-bottom:12px;outline:none}
/* QC modal */
#qcmask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:9000;align-items:center;justify-content:center;padding:16px}
#qcmask.on{display:flex}
#qcbox{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(15,23,42,.3);max-height:88vh;overflow:auto}
#qcbox h2{font:800 17px Sora,sans-serif;margin-bottom:2px}
#qcbox .qsub{font-size:12px;color:var(--ink3);margin-bottom:12px}
.qcitem{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.qcitem input{margin-top:2px;accent-color:#059669}
.qcitem.ok{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.06);color:#065f46}
#qc-pub{width:100%;margin-top:10px;background:linear-gradient(135deg,#10b981,#065f46);color:#fff;border:none;border-radius:11px;padding:12px;font:800 14px Inter,sans-serif;cursor:pointer}
#qc-pub:disabled{opacity:.4;cursor:not-allowed}
#qc-close{width:100%;margin-top:7px;background:none;border:1px solid var(--line2);border-radius:11px;padding:10px;font:800 12.5px Inter,sans-serif;color:var(--ink3);cursor:pointer}
/* ═══════════ IMPERIUM (IG · physical phones) ═══════════ */
.c-ima{--ig:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);--igc:#c13584;--igs:rgba(221,42,123,.08)}
.c-ima .btn{background:var(--ig)} .c-ima .btn.sec{background:var(--s1);color:var(--ink2);border:1px solid var(--line2)}
.c-ima .sub{font-size:12.5px;color:var(--ink2);margin:-2px 0 12px;line-height:1.55}
.c-ima .sopbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh1)}
.c-ima .sopbox summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--ink2)}
.c-ima .sopbox summary::-webkit-details-marker{display:none}
.c-ima .sopbox summary::after{content:' ▾'} .c-ima .sopbox[open] summary::after{content:' ▴'}
.c-ima .sopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.c-ima .sopph{background:var(--igs);border-radius:10px;padding:9px 11px;font-size:11.5px;color:var(--ink2);line-height:1.55}
.c-ima .sopph b{display:block;font-size:11.5px;color:var(--ink);margin-bottom:3px}
.c-ima .istats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.c-ima .istat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.c-ima .istat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ig)}
.c-ima .istat b{display:block;font:800 21px Sora,sans-serif;letter-spacing:-.02em;color:var(--ink)}
.c-ima .istat b small{font-size:12px;color:var(--ink4);font-weight:700;margin-left:1px}
.c-ima .istat span{font-size:11px;font-weight:700;color:var(--ink3)}

  for(var a=0;a<=tries;a++){
    try{
      var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
      var tm=ctl?setTimeout(function(){ try{ ctl.abort(); }catch(_){} },12000):null;
      var r=await fetch(url, ctl?{signal:ctl.signal}:undefined);
      if(tm) clearTimeout(tm);
      return await r.json();
    }catch(e){ if(a===tries) throw e; await new Promise(function(res){ setTimeout(res, 600*(a+1)); }); }
  }
}
function apiGet(q){ var u=API+'?'+Object.keys(q).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(q[k]==null?'':q[k]); }).join('&')+'&_='+Date.now(); return jFetch(u, 1); }

function myId(){ return String((USER&&USER.id)||'').toUpperCase(); }

var NAMES={}, SHIFTOF={}, PHOTOOF={};
function drivePhoto(u){ u=String(u||''); if(!u) return ''; var m=u.match(/[-\w]{25,}/); return m?('https://drive.google.com/thumbnail?id='+m[0]+'&sz=w128'):u; }
(function(){ try{ var c=JSON.parse(sessionStorage.getItem('jmb_empdir')||'null');
  if(c && c.N && (Date.now()-(c.t||0))<24*3600*1000){ NAMES=c.N||{}; SHIFTOF=c.S||{}; PHOTOOF=c.P||{}; } }catch(e){} })();
var _nmTry=0;
async function loadNames(){
  try{
    var d=null;
    try{ d=await jFetch(API+'?action=emp_dir&_='+Date.now(), 1); }catch(_e1){}
    if(!d || !d.employees || !d.employees.length) d=await jFetch(API+'?action=get_all_employees&_='+Date.now(), 1);
    if(!d || !d.employees || !d.employees.length) throw new Error('empty');
    d.employees.forEach(function(e){
      var k=String(e.employee_id).toLowerCase();
      NAMES[k]=e.full_name||e.employee_id;
      var sh=String(e.shift||'').toLowerCase(); if(!sh && e.payslips && e.payslips.length) sh=String((e.payslips[0]||{}).shift||'').toLowerCase();
      SHIFTOF[k]=sh; PHOTOOF[k]=drivePhoto(e.photo||'');
    });
    try{ sessionStorage.setItem('jmb_empdir', JSON.stringify({ N:NAMES, S:SHIFTOF, P:PHOTOOF, t:Date.now() })); }catch(_p){}
    try{ HUB.repaint(); }catch(_r){}
  }catch(e){
    _nmTry++; setTimeout(loadNames, Math.min(300000, 30000*Math.pow(2,_nmTry-1)) + Math.random()*10000);
  }
}
function vaName(id){ return NAMES[String(id||'').toLowerCase()]||id||'—'; }
function initials(name){ return String(name||'?').split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0); }).join('').toUpperCase()||'?'; }
function avatar(id, cls){ var k=String(id||'').toLowerCase(), p=PHOTOOF[k]; return '<span class="'+(cls||'a')+'">'+(p?'<img src="'+esc(p)+'" alt="">':esc(initials(vaName(id))))+'</span>'; }
/* shift-aware "this shift" key — a night VA's shift that started yesterday 8 PM is still today's work */
function vaKeyOf(empId){
  var sh=SHIFTOF[String(empId||'').toLowerCase()];
  if(sh==='night'){ var d=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila'}).format(new Date(Date.now()-20*3600*1000)); return d+'·PM'; }
  return today()+'·AM';
}
function markOk(v, empId){
  if(!v) return false;
  if(v===vaKeyOf(empId)) return true;
  var sh=SHIFTOF[String(empId||'').toLowerCase()];
  return sh!=='night' && v===today();
}

.pfx-st .dots i:nth-child(2){animation-delay:.15s}.pfx-st .dots i:nth-child(3){animation-delay:.3s}
.pfx-st.ok{background:rgba(16,185,129,.14);box-shadow:inset 0 0 0 1px rgba(52,211,153,.35);color:#6ee7b7}
.pfx-st.bad{background:rgba(244,63,94,.12);box-shadow:inset 0 0 0 1px rgba(244,63,94,.3);color:#fda4af}
.pfx-st .tx{transition:opacity .25s}
.pfx-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pfx-step{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:11px;font-size:11.5px;font-weight:700;line-height:1.25;color:rgba(255,255,255,.45);background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:all .35s}
.pfx-step .n{flex:none;font-style:normal;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);transition:all .35s}
.pfx-step.on{color:#fff;background:rgba(255,107,26,.10);box-shadow:inset 0 0 0 1px rgba(255,107,26,.45)}
.pfx-step.on .n{background:#FF6B1A;color:#fff;box-shadow:0 0 0 4px rgba(255,107,26,.18)}
.pfx-step.dn{color:rgba(255,255,255,.75)}
.pfx-step.dn .n{background:#10b981;color:#fff;font-size:0}
.pfx-step.dn .n::after{content:'✓';font-size:11px}
.pfx-step span b{color:#fff}
.pfx-btns{display:flex;gap:8px;margin-top:14px}
.pfx-btn{font:inherit;font-weight:800;font-size:14px;border-radius:13px;padding:13px 16px;cursor:pointer;text-decoration:none;text-align:center;border:none;transition:transform .15s,filter .15s}
.pfx-btn:active{transform:scale(.97)}
.pfx-btn.p{flex:1;color:#fff;background:linear-gradient(135deg,#FF8A3D,#FF6B1A 50%,#E8452A);box-shadow:0 12px 28px -12px rgba(255,107,26,.9)}
.pfx-btn.p:hover{filter:brightness(1.07)}
.pfx-btn.s{color:#e9e5ff;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pfx-card.done .pfx-btns{display:none}
.pfx-ov{position:fixed;inset:0;z-index:9960;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(8,6,14,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:pfxFade .25s ease-out both}
.pfx-ov.out{animation:pfxFadeOut .3s ease-in both}
.pfx-ov .pfx-card{animation:pfxRise .45s cubic-bezier(.2,1.2,.4,1) both}
/* ── the "linked" card ── */
.pfx-cel{position:fixed;left:50%;top:14px;z-index:99990;width:min(390px,calc(100vw - 20px));transform:translateX(-50%);color:#f5f3ff;background:rgba(20,17,31,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px;padding:12px 12px 12px;box-shadow:0 24px 60px -18px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.1);font-family:inherit;cursor:pointer;animation:pfxDrop .5s cubic-bezier(.2,1.3,.4,1) both;text-align:left}
.pfx-cel.out{animation:pfxLift .35s ease-in both}
.pfx-cel .hd{display:flex;align-items:center;gap:8px;padding:0 2px 9px}
.pfx-cel .hd b{font-size:14px;font-weight:800}
.pfx-cel .hd span{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6ee7b7}
.pfx-cel .ft{font-size:12px;color:rgba(255,255,255,.62);padding:9px 2px 0;line-height:1.45}
@keyframes pfxBreath{0%,100%{transform:scale(1)}50%{transform:scale(.95)}}
@keyframes pfxPing{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@keyframes pfxEmit{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.28)}}
@keyframes pfxDash{to{background-position:12px 0}}
@keyframes pfxPkt{0%{left:0;opacity:0}15%{opacity:1}82%{opacity:1}100%{left:calc(100% - 44px);opacity:0}}
@keyframes pfxFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pfxFlick{0%,100%{opacity:1}46%{opacity:.35}50%{opacity:1}54%{opacity:.5}58%{opacity:1}}
@keyframes pfxFlow{0%{left:-26%}62%,100%{left:100%}}
@keyframes pfxFlowR{0%{left:100%}62%,100%{left:-26%}}
@keyframes pfxSpin{to{transform:rotate(360deg)}}
@keyframes pfxPop{0%{transform:scale(1)}35%{transform:scale(.88)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes pfxHubPop{0%{transform:scale(.6)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes pfxBreathHub{0%,100%{box-shadow:0 0 0 3px rgba(52,211,153,.16),0 6px 20px -4px rgba(16,185,129,.6)}50%{box-shadow:0 0 0 6px rgba(52,211,153,.10),0 6px 24px -2px rgba(16,185,129,.8)}}
@keyframes pfxWave{0%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(3.4)}}
@keyframes pfxBeat{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pfxSpk{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
@keyframes pfxFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes pfxDot{0%{box-shadow:0 0 0 0 rgba(255,107,26,.6)}100%{box-shadow:0 0 0 8px rgba(255,107,26,0)}}
@keyframes pfxDots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes pfxFade{from{opacity:0}to{opacity:1}}
@keyframes pfxFadeOut{to{opacity:0}}
@keyframes pfxRise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pfxDrop{from{opacity:0;transform:translate(-50%,-24px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pfxLift{to{opacity:0;transform:translate(-50%,-16px) scale(.97)}}

/* ══════════════ PROOF OF WORK — shared by every client tab ══════════════
   Every counted output needs a screenshot first. bump(project, task, n) is the single choke point: it opens the
   proof panel and only posts the count (po_bump → the portal scorecard's productivity) once the screenshots are
   saved. Cancel rejects, which stops the caller — nothing is marked done that wasn't counted.
   Screenshots go straight to Supabase storage (Apps Script only records the URL); if storage is down they fall
   back to the Apps Script upload, so a VA is never blocked. Capture uses getDisplayMedia: pick the window once. */
var SHOT={ stream:null, video:null, max:5 };
function shotSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia); }
function shotLive(){ return !!(SHOT.stream && SHOT.stream.getVideoTracks().length && SHOT.stream.getVideoTracks()[0].readyState==='live'); }
async function shotStart(){
  if(!shotSupported()){ toast('This browser can\'t capture windows — use 📎 to attach a file.'); return false; }
  try{
    toast('Pick the window you\'re working in.');
    SHOT.stream=await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:1 }, audio:false });
    SHOT.video=document.createElement('video'); SHOT.video.srcObject=SHOT.stream; SHOT.video.muted=true;
    await SHOT.video.play();
    SHOT.stream.getVideoTracks()[0].addEventListener('ended', function(){ SHOT.stream=null; SHOT.video=null; toast('Screen sharing stopped — 📷 picks a window again.'); });
    toast('Window locked in — 📷 is one click from now on.');
    return true;
  }catch(e){ toast('Capture cancelled.'); return false; }
}
function shotStop(){ try{ if(SHOT.stream) SHOT.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} SHOT.stream=null; SHOT.video=null; }
function shotGrab(){
  if(!shotLive()) return null;
  var v=SHOT.video, w=v.videoWidth, h=v.videoHeight; if(!w||!h) return null;
  var max=1000, sw=w, sh=h; if(sw>max||sh>max){ var r=Math.min(max/sw,max/sh); sw=Math.round(sw*r); sh=Math.round(sh*r); }
  var c=document.createElement('canvas'); c.width=sw; c.height=sh; c.getContext('2d').drawImage(v,0,0,sw,sh);
  return c.toDataURL('image/jpeg',0.62);
}
function proofCompress(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ var im=new Image();
      im.onload=function(){ var max=1000, w=im.width, h=im.height; if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
        var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); res(c.toDataURL('image/jpeg',0.62)); };
      im.onerror=function(){ rej(new Error('bad image')); }; im.src=fr.result; };
    fr.onerror=function(){ rej(new Error('read failed')); }; fr.readAsDataURL(file);
  });
}
var PROOF={ imgs:[], ctx:null, resolve:null, reject:null };
var PSUPA_BUCKET='proof', _psb=null;
function psb(){ if(_psb) return _psb; var Lib=window.supabase||window.Supabase; if(!Lib||!Lib.createClient) return null; try{ _psb=Lib.createClient(SB_URL,SB_KEY); }catch(e){ _psb=null; } return _psb; }
function _dataUrlToBlob(d){ var m=/^data:([^;]+);base64,(.*)$/.exec(d); if(!m) return null; var bin=atob(m[2]), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:m[1]}); }
async function psUpload(dataUrl, emp, label){
  var sb=psb(); if(!sb) throw new Error('no client');
  var blob=_dataUrlToBlob(dataUrl); if(!blob) throw new Error('bad image');
  var d=new Date(), ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  var safe=String(label||'proof').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'proof';
  var path=(emp||'unknown')+'/'+ym+'/'+safe+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.jpg';
  var up=await sb.storage.from(PSUPA_BUCKET).upload(path, blob, { contentType:'image/jpeg', upsert:false });
  if(up.error) throw up.error;

/* each image starts uploading the moment it's attached; Save only waits for what's still in flight */
var PUP={ q:{} };
function pupKey(d){ return d.length+'|'+d.slice(-24); }
function pupStart(dataUrl, ctx){
  var k=pupKey(dataUrl); if(PUP.q[k]) return PUP.q[k];
  var st={ state:'up', id:null, url:null }, emp=myId(), label=(ctx&&(ctx.task||ctx.project))||'proof';
  st.p=psUpload(dataUrl, emp, label)
    .then(function(u){ st.state='done'; st.url=u; pupPaint(); return st; })
    .catch(function(){
      return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ action:'proof_img', employee_id:emp, task:(ctx&&ctx.task)||'', date:today(), image:dataUrl }) })
        .then(function(r){ return r.json(); })
        .then(function(d){ if(d && d.ok && d.id){ st.state='done'; st.id=d.id; } else st.state='fail'; pupPaint(); return st; })
        .catch(function(){ st.state='fail'; pupPaint(); return st; });
    });

}
function pupPaint(){
  var el=$('pup-stat'); if(!el) return;
  var up=0, done=0, fail=0;
  (PROOF.imgs||[]).map(pupKey).forEach(function(k){ var s=PUP.q[k]; if(!s) return; if(s.state==='up') up++; else if(s.state==='done') done++; else fail++; });
  el.textContent=fail?(fail+' failed — retried on save'):up?('Uploading '+up+'…  '+done+' attached'):done?(done+' screenshot'+(done>1?'s':'')+' attached — nothing counts until you press Save'):'';
  el.style.color=fail?'#b91c1c':(up?'#b45309':'#047857');

async function pupRefs(ctx){
  var urls=[], ids=[];

    var d=PROOF.imgs[i], k=pupKey(d), st=PUP.q[k];

    var r=await st.p; if(!r || r.state!=='done') return null;
    if(r.url) urls.push(r.url); else if(r.id) ids.push(r.id); else return null;
  }
  if(urls.length===PROOF.imgs.length) return { urls:urls };

}

/* ═══════════ CLIENT: DESIGN & SHOPIFY (Torchlight) — moved in from design-shopify.html, same data ═══════════
   Each card is one design/product moving through the SOP: Waiting for Files → Editing (Photoshop) → Drive →
   Shopify listing → Final QC → Published. Publishing (all QC checks ticked + proof) counts +1 Shopify Product
   Upload. Anything missing or wrong → pause the card (Issue / On hold), don't push through.
   Module shape every client follows: { id, rows, load(), render(host), onShow() }. */
var DS=(function(){
  var CL=function(){ return clientById('design-shopify'); };
  var PROJECT='Design & Shopify';
  var QC_LIST=['Titles and descriptions added','Correct design / high-quality image','Correct type, vendor, collections and tags'];
  var AVC=['#059669','#0ea5e9','#6366f1','#f59e0b','#ec4899','#8b5cf6','#14b8a6','#f97316'];
  var S={ rows:[], loaded:false, err:'', filter:'mine', q:'', qc:null, busy:false };
  try{ S.filter=sessionStorage.getItem('dc_va_'+PROJECT)||'mine'; }catch(e){}
  function ownerOf(r){ return String(r.assigned_to||r.created_by||'').toLowerCase(); }
  function cacheRows(){ try{ sessionStorage.setItem('dc_rows_'+PROJECT, JSON.stringify({ t:Date.now(), rows:S.rows })); }catch(e){} }
  function paintCached(){ try{ var c=JSON.parse(sessionStorage.getItem('dc_rows_'+PROJECT)||'null'); if(c && c.rows && c.rows.length && (Date.now()-c.t)<10*60*1000){ S.rows=c.rows; S.loaded=true; return true; } }catch(e){} return false; }
  async function load(){
    try{
      var d=await jFetch(API+'?action=pa_list&project='+encodeURIComponent(PROJECT)+'&_='+Date.now());
      if(!d||!d.ok) throw new Error((d&&d.error)||'load');
      S.rows=d.rows||[]; S.loaded=true; S.err=''; cacheRows();
    }catch(e){ S.err='Could not load — check your connection, then refresh.'; }
    HUB.onData('design-shopify');
  }
  /* who works this client, from the board itself (anyone who owns a card) */
  function owners(){ var m={}; S.rows.forEach(function(r){ var k=ownerOf(r); if(k) m[k]=1; }); return Object.keys(m); }
  function count(st){ return S.rows.filter(function(r){ return r.status===st; }).length; }
  function pubToday(){ return S.rows.filter(function(r){ return markOk(r.meta&&r.meta.pub, ownerOf(r)); }).length; }
  function filterRows(){ if(isOwner() && S.filter==='mine') S.filter='all'; if(S.filter==='all') return S.rows; var t=(S.filter==='mine')?String((USER&&USER.id)||'').toLowerCase():S.filter; return S.rows.filter(function(r){ return ownerOf(r)===t; }); }
  function setFilter(f){ S.filter=f; try{ sessionStorage.setItem('dc_va_'+PROJECT,f); }catch(e){} paint(); }
  function setQ(v){ S.q=v; paintBoard(); }
  function kmenu(items){
    return '<details class="kmenu" onclick="event.stopPropagation()"><summary>⋯</summary><div class="dd">'+items.map(function(it){
      if(it==='---') return '<div class="sep"></div>';
      return '<button class="'+(it[2]||'')+'" onclick="this.closest(\'details\').removeAttribute(\'open\');'+it[1]+'">'+it[0]+'</button>';
    }).join('')+'</div></details>';
  }
  var _snapKey='';
  function maybeSnap(done, tot){
    try{
      if(!USER||!tot||isOwner()) return;
      var k='snap_'+PROJECT+'_'+vaKeyOf(USER.id), v=done+'/'+tot; if(sessionStorage.getItem(k)===v) return; sessionStorage.setItem(k, v);
      fetch(API+'?action=po_snap&employee_id='+encodeURIComponent(USER.id)+'&project='+encodeURIComponent(PROJECT)+'&task='+encodeURIComponent('📋 Board Completion')+'&done='+done+'&total='+tot+'&date='+encodeURIComponent(today())+'&_='+Date.now()).catch(function(){});
    }catch(e){}
  }
  function byVA(){
    var by={}; S.rows.forEach(function(r){ var k=ownerOf(r)||'—'; (by[k]=by[k]||[]).push(r); });
    var keys=Object.keys(by); if(!keys.length) return '';
    var mine=String((USER&&USER.id)||'').toLowerCase();
    var list=keys.map(function(k,i){ var rows=by[k];
      var pub=rows.filter(function(r){ return markOk(r.meta&&r.meta.pub, k); }).length;
      var pipe=rows.filter(function(r){ return ['waiting','editing','drive','shopify'].indexOf(r.status)>=0; }).length, tot=pub+pipe;
      return { k:k, i:i, done:pub, tot:tot, pct:tot?Math.round(pub/tot*100):0, n:rows.length };
    }).sort(function(a,b){ return b.done-a.done || b.pct-a.pct; });
    try{ var me=list.filter(function(o){ return o.k===mine; })[0]; if(me) maybeSnap(me.done, me.tot); }catch(_m){}
    return '<div class="pvwrap"><div style="display:flex;align-items:baseline;gap:9px;margin-bottom:4px;flex-wrap:wrap"><span style="font:800 15px Sora,sans-serif;">Today — published per VA</span><span style="font-size:11px;color:var(--ink3);font-weight:700;">this shift · resets per shift · morning 8 AM / night 8 PM</span></div>'+
      list.map(function(o,ix){
        var name=vaName(o.k), me=(o.k===mine), pc=o.pct>=100?'#059669':(o.pct>=50?'#f59e0b':'#64748b');
        return '<div class="pvrow'+(ix===0?' first':'')+'"'+(me?' style="background:rgba(16,185,129,.05);border-radius:12px;padding-left:10px;padding-right:10px;"':'')+'>'+
          (PHOTOOF[o.k]?'<img src="'+esc(PHOTOOF[o.k])+'" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 2px 8px rgba(15,23,42,.18);">':'<div class="pvav" style="background:'+AVC[o.i%AVC.length]+'">'+esc(initials(name))+'</div>')+
          '<div style="flex:1;min-width:0;"><div style="display:flex;align-items:baseline;gap:8px;"><b style="font-size:13.5px;">'+esc(name)+'</b>'+(me?'<span style="font-size:10px;color:#065f46;font-weight:800;">you</span>':'')+'<span style="font-size:11px;color:var(--ink3);font-weight:700;">'+(SHIFTOF[o.k]==='night'?'night':'morning')+' · '+o.n+' on board</span></div>'+
          '<div class="pvbar" style="margin-top:7px;"><i style="width:'+Math.min(100,o.pct)+'%;"></i></div></div>'+
          '<div class="pvpct" style="color:'+pc+'"><span style="font-size:17px;">'+o.done+'</span> <span style="font-size:12px;color:var(--ink3);">published</span><br><span style="font-size:12.5px;">'+o.tot+' in play · '+o.pct+'%</span></div></div>';
      }).join('')+'</div>';
  }
  function tabs(){
    if(isOwner() && S.filter==='mine') S.filter='all';
    var mine=String((USER&&USER.id)||'').toLowerCase(), by={};
    S.rows.forEach(function(r){ var k=ownerOf(r)||'—'; by[k]=(by[k]||0)+1; });
    function pill(val,label,n){ return '<button class="vpill'+(S.filter===val?' on':'')+'" onclick="DS.setFilter(\''+jsq(val)+'\')">'+label+(n!=null?' · '+n:'')+'</button>'; }
    var h=isOwner()?[pill('all','All', S.rows.length)]:[pill('mine','My tasks', by[mine]||0), pill('all','All', S.rows.length)];
    Object.keys(by).sort(function(a,b){ return by[b]-by[a]; }).forEach(function(k){ if((k===mine && !isOwner())||k==='—') return; h.push(pill(k, esc(vaName(k)), by[k])); });
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'+h.join('')+'</div>';
  }
  function stats(){
    return '<div class="stat waiting"><b>'+count('waiting')+'</b><span>Waiting for files</span></div>'+
      '<div class="stat editing"><b>'+count('editing')+'</b><span>Editing</span></div>'+
      '<div class="stat drive"><b>'+count('drive')+'</b><span>Drive</span></div>'+
      '<div class="stat shopify"><b>'+count('shopify')+'</b><span>Shopify</span></div>'+
      '<div class="stat website"><b>'+count('website')+'</b><span>Published</span></div>'+
      '<div class="stat issue"><b>'+(count('hold')+count('issue'))+'</b><span>Paused / issue</span></div>'+
      '<div class="stat website"><b>'+pubToday()+'</b><span>Published today</span></div>';
  }
  function board(){
    if(!S.loaded) return '<div class="muted" style="padding:8px">'+(S.err?esc(S.err):'Loading the board…')+'</div>';
    var base=filterRows(), q=String(S.q||'').trim().toLowerCase();
    if(q) base=base.filter(function(r){ return String(r.handle||'').toLowerCase().indexOf(q)>=0 || String(r.model||'').toLowerCase().indexOf(q)>=0 || String(vaName(ownerOf(r))).toLowerCase().indexOf(q)>=0; });
    var defs=[['waiting','Waiting for Files'],['editing','Editing — Photoshop'],['drive','Drive Uploaded'],['shopify','Shopify Listing'],['website','Published — Website'],['hold','On Hold'],['issue','Issue Found']];
    return '<div class="cols">'+defs.map(function(df){
      var st=df[0], items=base.filter(function(r){ return r.status===st; });
      if((st==='hold'||st==='issue') && !items.length) return '';
      var cards=items.map(function(r){
        var id=jsq(r.id), btns='', menu=[];
        if(st==='waiting'){ btns='<button class="go" onclick="DS.move(\''+id+'\',\'editing\')">Files verified → Start editing</button>'; menu.push(['Issue found — pause',"DS.pause('"+id+"','issue')"]); menu.push(['Put on hold',"DS.pause('"+id+"','hold')"]); }
        else if(st==='editing'){ btns='<button class="go" onclick="DS.move(\''+id+'\',\'drive\')">Exported → Drive upload</button>'; menu.push(['Back to Waiting for Files',"DS.move('"+id+"','waiting')"]); menu.push(['Issue found — pause',"DS.pause('"+id+"','issue')"]); menu.push(['Put on hold',"DS.pause('"+id+"','hold')"]); }
        else if(st==='drive'){ btns='<button class="go" onclick="DS.move(\''+id+'\',\'shopify\')">Uploads verified → Shopify</button>'; menu.push(['Back to Editing',"DS.move('"+id+"','editing')"]); menu.push(['Issue found — pause',"DS.pause('"+id+"','issue')"]); menu.push(['Put on hold',"DS.pause('"+id+"','hold')"]); }
        else if(st==='shopify'){ btns='<button class="go" onclick="DS.qcOpen(\''+id+'\')">Final QC → Publish</button>'; menu.push(['Back to Drive',"DS.move('"+id+"','drive')"]); menu.push(['Issue found — pause',"DS.pause('"+id+"','issue')"]); menu.push(['Put on hold',"DS.pause('"+id+"','hold')"]); }
        else if(st==='website'){ btns='<button disabled style="opacity:.55">Published'+(markOk(r.meta&&r.meta.pub, ownerOf(r))?' this shift':'')+'</button>'; menu.push(['Reopen on Shopify (edit listing)',"DS.move('"+id+"','shopify')"]); }
        else if(st==='hold'||st==='issue'){ btns='<button class="warn" onclick="DS.resume(\''+id+'\')">'+(st==='issue'?'Issue resolved → resume':'Resume')+'</button>'; }
        if(menu.length) menu.push('---');
        menu.push(['Delete (wrong entry)',"DS.del('"+id+"')",'danger']);
        return '<div class="acct"><div style="display:flex;align-items:center;gap:6px;"><b style="flex:1;min-width:0">'+esc(r.handle)+'</b>'+kmenu(menu)+'</div>'+
          '<div class="who">'+(r.model?esc(r.model)+' · ':'')+esc(vaName(ownerOf(r)))+((st==='hold'||st==='issue')&&r.meta&&r.meta.prev?(' · was: '+esc(r.meta.prev)):'')+'</div><div class="btns">'+btns+'</div></div>';
      }).join('');
      return '<div class="col '+st+'"><h3><i></i>'+df[1]+' · '+items.length+'</h3>'+(cards||'<div class="muted">None.</div>')+'</div>';
    }).join('')+'</div>';
  }
  function render(host){
    host.innerHTML='<div class="c-ds">'+
      '<div class="sub">Each card is one design/product moving through the SOP. Publishing on Shopify (all QC checks passed) counts <b>+1 Shopify Product Upload</b>. If anything is missing or wrong — pause the card, don\'t push through.</div>'+
      '<details class="sopbox"><summary>SOP — Shopify &amp; Photoshop workflow</summary><div class="sopgrid">'+
        '<div class="sopph"><b>🛒 Shopify · Step 1 — Get the files</b>Find the Shopify task/design to upload. Use designs that are already edited. If Kristina sends the files, use those. If the files are in Google Drive, locate and use the required files.</div>'+
        '<div class="sopph"><b>🛒 Shopify · Step 2 — Upload &amp; edit in Shopify</b>Open Shopify · upload the correct design · add the product title &amp; description · upload the correct images · add the correct type, vendor, collections &amp; tags · save the product.</div>'+
        '<div class="sopph"><b>🎨 Photoshop · Step 1 — Get the design</b>Receive the design to edit from Kristina. If it\'s already in Google Drive, locate and download the correct file.</div>'+
        '<div class="sopph"><b>🎨 Photoshop · Step 2 — Edit the design</b>Open the design in Photoshop · edit according to the task · create mock-ups when required · add the correct color · save the edited design.</div>'+
        '<div class="sopph"><b>🎨 Photoshop · Step 3 — Export the files</b>Export the completed design as JPG or PNG. Make sure the final export is correct.</div></div>'+
        '<div class="sopph" style="margin-top:10px;background:rgba(16,185,129,.09)"><b>✅ QA checklist — Shopify</b>☐ Titles and descriptions added &nbsp; ☐ Correct design / high-quality image &nbsp; ☐ Correct type, vendor, collections &amp; tags</div></details>'+
      '<div class="top" id="ds-stats">'+stats()+'</div>'+
      '<div class="addbox"><input id="ds-name" placeholder="Design / product name"><input id="ds-store" placeholder="Store / brand (optional)" style="max-width:220px">'+
        '<select id="ds-status"><option value="waiting">Waiting for Files</option><option value="editing">Editing (Photoshop)</option><option value="drive">Drive Uploaded</option><option value="shopify">Shopify Listing</option></select>'+
        '<button onclick="DS.add()">＋ Add design task</button></div>'+
      '<div id="ds-byva">'+byVA()+'</div>'+
      '<div id="ds-tabs">'+tabs()+'</div>'+
      '<input class="q" id="ds-q" placeholder="Search design, store or VA…" value="'+esc(S.q)+'" oninput="DS.setQ(this.value)">'+
      '<div id="ds-board">'+board()+'</div></div>';
    var n=$('ds-name'); if(n) n.addEventListener('keydown', function(e){ if(e.key==='Enter') add(); });
  }
  /* repaint without touching the add form (so typing is never lost to a poll) */
  function paint(){
    if(!$('ds-board')) return HUB.repaint();
    $('ds-stats').innerHTML=stats(); $('ds-byva').innerHTML=byVA(); $('ds-tabs').innerHTML=tabs(); paintBoard();
  }
  function paintBoard(){ var b=$('ds-board'); if(b) b.innerHTML=board(); }
  function rowById(id){ return S.rows.filter(function(x){ return x.id===id; })[0]; }
  async function upd(id, q, okMsg){
    try{
      var d=await jFetch(API+'?action=pa_update&id='+encodeURIComponent(id)+Object.keys(q).map(function(k){ return '&'+k+'='+encodeURIComponent(q[k]); }).join('')+'&_='+Date.now(), 1);
      if(d&&d.ok){ toast(okMsg); load(); return true; }
      toast('Could not update — '+((d&&d.error)||'try again')+'.'); return false;
    }catch(e){ toast('Connection error.'); return false; }
  }
  async function add(){
    var u=($('ds-name').value||'').trim(), m=($('ds-store').value||'').trim(), st=($('ds-status')||{}).value||'waiting';
    if(!u){ toast('Type the design / product name.'); return; }
    if(!(await linkGate(CL(), 'Adding a design task'))) return;
    try{
      var d=await jFetch(API+'?action=pa_add&project='+encodeURIComponent(PROJECT)+'&handle='+encodeURIComponent(u)+'&model='+encodeURIComponent(m)+'&status='+encodeURIComponent(st)+'&meta='+encodeURIComponent('{}')+'&employee_id='+encodeURIComponent(USER.id)+'&_='+Date.now(), 0);
      if(d&&d.ok){ $('ds-name').value=''; $('ds-store').value=''; toast('Added → '+st); load(); }
      else if(d&&d.error==='DUPLICATE') toast('That design is already on the board — search first!');
      else toast('Could not add.');
    }catch(e){ toast('Connection error.'); }
  }
  async function move(id, st){ if(!(await linkGate(CL(), 'Moving a card'))) return; upd(id, { status:st }, 'Updated → '+st); }
  async function pause(id, kind){
    var r0=rowById(id); if(!r0) return;
    if(!(await linkGate(CL(), 'Pausing a card'))) return;
    upd(id, { status:kind, meta:JSON.stringify(Object.assign({}, r0.meta||{}, { prev:r0.status })) }, kind==='issue'?'Paused — fix the issue before continuing.':'On hold.');
  }
  function resume(id){ var r0=rowById(id); if(!r0) return; move(id, (r0.meta&&r0.meta.prev)||'waiting'); }
  async function del(id){
    var r0=rowById(id);
    if(!confirm('DELETE '+((r0&&r0.handle)||'this task')+' from the board?\n\nUse this only for wrong entries. Outputs already counted are not affected.')) return;
    try{
      var d=await jFetch(API+'?action=pa_delete&id='+encodeURIComponent(id)+'&employee_id='+encodeURIComponent(isOwner()?'admin':USER.id)+'&_='+Date.now(), 0);
      if(d&&d.ok){ toast('Deleted.'); load(); }
      else if(d&&d.error==='NOT_YOURS') toast('Only the VA who owns this entry (or the admin) can delete it.');
      else toast('Could not delete: '+((d&&d.error)||'error'));
    }catch(e){ toast('Connection error.'); }
  }
  /* Final QC gate: every check ticked before Publish */
  async function qcOpen(id){
    if(!(await linkGate(CL(), 'Publishing'))) return;
    S.qc=id; var r0=rowById(id);
    $('qc-name').textContent=(r0?r0.handle:'')+' — tick every check from the SOP QC checklist to unlock Publish.';
    $('qc-items').innerHTML=QC_LIST.map(function(t,i){ return '<label class="qcitem" id="qci'+i+'"><input type="checkbox" onchange="DS.qcTick('+i+')"> '+esc(t)+'</label>'; }).join('');
    $('qc-pub').disabled=true; $('qcmask').classList.add('on');
  }
  function qcTick(i){
    var el=$('qci'+i); if(el) el.classList.toggle('ok', el.querySelector('input').checked);
    $('qc-pub').disabled=!QC_LIST.every(function(_,j){ var e=$('qci'+j); return e && e.querySelector('input').checked; });
  }
  function qcClose(){ $('qcmask').classList.remove('on'); S.qc=null; }
  async function qcPublish(){
    var id=S.qc; if(!id) return; var r0=rowById(id); if(!r0) return;
    $('qc-pub').disabled=true;
    try{ await bump(PROJECT, 'Shopify Product Upload', 1); }catch(e){ $('qc-pub').disabled=false; return; }   // proof BEFORE it's marked published
    var ok=await upd(id, { status:'website', meta:JSON.stringify(Object.assign({}, r0.meta||{}, { qc:true, pub:vaKeyOf(USER.id), last:vaKeyOf(USER.id) })) }, 'Published! +1 Shopify Product Upload');
    if(ok) qcClose(); else $('qc-pub').disabled=false;
  }
  return { id:'design-shopify', S:S, load:load, render:render, paint:paint, paintCached:paintCached, owners:owners,
           setFilter:setFilter, setQ:setQ, add:add, move:move, pause:pause, resume:resume, del:del,
           qcOpen:qcOpen, qcTick:qcTick, qcClose:qcClose, qcPublish:qcPublish };
})();
document.addEventListener('click', function(e){ document.querySelectorAll('details.kmenu[open]').forEach(function(d){ if(!d.contains(e.target)) d.removeAttribute('open'); }); });

/* ═══════════ CLIENT: IMPERIUM (IMA) — Instagram on physical phones (Imperium SOP-02, Sept 2026) ═══════════
   The tool keeps the RECORD of the work done under Imperium's SOP-02 — the operation itself stays the team's.
   • PHONES — one phone = one model, up to three accounts. The SOP's completion checklist (§X) is ticked step by step,
     with the proxy / coordinates noted for the record. All ten done → the phone is Ready (+1 IG Phone Setup).
   • PRE-FLIGHT — before a phone is worked in a session the VA logs the three screenshots (Maps · IP · Scamalytics), the
     fraud score and the manager's go-ahead (+1 IG Pre-flight Check). The phone's accounts open for that session only once
     a clean pre-flight is logged; a fraud score above 3 or a mismatch is logged as STOP and keeps them closed.
   • ACCOUNTS — each runs the SOP calendar from its creation day: D1 create + scroll, D2 profile photo + scroll, D3–7
     scroll, D8–12 one feed photo a day, then reels 1/day × 3 days, 2/day × 3 days, 3/day ongoing. The tool offers only
     what is due, so nothing is posted ahead of the warm-up and reels stop at the day's target.
   • TRIAL REELS — "Unlocked" flags the account for the managers; trial reels can be logged only after the owner sets
     how many that account runs a day.
   • PRODUCTIVITY — every logged step counts (Jeth, Oct 9: "Everything"), through the proof gate → po_bump, plus a
     per-shift completion % of the day's plan (po_snap).  QA — the owner's QA tab: one line per VA per day (pre-flights,
     phones worked, plan done, misses) with a suggested score /10 that can be adjusted and saved to the portal's daily QA. */
/* Oct 14 (Jeth — new project Slaybae, "same as Imperium SOP"): the Imperium tool is now a factory. Each Instagram-on-
   physical-phones client gets its own copy with its own data (pa_* project), its own storage keys and DOM ids, and the
   same SOP-02 flow: phones & setup, pre-flight, 7-day warm-up, feed photos, reels ramp, trial reels, QA and the work timer.
   IMA = Imperium, SLB = Slaybae. One running timer across them: starting one stops the other's count-up timer; a running
   15-minute scroll in the other client has to finish (or be stopped) first. */
function IGPhones(CFG){
  var CID=CFG.cid, PROJECT=CFG.project, NS=CFG.ns, PX=CFG.px, KP=CFG.kp, SELF=null;
  var CL=function(){ return clientById(CID); };
  var T={ phone:'IG Phone Setup', pre:'IG Pre-flight Check', create:'IG Account Created', scroll:'IG Warm-up Scroll',
          pfp:'IG Profile Photo', feed:'IG Feed Photo', reels:'IG Reel', trial:'IG Trial Reel' };
  var SETUP=[
    'Pulled an available proxy from Airtable and assigned it to this phone',
    'Entered that proxy into Shadowrocket and switched it on',
    'Found the coordinates listed next to that same proxy in Airtable',
    'Entered the coordinates in AnyTo and confirmed the device was spoofed',
    'Checked Maps on the phone — location matches the AnyTo location',
    'Checked whatismyipaddress.com — IP is in the same state as the location',
    'Checked Scamalytics — fraud score is between 0 and 3',
    'Installed Instagram and created 3 accounts on this phone (one model only)',
    'Started the 7-day warm-up and logged the start date for each account',
    'Read and understood the pre-flight check — to be run before every session'
  ];
  var VERIFY_STEPS=7;           // steps 1–7 = the device is verified → accounts may be created on it
  var MAX_ACCTS=3, FRAUD_MAX=3;
  var S={ rows:[], loaded:false, err:'', view:'today', who:'all', qaDate:'', busy:{} };
  try{ S.view=sessionStorage.getItem(KP+'_view')||'today'; }catch(e){}

  /* ── data ── */
  function cacheRows(){ try{ sessionStorage.setItem(KP+'_rows', JSON.stringify({ t:Date.now(), rows:S.rows })); }catch(e){} }
  function paintCached(){ try{ var c=JSON.parse(sessionStorage.getItem(KP+'_rows')||'null'); if(c && c.rows && (Date.now()-c.t)<10*60*1000){ S.rows=c.rows; S.loaded=true; return true; } }catch(e){} return false; }
  async function load(){
    try{
      var d=await jFetch(API+'?action=pa_list&project='+encodeURIComponent(PROJECT)+'&_='+Date.now());
      if(!d||!d.ok) throw new Error((d&&d.error)||'load');
      S.rows=(d.rows||[]).map(function(r){ r.meta=r.meta||{}; return r; }); S.loaded=true; S.err=''; cacheRows();
    }catch(e){ S.err='Could not load — check your connection, then refresh.'; }
    HUB.onData(CID);
  }
  function phones(){ return S.rows.filter(function(r){ return r.meta.kind==='phone'; }).sort(function(a,b){ return String(a.handle).localeCompare(String(b.handle), undefined, { numeric:true }); }); }
  function accts(){ return S.rows.filter(function(r){ return r.meta.kind==='acct'; }); }

    var lg=(r.meta&&r.meta.log)||{}; Object.keys(lg).forEach(function(d){ if(lg[d]&&lg[d].by) m[String(lg[d].by).toLowerCase()]=1; }); }); return Object.keys(m); }

  /* ── the SOP calendar ── */
  function dnum(d){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||'')); return m?Date.UTC(+m[1],+m[2]-1,+m[3])/864e5:NaN; }
  function dayN(a, date){ var s=dnum(a.meta.start), t=dnum(date||today()); return (isNaN(s)||isNaN(t))?0:(t-s+1); }
  function reelTarget(n){ var r=n-12; return r<1?0:(r<=3?1:(r<=6?2:3)); }
  function everDone(a, k){ var lg=a.meta.log||{}; return Object.keys(lg).some(function(d){ return (lg[d]||{})[k]; }); }
  var DEAD={ banned:1, restricted:1, hold:1 };
  function phase(a, date){
    var n=dayN(a, date);
    if(DEAD[a.status]) return { k:a.status, t:{ banned:'Banned', restricted:'Restricted', hold:'On hold' }[a.status], n:n };

  /* what is due on this account on this business day → [{ k, label, target, done }] */
  function plan(a, date){
    date=date||today(); var n=dayN(a, date), lg=(a.meta.log||{})[date]||{}, out=[];
    if(DEAD[a.status] || n<1) return out;
    function it(k, label, target){ out.push({ k:k, label:label, target:target, done:Math.min(target, +lg[k]||0) }); }
    if(n===2 || (n>2 && n<=12 && !everDone(a,'pfp'))) it('pfp', n===2?'Add the profile picture':'Profile picture (missed on day 2)', 1);
    if(n<=7) it('scroll', n<=2?'Scroll 15 min':'Scroll 15 min — like, comment, open profiles', 1);
    else if(n<=12) it('feed', 'Post 1 feed photo (from the model\'s Drive)', 1);

  function planTotals(list){ var t=0, d=0; list.forEach(function(x){ t+=x.target; d+=x.done; }); return { t:t, d:d }; }

  /* ══════════ ⏱ WORK TIMER (Jeth, Oct 14 — JMB002: "her tool doesn't have any timer at all") ══════════
     Imperium is phone work — scrolling, posting, setting a phone up. Until now only a logged step (with its
     screenshot) told the portal she was working, so a 15-minute scroll or half an hour of reels looked like nothing
     was happening and the portal timer kept stopping. Now the phone work itself is timed here:
     • Scroll 15 min → "▶ Start 15:00" on the account: a 15-minute countdown; the scroll is logged once it ends.
     • Every other step → "⏱ Timer" on the phone → pick the step (pre-flight, setup, creating accounts, profile /
       feed photos, reels, trial reels): it counts up and asks "Still working?" every 20–30 minutes (logging any step
       answers it). No answer in 2 minutes → it stops.
     While a timer runs this tab tells the portal you're working (last_active, today's tool time, run_since + label),
     so the portal timer keeps going and the time counts as tool time. One timer at a time; switching steps on a
     phone carries on without a gap. It survives a reload. Owners never run it. */
  var TM={ run:null, tick:null, ask:null, restored:false, pick:'' };
  var TLIM={ pre:20, phone:30, create:30, pfp:20, feed:20, reels:30, trial:30, work:20 };
  var TNAME={ pre:'Pre-flight check', phone:'Phone setup', create:'Creating accounts', scroll:'Warm-up scroll', pfp:'Profile photos', feed:'Feed photos', reels:'Reels', trial:'Trial reels', work:'Phone work' };
  var SCROLL_MS=15*60*1000, ASK_MS=2*60*1000;
  function tmKey(){ return KP+'_run_'+me(); }
  function tmSave(){ try{ if(TM.run) localStorage.setItem(tmKey(), JSON.stringify(TM.run)); else localStorage.removeItem(tmKey()); }catch(e){} }
  function tmRestore(){
    if(TM.restored || !USER || !USER.id || isOwner()) return; TM.restored=true;
    try{ var x=JSON.parse(localStorage.getItem(tmKey())||'null');
      if(x && x.k && x.pid && x.start){
        if(x.ends){ if(Date.now()-x.ends<6*3600e3) TM.run=x; }
        else if(Date.now()-(x.chk||x.start) < (TLIM[x.k]||20)*60000+ASK_MS) TM.run=x;   // a stale count-up (tab closed) is dropped
      } }catch(e){}
    if(TM.run) tmTickOn(); else tmSave();
  }
  /* Oct 19 fix (Julian, Slaybae): a finished scroll whose step was already counted today (logged from another tab, by the
     other VA on the phone, or a save that went through twice) could not be logged ("already done") and could not be
     cleared either — every timer refused with "log the finished scroll first", and since a finished scroll is not a
     running timer the portal kept warning and stopping. Now a finished scroll that is already counted turns into Phone
     work by itself, the banner has a way out, and the 10 minutes after the 15:00 still count while it is being logged. */
  function scrollCounted(R){ try{ var a=rowById(R.aid); if(!a || DEAD[a.status]) return true; var it=plan(a).filter(function(x){ return x.k==='scroll'; })[0]; return !it || it.done>=it.target; }catch(e){ return false; } }
  function scrollDrop(silent){
    tmRestore(); var R=TM.run; if(!R || !R.ends) return; var pid=R.pid, who=tmWho(R);
    TM.run=null; tmAskClose(); tmSave(); tmAuto(pid, 'work');

    tmPaint(true);
  }
  function timerOn(){ tmRestore(); var R=TM.run; if(!R || TM.ask) return false; return R.ends ? (R.ends>Date.now() || Date.now()-R.ends<10*60e3) : true; }
  function timerInfo(){ if(!timerOn()) return null; var R=TM.run, p=rowById(R.pid); return { start:R.start, label:tmLabel(R)+(R.aid && p?' · '+phoneLabel(p):'')+' · '+CL().name }; }
  function tmLabel(R){ var p=rowById(R.pid), a=R.aid?rowById(R.aid):null; return TNAME[R.k]+' · '+(a?String(a.handle):(p?phoneLabel(p):'phone')); }
  function tmWho(R){ return tmLabel(R).split(' · ').slice(1).join(' · '); }
  function upClock(ms){ var s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x; }
  function downClock(ms){ var s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }
  function upLine(R){ return upClock(Date.now()-R.start)+' · asks “still working?” every '+(TLIM[R.k]||20)+' min — logging a step answers it'; }
  function tmTickOn(){
    if(TM.tick) return;
    TM.tick=setInterval(function(){
      var R=TM.run; if(!R){ clearInterval(TM.tick); TM.tick=null; return; }
      var now=Date.now();
      if(R.ends){
        if(R.ends>now){ if(!document.hidden) try{ ACT.last=now; }catch(_a){} }
        else if(!(S.busy && S.busy[lockKey(R.aid)]) && scrollCounted(R)){ var _w=tmWho(R); scrollDrop(true); try{ toast('The scroll on '+_w+' is already counted for today — your timer carries on as Phone work.'); }catch(e){} return; }
        else if(!R.rang){ R.rang=1; tmSave(); try{ toast('15 minutes done on '+tmWho(R)+' — log the scroll.'); }catch(e){} try{ if(window.PFX && PFX.chime) PFX.chime(0.08); }catch(e){} tmPaint(true); return; }
        else if(now-R.ends>=10*60e3){ var _w2=tmWho(R); scrollDrop(true); try{ toast('The finished scroll on '+_w2+' was not logged in 10 minutes — the timer moved to Phone work. You can still log the scroll.'); }catch(e){} return; }
      } else if(!TM.ask){

      } else if(now-TM.ask.at >= ASK_MS){
        var lbl=tmLabel(R); tmAskClose(); TM.run=null; tmSave(); try{ toast('Timer stopped — no answer to “still working?” ('+lbl+').'); }catch(e){} try{ tbSend(true); }catch(e){} tmPaint(true); return;
      }
      tmPaint(false);
    }, 1000);
  }
  function runBanner(){
    var R=TM.run; if(isOwner()) return '';

        '<div class="tx"><small>'+(done?'Scroll finished':'Scrolling now')+'</small><b>'+esc(tmLabel(R))+'</b><span id="'+PX+'-run-clk">'+(done?'15:00 done — press Log the scroll':downClock(left)+' left · keep scrolling on this account')+'</span></div>'+
        (done?'<button class="btn sm" onclick="'+NS+'.log(\''+jsq(R.aid)+'\',\'scroll\')">＋ Log the scroll</button><button class="btn sec sm" style="margin-left:6px" title="Use this if the scroll is already logged" onclick="'+NS+'.scrollDrop()">Already logged</button>':'<button class="btn sec sm" onclick="'+NS+'.tmStop()">Stop</button>')+'</div>';
    }
    return '<div class="im-run up"><span class="dot"></span><div class="tx"><small>Timer running</small><b>'+esc(tmLabel(R))+'</b><span id="'+PX+'-run-clk">'+upLine(R)+'</span></div><button class="btn sec sm" onclick="'+NS+'.tmStop()">Stop</button></div>';
  }
  function tmPaint(full){
    var box=$(''+PX+'-runbox'); if(!box) return;
    if(full){ box.innerHTML=runBanner(); try{ paint(); }catch(e){} return; }
    var R=TM.run, c=$(''+PX+'-run-clk'); if(!R || !c) return;

  function tmAskOpen(){

    document.body.appendChild(o); try{ if(window.PFX && PFX.chime) PFX.chime(0.1); }catch(e){}
  }

  function tmStill(){ if(TM.run){ TM.run.chk=Date.now(); tmSave(); } tmAskClose(); try{ hubWork('timer'); }catch(e){} tmPaint(true); }
  function tmTouch(){ if(TM.run && !TM.run.ends && !TM.ask){ TM.run.chk=Date.now(); tmSave(); } }   // any logged step = still working
  /* one timer across the Instagram-phone clients (Imperium, Slaybae …) */
  function otherIG(){ try{ return (typeof IGP!=='undefined'?IGP:[]).filter(function(m){ return m.ns!==NS; }); }catch(e){ return []; } }
  function scrollElsewhere(){ var n=''; otherIG().forEach(function(m){ try{ m.timerOn(); var R=m._TM.run; if(!n && R && R.ends && R.ends>Date.now()) n=m.name; }catch(e){} }); return n; }

  function tmQuiet(){ tmRestore(); var R=TM.run; if(!R || R.ends) return; TM.run=null; tmAskClose(); tmSave(); tmPaint(true); }
  /* Oct 14, evening (Jeth — JMB003's bar in slivers again): Imperium work happens on the phone, so the computer sits idle
     and the portal's 3-minute no-activity rule cut her timer between reels — she logged every reel but never pressed
     ⏱ Timer, so the hub told the portal "no task pressed yet". Now the timer starts BY ITSELF on the work she does here:
     a step she logs (reel, feed photo, profile photo, trial reel), a pre-flight she opens, a setup step she ticks, an account
     she adds; after a logged 15-minute scroll it carries on as "Phone work". It keeps asking "still working?" every 20–30
     minutes as before. A 15-minute scroll that is running (or finished and waiting to be logged) is left alone. */
  function tmAuto(pid, k){
    try{
      if(isOwner() || !USER || !pid || !TNAME[k] || k==='scroll') return;
      tmRestore();
      var R=TM.run;
      if(R && R.ends) return;
      if(R && R.pid===pid && R.k===k){ tmTouch(); return; }
      if(scrollElsewhere()) return; stopElsewhere();
      var now=Date.now(); tmAskClose();
      TM.run={ k:k, pid:pid, start:(R && R.pid===pid)?R.start:now, chk:now, auto:1 }; TM.pick=''; tmSave(); tmTickOn();
      try{ hubWork('timer'); }catch(e){}
      if(!R) try{ toast('⏱ '+tmLabel(TM.run)+' — the timer started by itself. It keeps your portal timer running while you work on the phone.'); }catch(e){}
      tmPaint(true);
    }catch(e){}
  }
  async function scrollStart(aid){
    if(isOwner()) return;

    if(p && !phoneOpen(p)){ toast('Log this session\'s pre-flight on '+phoneLabel(p)+' first.'); preflightOpen(p.id); return; }
    var it=plan(a).filter(function(x){ return x.k==='scroll'; })[0];
    if(!it || it.done>=it.target){ toast('No scroll due on '+a.handle+' today.'); return; }
    tmRestore();
    if(TM.run && TM.run.ends){ toast(TM.run.aid===aid?'Already scrolling '+a.handle+'.':(TM.run.ends>Date.now()?'Finish the scroll on '+tmWho(TM.run)+' first — one at a time.':'Log the finished scroll on '+tmWho(TM.run)+' first.')); return; }
    var _el=scrollElsewhere(); if(_el){ toast('A 15-minute scroll is running in '+_el+' — finish or stop it first.'); return; }
    if(!(await linkGate(CL(), 'Starting the timer'))) return;
    stopElsewhere();
    var now=Date.now(); tmAskClose(); TM.run={ k:'scroll', pid:a.meta.phone, aid:aid, start:now, ends:now+SCROLL_MS }; TM.pick=''; tmSave(); tmTickOn();
    try{ hubWork('timer'); }catch(e){}

  }
  async function tmStart(pid, k){

  /* ── pre-flight (per phone, per shift) ── */

  /* phones */
  async function addPhone(){
    var lab=($(''+PX+'-pl').value||'').trim(), mdl=($(''+PX+'-pm').value||'').trim(), px=($(''+PX+'-px').value||'').trim(), co=($(''+PX+'-pc').value||'').trim();

    return Object.keys(who).sort().map(function(k){
      var w=who[k], issues=[], score=10;
      var pfDone=w.pf.length, pfClean=w.pf.filter(function(o){ return pfOk(o.x); }).length;
      var stop=w.pf.filter(function(o){ return !(+o.x.fraud<=FRAUD_MAX) || !(o.x.okMaps&&o.x.okIp&&o.x.okScam); }).length;
      var rej=w.pf.filter(function(o){ return o.x.review==='bad'; }).length;
      var noMgr=w.pf.filter(function(o){ return !o.x.mgr; }).length;
      var noPf=0, due=0, done=0;
      Object.keys(w.worked).forEach(function(pid){ var p=rowById(pid), first=w.worked[pid].first||'';
        var had=p && pfList(p, date).some(function(x){ return pfOk(x) && (!first || x.at<=first); });
        if(!had){ noPf++; issues.push('Worked '+(p?phoneLabel(p):'a phone')+' without a clean pre-flight first'); }
        acctsOf(pid).forEach(function(a){ var pt=planTotals(plan(a, date)); due+=pt.t; done+=pt.d; }); });
      if(rej) issues.push(rej+' pre-flight'+(rej>1?'s':'')+' marked not acceptable');
      if(noMgr) issues.push(noMgr+' pre-flight'+(noMgr>1?'s':'')+' without the manager\'s go-ahead');
      if(stop) issues.push(stop+' STOP (fraud above 3 or a mismatch) — correctly not opened');
      var miss=Math.max(0, due-done); if(miss) issues.push(miss+' planned step'+(miss>1?'s':'')+' not done (warm-up / feed / reels)');
      score-=3*noPf; score-=2*rej; score-=0.5*noMgr; score-=Math.min(3, 0.5*miss);
      score=Math.max(0, Math.min(10, Math.round(score*2)/2));
      return { emp:k, pfDone:pfDone, pfClean:pfClean, phones:Object.keys(w.worked).length, due:due, done:done, tasks:w.tasks, issues:issues, score:score, list:w.pf };
    });
  }

/* ═══════════ CLIENT: SKYVERN (Project 3 · individual) — daily Reddit account farming + karma (Jeth, Oct 10) ═══════════
   SOP: every active account is farmed EVERY day — 3 comments, a 5-minute scroll, and today's karma written down.
   • Comments: +1 per comment (max 3 a day), screenshot each → +1 "Reddit Comment".
   • Scroll: a real 5:00 timer in the tab (one at a time); when it ends, a screenshot of the feed → +1 "Reddit Scroll (5 min)".
     Stopping early counts nothing.
   • Karma: the number the profile shows right now + a screenshot of it → +1 "Karma Update". The history builds the
     trend (today's gain, 7-day, 30-day) the owner reads in the Karma view.
   An account is FARMED for the day when all three are done. The VA's farmed / active count is the board snapshot the
   portal's EOD check and the scorecard read. The tool only tracks the work — it never touches Reddit itself.
   Data: one pa_* row per account (project "Skyvern"), meta { kind:'acct', start, karma, mday, kh:{date:karma},
   log:{date:{ c, scroll, karma, by, t, who:{EMP:n} }}, hist:[…] }, status active / restricted / suspended / hold. */
var SKY=(function(){
  var CL=function(){ return clientById('skyvern'); };
  var PROJECT='Skyvern';
  var T={ comment:'Reddit Comment', scroll:'Reddit Scroll (5 min)', karma:'Karma Update' };
  var NEED={ c:3, scrollMin:5 };
  var SCROLL_MS=NEED.scrollMin*60*1000;
  var STATUS={ active:'Active', restricted:'Restricted', suspended:'Suspended', hold:'On hold' };
  var AVC=['#0ea5e9','#6366f1','#10b981','#f59e0b','#ec4899','#8b5cf6','#14b8a6','#f97316'];
  var S={ rows:[], loaded:false, err:'', view:'today', filter:'mine', q:'', busy:{}, kEdit:'', run:null, tick:null };
  try{ S.filter=sessionStorage.getItem('dc_va_'+PROJECT)||'mine'; S.view=sessionStorage.getItem('sky_view')||'today'; }catch(e){}
  function me(){ return String((USER&&USER.id)||'').toUpperCase(); }
  function ownerOf(r){ return String(r.assigned_to||r.created_by||'').toLowerCase(); }
  function rowById(id){ return S.rows.filter(function(x){ return x.id===id; })[0]; }
  function accts(){ return S.rows.filter(function(r){ return !r.meta || r.meta.kind!=='cfg'; }); }
  function handle(r){ return 'u/'+String(r.handle||'').replace(/^u\//i,''); }
  function sdate(ds){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(ds||''))) return String(ds||''); var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return M[+ds.slice(5,7)-1]+' '+(+ds.slice(8,10)); }
  function fmt(n){ n=+n||0; return Math.abs(n)>=10000?(Math.round(n/100)/10)+'k':String(n); }

  function cacheRows(){ try{ sessionStorage.setItem('dc_rows_'+PROJECT, JSON.stringify({ t:Date.now(), rows:S.rows })); }catch(e){} }
  function paintCached(){ try{ var c=JSON.parse(sessionStorage.getItem('dc_rows_'+PROJECT)||'null'); if(c && c.rows && (Date.now()-c.t)<10*60*1000){ S.rows=c.rows; S.loaded=true; return true; } }catch(e){} return false; }
  async function load(){

  }
  function owners(){ var m={}; accts().forEach(function(r){ var k=ownerOf(r); if(k) m[k]=1; }); return Object.keys(m); }

  function dayLog(r, d){ return ((r.meta&&r.meta.log)||{})[d||today()]||{}; }
  function stepState(r, d){ var L=dayLog(r, d); return { c:Math.min(NEED.c, +L.c||0), scroll:!!L.scroll, karma:(L.karma!=null && L.karma!=='') }; }
  function farmed(r, d){ var s=stepState(r, d); return s.c>=NEED.c && s.scroll && s.karma; }

  function dshift(ds, n){ var t=Date.UTC(+ds.slice(0,4), +ds.slice(5,7)-1, +ds.slice(8,10))+n*864e5; return new Date(t).toISOString().slice(0,10); }
  function kh(r){ return (r.meta&&r.meta.kh)||{}; }

  function karmaNow(r){ var v=r.meta&&r.meta.karma; return (v===undefined||v===null||v==='')?null:+v; }
  /* growth over the window; an account tracked for less time than the window counts from its first update */
  function gain(r, days){ var now=karmaNow(r); if(now===null) return null; var then=karmaOn(r, dshift(today(), -days));
    if(then===null){ var ks=Object.keys(kh(r)).sort(); if(ks.length<2) return null; then=+kh(r)[ks[0]]; } return now-then; }

    var vals=pts.filter(function(v){ return v!==null; }); if(vals.length<2) return '<span class="sk-nospark">trend after 2 updates</span>';

    await guarded(R.id, function(){ return patchMeta(R.id, function(m){ var L=(m.log||{})[today()]||{}; if(L.scroll) return false; logStep(m, 'scroll', 1); }, null, '5-minute scroll counted · '+handle(r)); });
