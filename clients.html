  var CLOSE={ noreply:'No reply', notint:'Not interested', nofit:'Not a fit', minor:'Under 18 — stopped' };
  var VIEWS=[['msg','To message','found'],['wait','Waiting for a reply','messaged'],['rep','Replied','replied'],['sent','Sent to Meadow','reported'],['closed','Closed','closed'],['all','All','']];
  var FMIN=2000, FMAX=70000;
  var S={ rows:[], loaded:false, err:'', view:'msg', q:'', filter:'all', day:'', busy:{}, rep:null };
  try{ S.view=sessionStorage.getItem('mdw_view')||'msg'; S.filter=sessionStorage.getItem('dc_va_'+PROJECT)||'all'; }catch(e){}

  function isDay(r){ return (r.meta&&r.meta.kind==='day') || /^day-/i.test(String(r.handle||'')); }

  function dayRow(emp){ var h='day-'+String(emp||'').toLowerCase(); return S.rows.filter(function(r){ return isDay(r) && String(r.handle||'').toLowerCase()===h; })[0]||null; }

  /* ═══ SCORES (Nov 11 — Jeth: "all of them use tools, why is it missing?"). Meadow had no score at all, so Hamto's
     Productivity · QA · Results were blank. Worked out from the leads and the day records, on the days the VA worked:
       Productivity = leads messaged ÷ MDW_DAILY (60 a day), capped at 100 per day, averaged.
       QA = 10 a day, −2 no inbox check logged, −1 under half of the day's new leads messaged, −1 replies waiting 2+ days
            at the end of the day; daily floor −4; logged violations on top (Client Hub violations).
       Results = reply rate on this month's messages against MDW_REPLY_GOOD (10%), plus +5 per number sent (cap 100). ═══ */
  var MDW_DAILY=60, MDW_REPLY_GOOD=0.10;
  function monthScores(month){
    var from=month+'-01', end=hubMonthEnd(month);
    return owners().filter(function(e){ return OWNER_IDS.indexOf(e.toUpperCase())<0; }).map(function(emp){
      var days=0, pr=[], qa=[], msgT=0, repT=0, numT=0;
      for(var d=from; d<=end; d=hubDayAdd(d,1)){
        var o=dayStats(emp, d); if(!(o.found||o.msg||o.reply||o.rep||o.inbox.length)) continue;
        days++; msgT+=o.msg; repT+=o.reply; numT+=o.rep;
        pr.push(Math.min(1, o.msg/MDW_DAILY));
        var ded=0; if(!o.inbox.length) ded+=2; if(o.found>=4 && o.msg<o.found/2) ded+=1;
        var stale=leads().filter(function(r){ return ownerOf(r)===emp && r.status==='replied' && ev(r,'reply') && ev(r,'reply')<=hubDayAdd(d,-2) && !(ev(r,'rep') && ev(r,'rep')<=d) && !(ev(r,'close') && ev(r,'close')<=d); }).length;
        if(stale) ded+=1;
        ded=Math.min(4, ded); try{ if(typeof VQA!=='undefined') ded+=VQA.ded(PROJECT, emp, d); }catch(_v){}
        qa.push(Math.max(0, 10-ded));
      }
      if(!days) return null;
      var p=hubAvg(pr), q=hubAvg(qa), rr=msgT?repT/msgT:null;
      var res=(msgT>=30)?hubR1(Math.min(100, rr/MDW_REPLY_GOOD*100 + numT*5)):null;
      return { emp:emp.toUpperCase(), days:days, prod:p===null?null:hubR1(p*100), qa:q===null?null:hubR1(q*10), res:res,
        why:{ prod:msgT+' messaged in '+days+' day'+(days===1?'':'s')+' (target '+MDW_DAILY+'/day)', qa:days+' day'+(days===1?'':'s')+' · inbox, follow-up, replies', res:repT+' replies ('+(rr===null?'—':Math.round(rr*1000)/10+'%')+') · '+numT+' number'+(numT===1?'':'s')+' sent' } };
    }).filter(Boolean);
  }
  return { id:CID, S:S, load:load, render:render, paint:paint, paintCached:paintCached, owners:owners, monthScores:monthScores,
           inbox:inbox, add:add, msg:msg, replied:replied, close:close, reopen:reopen, repOpen:repOpen, repSet:repSet, repBtn:repBtn, repSend:repSend,

/* ═══════════ CLIENT: NEWFANS — WALLPOST & PPV (Jeth, Nov 9 — rebuilt from the HUNTER Wall Posting SOP) ═══════════
   One client, one board (VA: Hamto). The SOP, step by step:
     1) check Content Snare for new uploads from the model or client — "Checked Content Snare" logs each check;
     2) new content → prepare it right away: "+ Content received" adds it to the model's content on hand;
     3) schedule 1 photo or 1 photo set per post, PM EST, with a UNIQUE flirty caption (the tool refuses a caption the
        model has already used) — "Schedule a post" takes one item off the content on hand and counts +1 Wallpost Scheduled;
        limited content → post every other day (per model setting);
     4) after scheduling everything on hand → tell the client the last scheduled date; before the posts run out → tell the
        client new content is needed. Both copy a ready message (no VA names in it) and count +1 Client Update.
   Runway = days of scheduled posts still ahead (EST calendar). Out of content (nothing ahead, nothing on hand) and runway
   low (2 days or less) are flagged until the client has been asked. Timer: the hub work timer (starts on the first task).
   Data: pa_* rows, project "NewFans Wallpost" (the old "NewFans" board holds the Facebook groups list — kept apart).
     model → handle = model name, status active | paused,
             meta { kind:'model', cad:'daily'|'alt', tm:'8:00 PM', inv:Number,
                    posts:[{ d (EST date), tm, ty:'photo'|'set'|'ppv', pr, cap, k (caption key), at, bd, by }],
                    recv:[{ at, bd, by, n, note }], upd:[{ at, bd, by, k:'last'|'need', d, left }] }
     day   → one row per VA, handle "day-<emp>", status "day", meta { kind:'day', days:{ date:{ cs:[iso…] } } } */
var WP=(function(){
  var CID='newfans', PROJECT='NewFans Wallpost';
  var CL=function(){ return clientById(CID); };
  var TY={ photo:'Photo', set:'Photo set', ppv:'PPV' };
  var GRP=[['ready','Content waiting — schedule it now'],['out','Out of content — tell the client'],['low','Runway low — ask for content'],['ok','Stocked'],['paused','Paused']];
  var S={ rows:[], loaded:false, err:'', day:'', filter:'all', busy:{}, pan:null };
  try{ S.filter=sessionStorage.getItem('dc_va_'+PROJECT)||'all'; }catch(e){}

  /* ── basics ── */
  function me(){ return String((USER&&USER.id)||'').toUpperCase(); }
  function meL(){ return me().toLowerCase(); }
  function ownerOf(r){ return String(r.assigned_to||r.created_by||'').toLowerCase(); }
  function rowById(id){ return S.rows.filter(function(x){ return x.id===id; })[0]; }
  function isDay(r){ return (r.meta&&r.meta.kind==='day') || /^day-/i.test(String(r.handle||'')); }
  function models(){ return S.rows.filter(function(r){ return !isDay(r); }); }
  function dayRow(emp){ var h='day-'+String(emp||'').toLowerCase(); return S.rows.filter(function(r){ return isDay(r) && String(r.handle||'').toLowerCase()===h; })[0]||null; }
  function Mt(r){ return r.meta||{}; }
  function day(){ return S.day||today(); }
  function estToday(){ try{ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date()); }catch(e){ return new Date(Date.now()-5*3600e3).toISOString().slice(0,10); } }
  function dDiff(a, b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5); }
  var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function sdate(ds){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(ds||''))) return String(ds||''); return MO[+ds.slice(5,7)-1]+' '+(+ds.slice(8,10)); }
  function wdate(ds){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(ds||''))) return String(ds||''); return WD[new Date(ds+'T12:00:00Z').getUTCDay()]+', '+sdate(ds); }
  function tm(iso){ var t=Date.parse(iso||''); if(!t) return ''; try{ return new Date(t).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }catch(e){ return ''; } }
  function capKey(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().slice(0,140); }
  function posts(r){ return (Mt(r).posts||[]); }
  function inv(r){ return Math.max(0, parseInt(Mt(r).inv,10)||0); }
  function lastD(r){ var a=posts(r).map(function(p){ return p.d; }).sort(); return a.length?a[a.length-1]:''; }
  function aheadN(r){ var t=estToday(); return posts(r).filter(function(p){ return p.d>=t; }).length; }
  function runway(r){ var L=lastD(r), t=estToday(); return (L && L>=t)?dDiff(t, L)+1:0; }   // days of posts still ahead, today (EST) included
  function step(r){ return Mt(r).cad==='alt'?2:1; }
  function nextD(r){ var L=lastD(r), t=estToday(); return (L && L>=t)?hubDayAdd(L, step(r)):t; }
  function asked(r){   // asked for content since the last content came in (and within a week)
    var a=(Mt(r).upd||[]).filter(function(x){ return x.k==='need'; }).slice(-1)[0]; if(!a) return null;
    var lastIn=(Mt(r).recv||[]).slice(-1)[0]; if(lastIn && String(lastIn.at)>String(a.at)) return null;
    if(Date.now()-Date.parse(a.at)>7*864e5) return null; return a;
  }
  function told(r){ var L=lastD(r); if(!L) return null; return (Mt(r).upd||[]).filter(function(x){ return x.k==='last' && x.d===L; }).slice(-1)[0]||null; }
  function state(r){ if(r.status==='paused') return 'paused'; if(inv(r)>0) return 'ready'; var rw=runway(r); if(rw<=0) return 'out'; if(rw<=2) return 'low'; return 'ok'; }
  function needAsk(r){ var s=state(r); return (s==='out'||s==='low') && !asked(r); }
  function needTell(r){ return r.status!=='paused' && inv(r)===0 && runway(r)>0 && !told(r) && !asked(r); }
  function cacheRows(){ try{ sessionStorage.setItem('dc_rows_'+PROJECT, JSON.stringify({ t:Date.now(), rows:S.rows })); }catch(e){} }
  function paintCached(){ try{ var c=JSON.parse(sessionStorage.getItem('dc_rows_'+PROJECT)||'null'); if(c && c.rows && (Date.now()-c.t)<10*60*1000){ S.rows=c.rows; S.loaded=true; return true; } }catch(e){} return false; }
  async function load(){
    try{
      var d=await jFetch(API+'?action=pa_list&project='+encodeURIComponent(PROJECT)+'&_='+Date.now());
      if(!d||!d.ok) throw new Error((d&&d.error)||'load');
      S.rows=(d.rows||[]).map(function(r){ if(typeof r.meta==='string'){ try{ r.meta=JSON.parse(r.meta); }catch(e){ r.meta={}; } } r.meta=r.meta||{}; return r; });
      S.loaded=true; S.err=''; cacheRows();
    }catch(e){ S.err='Could not load the Wallpost board — check your connection, then refresh.'; }
    HUB.onData(CID);
  }
  function owners(){ var m={}; S.rows.forEach(function(r){ var k=ownerOf(r); if(k) m[k]=1; }); return Object.keys(m); }

  /* ── a VA's day (emp=null → everyone) ── */
  function dayStats(emp, d){
    emp=emp?String(emp).toLowerCase():null; d=d||today();
    var o={ cs:[], recv:0, sched:0, ppv:0, upd:0, wait:0, out:0, low:0, ask:0, tell:0, models:0 };
    models().forEach(function(r){
      var mine=!emp || ownerOf(r)===emp, m=Mt(r);
      (m.posts||[]).forEach(function(p){ if(p.bd===d && (!emp || String(p.by||'').toLowerCase()===emp)){ o.sched++; if(p.ty==='ppv') o.ppv++; } });
      (m.recv||[]).forEach(function(x){ if(x.bd===d && (!emp || String(x.by||'').toLowerCase()===emp)) o.recv+=(+x.n||0); });
      (m.upd||[]).forEach(function(x){ if(x.bd===d && (!emp || String(x.by||'').toLowerCase()===emp)) o.upd++; });
      if(!mine || r.status==='paused') return;
      o.models++; o.wait+=inv(r); var s=state(r); if(s==='out') o.out++; if(s==='low') o.low++; if(needAsk(r)) o.ask++; if(needTell(r)) o.tell++;
    });
    S.rows.filter(isDay).forEach(function(r){ if(emp && String(r.handle||'').toLowerCase()!=='day-'+emp) return; o.cs=o.cs.concat((((r.meta||{}).days||{})[d]||{}).cs||[]); });
    o.cs.sort();
    return o;
  }

  /* ── writes ── */
  async function upd(id, q, okMsg){
    try{ var d=await paUpdate(id, q);
      if(d&&d.ok){ if(okMsg) toast(okMsg); return true; }
      toast('Could not save — '+((d&&d.error)||'try again')+'.'); return false;
    }catch(e){ toast('Connection error.'); return false; }
  }
  async function patchMeta(id, fn, extra, okMsg){
    await load(); var r=rowById(id); if(!r){ toast('That model is gone — refresh.'); return false; }
    var m=JSON.parse(JSON.stringify(r.meta||{})); if(fn(m, r)===false) return false;
    var q=Object.assign({ meta:JSON.stringify(m) }, extra||{});
    var ok=await upd(id, q, okMsg); if(ok){ r.meta=m; Object.keys(extra||{}).forEach(function(k){ r[k]=extra[k]; }); cacheRows(); paint(); setTimeout(load, 1500); }
    return ok;
  }
  async function guarded(k, fn){ if(S.busy[k]) return; S.busy[k]=1; try{ return await fn(); } finally{ delete S.busy[k]; } }
  function trim(obj, keep){ Object.keys(obj||{}).sort().slice(0,-keep).forEach(function(k){ delete obj[k]; }); }
  async function ensureDay(){
    var s=dayRow(meL()); if(s) return s;
    try{
      var d=await jFetch(API+'?action=pa_add&project='+encodeURIComponent(PROJECT)+'&handle='+encodeURIComponent('day-'+meL())+'&model=Wallpost&status=day&meta='+encodeURIComponent(JSON.stringify({ kind:'day', days:{} }))+'&employee_id='+encodeURIComponent(USER.id)+'&_='+Date.now(), 0);
      if(!(d&&(d.ok||d.error==='DUPLICATE'))){ toast('Could not start your day record — try again.'); return null; }
    }catch(e){ toast('Connection error.'); return null; }
    await load(); return dayRow(meL());
  }
  async function copyText(t){
    try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
    try{ var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
  }

  /* 1 · Content Snare checked */
  async function csCheck(){
    if(isOwner()) return;
    var o=dayStats(meL(), today()), last=Date.parse(o.cs[o.cs.length-1]||'')||0;
    if(Date.now()-last<2*60000){ toast('Content Snare check already logged a moment ago.'); return; }
    if(!(await linkGate(CL(), 'Logging a Content Snare check'))) return;
    await guarded('day', async function(){
      var s=await ensureDay(); if(!s) return;
      await patchMeta(s.id, function(m){ m.kind='day'; var D=m.days=m.days||{}; var x=D[today()]=D[today()]||{}; x.cs=(x.cs||[]).concat([new Date().toISOString()]).slice(-40); trim(D, 45); }, null,
        'Content Snare checked ✓ — new uploads? Press "+ Content received" on the model.');
    });
  }
  /* new model */
  async function add(){
    var n=String(($('wp-name')||{}).value||'').trim().replace(/\s+/g,' ').slice(0,60), va=isOwner()?String(($('wp-va')||{}).value||'').trim().toUpperCase():'';
    if(!n){ toast('Type the model name.'); return; }
    if(/^day-/i.test(n)){ toast('That name is reserved.'); return; }
    if(models().some(function(r){ return String(r.handle||'').toLowerCase()===n.toLowerCase(); })){ toast(n+' is already on the board.'); return; }
    if(isOwner() && va && !/^[A-Z0-9_-]{2,24}$/.test(va)){ toast('Type the VA\'s Employee ID (e.g. JMB014), or leave it blank.'); return; }
    if(!(await linkGate(CL(), 'Adding a model'))) return;
    var meta={ kind:'model', cad:'daily', tm:'8:00 PM', inv:0, posts:[], recv:[], upd:[] };
    await guarded('add', async function(){
      try{
        var d=await jFetch(API+'?action=pa_add&project='+encodeURIComponent(PROJECT)+'&handle='+encodeURIComponent(n)+'&model=Wallpost&status=active&meta='+encodeURIComponent(JSON.stringify(meta))+'&employee_id='+encodeURIComponent(va||USER.id)+'&_='+Date.now(), 0);
        if(d&&d.ok){ ['wp-name','wp-va'].forEach(function(k){ if($(k)) $(k).value=''; }); toast(n+' added — log the content you have with "+ Content received".'); load(); }
        else toast(d&&d.error==='DUPLICATE'?n+' is already on the board.':'Could not add the model.');
      }catch(e){ toast('Connection error.'); }
    });
  }
  /* panels (one open at a time) */
  function open(id, k){ S.pan=(S.pan && S.pan.id===id && S.pan.k===k)?null:{ id:id, k:k }; paint();
    var f={ recv:'wp-n', sched:'wp-cap', upd:'wp-go' }[k]; if(S.pan && f) setTimeout(function(){ var e=$(f); if(e) try{ e.focus(); }catch(_e){} }, 30); }
  function close(){ S.pan=null; paint(); }
  /* 2 · content received */
  async function recvSave(id){
    var r=rowById(id); if(!r) return;
    var n=parseInt(String(($('wp-n')||{}).value||'').replace(/[^0-9]/g,''),10), note=String(($('wp-note')||{}).value||'').trim().slice(0,160);
    if(!(n>=1 && n<=300)){ toast('How many new photos or sets came in? (1–300)'); return; }
    if(!(await linkGate(CL(), 'Logging new content'))) return;
    await guarded(id, async function(){
      var ok=await patchMeta(id, function(m){ m.inv=Math.max(0, parseInt(m.inv,10)||0)+n; m.recv=(m.recv||[]).slice(-39); m.recv.push({ at:new Date().toISOString(), bd:today(), by:me(), n:n, note:note }); }, null,
        '+'+n+' for '+r.handle+' ✓ — prepare it now: caption + schedule (SOP).');
      if(ok){ S.pan={ id:id, k:'sched' }; paint(); }
    });
  }
  /* 3 · schedule a post */
  function capDup(r, cap){ var k=capKey(cap); if(k.length<8) return null; return posts(r).filter(function(p){ return p.k===k; })[0]||null; }
  function capCheck(){ var R=S.pan; if(!R) return; var r=rowById(R.id), cap=($('wp-cap')||{}).value||'', e=$('wp-dup'); if(!r||!e) return; var dp=capDup(r, cap); e.textContent=dp?'Already used on '+sdate(dp.d)+' — write a new caption.':''; }
  function tyChange(){ var t=($('wp-ty')||{}).value, e=$('wp-prw'); if(e) e.style.display=(t==='ppv')?'':'none'; }
  async function schedSave(id){
    var r=rowById(id); if(!r) return;
    var d=String(($('wp-d')||{}).value||''), t=String(($('wp-t')||{}).value||'').trim().slice(0,12)||'8:00 PM', ty=String(($('wp-ty')||{}).value||'photo'),
        pr=String(($('wp-pr')||{}).value||'').replace(/[^0-9.]/g,'').slice(0,7), cap=String(($('wp-cap')||{}).value||'').trim(), one=!!(($('wp-one')||{}).checked);
    if(inv(r)<1){ toast('No content on hand for '+r.handle+' — log it with "+ Content received" first.'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast('Pick the post date (EST).'); return; }
    if(d<estToday()){ toast('That date has passed in EST — pick today or later.'); return; }
    if(!TY[ty]) ty='photo';
    if(ty==='ppv' && !(parseFloat(pr)>0)){ toast('Type the PPV price.'); return; }
    if(cap.length<8){ toast('Write the caption (unique and flirty) — at least a few words.'); return; }
    var dp=capDup(r, cap); if(dp){ toast('That caption was already used on '+sdate(dp.d)+'. Every caption must be unique.'); return; }
    if(!one){ toast('Tick the check: one photo or one photo set in this post.'); return; }
    var same=posts(r).filter(function(p){ return p.d===d; }).length;
    if(same && !confirm(r.handle+' already has a post on '+wdate(d)+'.\n\nSchedule another one the same day?')) return;
    if(!(await linkGate(CL(), 'Scheduling a post'))) return;
    await guarded(id, async function(){
      var now=new Date().toISOString(), left=0;
      var ok=await patchMeta(id, function(m){
        if(Math.max(0, parseInt(m.inv,10)||0)<1){ toast('No content on hand any more — refresh.'); return false; }
        m.inv=Math.max(0, parseInt(m.inv,10)||0)-1; left=m.inv; m.tm=t;
        var P=(m.posts||[]).concat([{ d:d, tm:t, ty:ty, pr:ty==='ppv'?pr:'', cap:cap.slice(0,240), k:capKey(cap), at:now, bd:today(), by:me() }]);
        P.sort(function(a,b){ return String(a.d).localeCompare(String(b.d)) || String(a.at).localeCompare(String(b.at)); });
        m.posts=P.slice(-200);
      }, null, null);
      if(!ok) return;
      bump(PROJECT, 'Wallpost Scheduled', 1);
      if(left>0){ toast('+1 Wallpost Scheduled ✓ — '+wdate(d)+' '+t+' EST. '+left+' left on hand.'); S.pan={ id:id, k:'sched' }; }
      else { toast('+1 Wallpost Scheduled ✓ — all content for '+r.handle+' is scheduled. Tell the client the last date.'); S.pan={ id:id, k:'upd' }; }
      paint();
    });
  }
  async function undo(id){
    var r=rowById(id); if(!r) return;
    var P=posts(r).filter(function(p){ return String(p.by||'').toUpperCase()===me() && Date.now()-Date.parse(p.at)<12*3600e3; }).sort(function(a,b){ return String(a.at).localeCompare(String(b.at)); });
    var x=P[P.length-1]; if(!x){ toast('Nothing of yours to undo here (last 12 hours only).'); return; }
    if(!confirm('Undo the post for '+r.handle+' on '+wdate(x.d)+'?\n\n"'+String(x.cap).slice(0,80)+'"\n\nIt goes back to content on hand and the count comes off.')) return;
    await guarded(id, async function(){
      var ok=await patchMeta(id, function(m){ var i=(m.posts||[]).map(function(p){ return p.at+'|'+p.by; }).lastIndexOf(x.at+'|'+x.by); if(i<0) return false; m.posts.splice(i,1); m.inv=Math.max(0, parseInt(m.inv,10)||0)+1; }, null, 'Undone — back to content on hand.');
      if(ok) bump(PROJECT, 'Wallpost Scheduled', -1);
    });
  }
  /* 4 · client updates — the message never names the VA */
  function msgFor(r, k){
    var L=lastD(r), rw=runway(r);
    if(k==='last') return 'Hi! Everything we have for '+r.handle+' is now scheduled. The last post goes out on '+wdate(L)+' (PM EST). Please upload more content to Content Snare so the wall keeps posting after that. Thank you!';
    if(!L || rw<=0) return 'Hi! '+r.handle+' has no posts scheduled right now — we are out of content. Could you upload new photos or sets to Content Snare so we can keep the wall posting? Thank you!';
    return 'Hi! '+r.handle+'\'s scheduled posts run out on '+wdate(L)+' ('+rw+' day'+(rw===1?'':'s')+' left). Could you upload new content to Content Snare so there is no gap? Thank you!';
  }
  async function updSend(id){
    var R=S.pan, r=rowById(id); if(!R||!r) return; var k=R.kk||(needAsk(r)?'need':'last');
    var t=String(($('wp-msg')||{}).value||'').trim()||msgFor(r, k);
    if(!(await linkGate(CL(), 'Logging a client update'))) return;
    var copied=await copyText(t);
    if(!copied) toast('Could not copy — select the message and copy it by hand.');
    await guarded(id, async function(){
      var ok=await patchMeta(id, function(m){ m.upd=(m.upd||[]).slice(-39); m.upd.push({ at:new Date().toISOString(), bd:today(), by:me(), k:k, d:lastD(r), left:runway(r) }); }, null,
        (copied?'Copied ✓ — paste it to the client now. ':'')+'+1 Client Update.');
      if(ok){ bump(PROJECT, 'Client Update', 1); S.pan=null; paint(); }
    });
  }
  function updKind(id, k){ S.pan={ id:id, k:'upd', kk:k }; paint(); }
  async function setCad(id, cad){ var r=rowById(id); if(!r) return; await guarded(id, function(){ return patchMeta(id, function(m){ m.cad=(cad==='alt')?'alt':'daily'; }, null, r.handle+': '+(cad==='alt'?'every other day':'every day')+'.'); }); }
  async function setPause(id, on){ var r=rowById(id); if(!r) return;
    if(on && !confirm('Pause '+r.handle+'?\n\nOnly when the client paused this model. A paused model drops out of the content alerts.')) return;
    await guarded(id, function(){ return upd(id, { status:on?'paused':'active' }, r.handle+(on?' paused.':' is active again.')).then(function(ok){ if(ok){ r.status=on?'paused':'active'; cacheRows(); paint(); } return ok; }); }); }
  async function moveTo(id){
    var r=rowById(id); if(!r || !isOwner()) return;
    var to=String(prompt('Move '+r.handle+' to which VA? (Employee ID, e.g. JMB014)', '')||'').trim().toUpperCase();
    if(!/^[A-Z0-9_-]{2,24}$/.test(to)) return;
    await guarded(id, function(){ return upd(id, { assigned_to:to.toLowerCase() }, r.handle+' → '+vaName(to.toLowerCase())).then(function(ok){ if(ok){ r.assigned_to=to.toLowerCase(); cacheRows(); paint(); } return ok; }); });
  }
  async function del(id){
    var r=rowById(id);
    if(!confirm('DELETE '+((r&&r.handle)||'this model')+' from the Wallpost board?\n\nOnly for wrong entries — its scheduled posts and history go with it.')) return;
    try{
      var d=await jFetch(API+'?action=pa_delete&id='+encodeURIComponent(id)+'&employee_id='+encodeURIComponent(isOwner()?'admin':USER.id)+'&_='+Date.now(), 0);
      if(d&&d.ok){ toast('Deleted.'); load(); }
      else if(d&&d.error==='NOT_YOURS') toast('Only the VA on this model (or the admin) can delete it.');
      else toast('Could not delete: '+((d&&d.error)||'error'));
    }catch(e){ toast('Connection error.'); }
  }
  function setDay(d){ S.day=(d===today())?'':d; paint(); }
  function setFilter(f){ S.filter=f; try{ sessionStorage.setItem('dc_va_'+PROJECT, f); }catch(e){} paint(); }

  /* ══ VIEWS ══ */
  function kmenu(label, items){
    return '<details class="kmenu" onclick="event.stopPropagation()"><summary>'+label+'</summary><div class="dd">'+items.map(function(it){
      if(it==='---') return '<div class="sep"></div>';
      return '<button class="'+(it[2]||'')+'" onclick="this.closest(\'details\').removeAttribute(\'open\');'+it[1]+'">'+it[0]+'</button>';
    }).join('')+'</div></details>';
  }
  function sopHtml(){
    return '<details class="th-sop"><summary>Wall Posting SOP — content scheduling &amp; management</summary><div class="th-sopg">'+
      '<div><b>1 · Content monitoring</b>Check Content Snare regularly for new uploads from the model or client. Press <b>Checked Content Snare</b> each time.</div>'+
      '<div><b>2 · Content preparation</b>New content? Prepare it right away: log it with <b>+ Content received</b>, then write a unique, flirty caption (if the client didn\'t give one) and use the media the client provided.</div>'+
      '<div><b>3 · Scheduling</b>1 photo or 1 photo set per post, on the <b>PM EST</b> schedule. Content limited? Post <b>every other day</b> (model menu).</div>'+
      '<div><b>4 · Client communication</b>After scheduling everything you have, tell the client the <b>last scheduled date</b>. Before the posts run out, tell the client <b>new content is needed</b>.</div>'+
      '<div><b>Key reminders</b>Keep posting consistent · every caption unique (the tool refuses a repeat) · no gaps — update the client before the runway hits zero.</div>'+
    '</div></details>';
  }
  function routine(o){
    var last=o.cs[o.cs.length-1], ago=last?Math.round((Date.now()-Date.parse(last))/60000):null;
    var st=function(n, ok, lbl, sub){ return '<div class="th-st'+(ok?' ok':'')+'"><i>'+(ok?'✓':n)+'</i><span>'+lbl+'<small>'+sub+'</small></span></div>'; };
    return '<div class="th-card"><div class="th-ch"><b>Today\'s routine</b><span>EST today: '+esc(wdate(estToday()))+'</span><span style="flex:1"></span>'+
        '<button class="th-btn sm go" onclick="WP.csCheck()">Checked Content Snare</button></div>'+
      '<div class="th-steps">'+

/* ═══════════ CLIENT: MEADOW · X (Jeth, Nov 10 — from the ALTR X / Twitter Growth Playbook, SOPX01) ═══════════
   VA: Joana (JMB028). One creator runs as ONE main account + 2–3 burners. The playbook, as the tool runs it:
     1) setup before anything: profile picture (her strongest asset), display name, bio, link (main → OF, burner → the main);
     2) 3-day warm-up: replies only (5–10 a day under the ALTR reply-target list), ZERO posts — the tool refuses a post;
     3) live: main 2–3 posts a day (min 1), each burner 3–4; every post is bait / question / trend / winner and must
        demand a reply; burner posts that start moving get a pinned reply to the main; reply to the people who replied;
     4) trend-jacking: log a trend the moment it is spotted, post it on every account within 15–30 min;
     5) winners: mark the posts that beat the baseline — they are reused (same photo, same words) on every new account;
     6) flags: embed test (preview shows = clean, bare link = flagged) on winners, trends and anything that stalls;
     7) day-14 gate: one post broke the baseline → pass; otherwise restart (the account is archived, a new one warms up).
   Credentials, proxies and devices are NOT kept here. Timer: the hub work timer (starts on the first step).
   Data: pa_* rows, project "Meadow X".
     account → handle '@name', status warmup | live | restart, meta { kind:'acct', role:'main'|'burner', cr:'creator',
               setup:{ pfp,name,bio,link }, ws:'YYYY-MM-DD' (warm-up start, business day), rep:{ day:n }, rr:[day…],
               posts:[{ at, bd, by, ty:'bait'|'question'|'trend'|'winner', cap, u, pin, emb:'clean'|'flag'|'', win, imp }],
               gate:{ at, by, res:'pass'|'fail', note } }
     trends  → one row, handle 'trends', status 'log', meta { kind:'trends', list:[{ id, n, at, bd, by, v24 }] } */
var MX=(function(){
  var CID='meadowx', PROJECT='Meadow X', PO='Meadows';
  var CL=function(){ return clientById(CID); };
  var TY={ bait:'Bait', question:'Question', trend:'Trend', winner:'Winner repost' };
  var TGT={ main:[2,3], burner:[3,4] };
  var S={ rows:[], loaded:false, err:'', day:'', filter:'all', busy:{}, pan:null };
  try{ S.filter=sessionStorage.getItem('dc_va_'+PROJECT)||'all'; }catch(e){}

  function me(){ return String((USER&&USER.id)||'').toUpperCase(); }
  function meL(){ return me().toLowerCase(); }
  function ownerOf(r){ return String(r.assigned_to||r.created_by||'').toLowerCase(); }
  function rowById(id){ return S.rows.filter(function(x){ return x.id===id; })[0]; }
  function Mt(r){ return r.meta||{}; }
  function isTrendRow(r){ return Mt(r).kind==='trends' || String(r.handle||'').toLowerCase()==='trends'; }
  function accts(){ return S.rows.filter(function(r){ return !isTrendRow(r); }); }
  function trendRow(){ return S.rows.filter(isTrendRow)[0]||null; }
  function trends(){ var t=trendRow(); return ((t&&Mt(t).list)||[]).slice().sort(function(a,b){ return String(b.at).localeCompare(String(a.at)); }); }
  function day(){ return S.day||today(); }
  function dDiff(a, b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5); }
  var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function sdate(ds){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(ds||''))) return String(ds||''); return MO[+ds.slice(5,7)-1]+' '+(+ds.slice(8,10)); }
  function tm(iso){ var t=Date.parse(iso||''); if(!t) return ''; try{ return new Date(t).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }catch(e){ return ''; } }
  function role(r){ return Mt(r).role==='main'?'main':'burner'; }
  function posts(r){ return Mt(r).posts||[]; }
  function repOn(r, d){ return +((Mt(r).rep||{})[d||today()]||0); }
  function wuDay(r){ var ws=Mt(r).ws; return ws?dDiff(ws, today())+1:1; }                   // warm-up day 1, 2, 3 …
  function wuDone(r){ var ws=Mt(r).ws; if(!ws) return 0; var n=0; for(var i=0;i<3;i++){ if(repOn(r, hubDayAdd(ws,i))>=5) n++; } return n; }
  function canLaunch(r){ return r.status==='warmup' && wuDay(r)>=4 && wuDone(r)>=3 && setupOk(r); }
  function setupOk(r){ var s=Mt(r).setup||{}; return !!(s.pfp && s.name && s.bio && s.link); }
  function firstPost(r){ var a=posts(r).map(function(p){ return p.bd; }).sort(); return a[0]||''; }
  function liveDay(r){ var f=firstPost(r); return f?dDiff(f, today())+1:0; }
  function postsOn(r, d){ return posts(r).filter(function(p){ return p.bd===(d||today()); }).length; }
  function wins(r){ return posts(r).filter(function(p){ return p.win; }).length; }
  function gateDue(r){ return r.status==='live' && !Mt(r).gate && liveDay(r)>=14; }
  function rrToday(r){ return (Mt(r).rr||[]).indexOf(today())>=0; }
  function state(r){
    if(r.status==='restart') return 'restart';
    if(r.status==='warmup') return canLaunch(r)?'launch':'warm';
    if(gateDue(r)) return 'gate';
    var t=TGT[role(r)][0]; return postsOn(r)>=t?'done':'post';
  }
  var GRP=[['launch','Warm-up finished — post the best content first'],['warm','Warm-up — replies only, zero posts'],['gate','Day-14 gate — viral post or restart'],
           ['post','Live — posts still due today'],['done','Live — today\'s posts done'],['restart','Restarted (archived)']];

  function cacheRows(){ try{ sessionStorage.setItem('dc_rows_'+PROJECT, JSON.stringify({ t:Date.now(), rows:S.rows })); }catch(e){} }
  function paintCached(){ try{ var c=JSON.parse(sessionStorage.getItem('dc_rows_'+PROJECT)||'null'); if(c && c.rows && (Date.now()-c.t)<10*60*1000){ S.rows=c.rows; S.loaded=true; return true; } }catch(e){} return false; }
  async function load(){
    try{
      var d=await jFetch(API+'?action=pa_list&project='+encodeURIComponent(PROJECT)+'&_='+Date.now());
      if(!d||!d.ok) throw new Error((d&&d.error)||'load');

    accts().forEach(function(r){

      else { o.live++; if(postsOn(r, d)<TGT[role(r)][0]) o.due++; if(gateDue(r)) o.gate++; }

    }catch(e){}
    try{
      var tp=await jFetch(API+'?action=get_tracker_projects&_='+Date.now(), 1), names={};

      var from=ymd(new Date(Date.now()-WL_DAYS*864e5)), wl={}, proj={}, jobs=[];

        proj[c.id]=mine; wl[c.id]=[];
        var f2=c.wlDays?ymd(new Date(Date.now()-c.wlDays*864e5)):from;      // Oct 15: a client inside a bigger project (Threads in Reddit - Altz) reads a shorter window

      });
      await Promise.all(jobs);

        _wt=0; var v=initialView();
        if(v && v!=='team'){ pick(v, true); try{ linkAfter(); }catch(_l){} toast('Your '+(clientById(v)||{}).name+' tab is ready.'); }
        else { var w=$('hub-wait'); if(w) w.textContent='Watching for your portal timer… last checked '+new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' }); }
      }, function(){ _wt=0; });
    }catch(e){ _wt=0; }
  }, 5000);
  return { S:S, loadAll:loadAll, pick:pick, cur:cur, myClients:myClients, membersOf:membersOf, repaint:repaint, repaintLink:repaintLink, onData:onData, boot:boot,
           refreshTeams:refreshTeams, copyLink:copyLink, renderMe:renderMe, loadTeams:loadTeams, teamSet:teamSet, loadMan:loadMan,
           scPublish:scPublish, scSetMonth:scSetMonth, scRefresh:scRefresh, _sc:{ scRows:scRows, SCX:SCX } };
})();

/* ── sign in ── */
async function signIn(){
  var id=$('si-id').value.trim(), pin=$('si-pin').value.trim(), err=$('si-err'); err.style.display='none';
  if(!id||!pin){ err.style.display='block'; err.textContent='Enter your Employee ID and PIN.'; return; }
  var b=$('si-go'); b.disabled=true; b.textContent='Signing in…';
  try{
    var d=await jFetch(API+'?id='+encodeURIComponent(id)+'&pin='+encodeURIComponent(pin)+'&_='+Date.now(), 1);
    if(!d||d.error){ err.style.display='block'; err.textContent=(d&&d.error==='WRONG_PIN')?'Incorrect PIN.':'Employee not found.'; b.disabled=false; b.textContent='Sign in'; return; }
    USER={ id:d.employee_id, name:d.full_name||d.employee_id, sess:d.sess||'' };
    try{ sessionStorage.setItem('clienthub_user', JSON.stringify(USER)); }catch(e){}
    start();
  }catch(e){ err.style.display='block'; err.textContent='Network error — try again.'; }
  b.disabled=false; b.textContent='Sign in';
}
function signOut(){ try{ sessionStorage.removeItem('clienthub_user'); sessionStorage.removeItem('designshopify_user'); sessionStorage.removeItem('ember_user'); }catch(e){} location.href=location.pathname; }
function start(){
  ROLE=OWNER_IDS.indexOf(myId())>=0?'owner':'va';
  try{ fetch(API+'?action=tool_used&employee_id='+encodeURIComponent(USER.id)+'&tool=clients&_='+Date.now()); }catch(_tu){}
  $('signin').classList.add('hide'); $('app').classList.remove('hide');
  HUB.renderMe(); loadNames(); HUB.boot(false);
  try{ if(clientById('skyvern')) SKY.runRestore(); }catch(_sr){}   // a Skyvern scroll timer survives a refresh (Skyvern retired Oct 15)
  try{ P2.tmRestore(); }catch(_p2){}     // so does a Project 2 step timer (Oct 14)
  try{ htRestore(); }catch(_ht){}        // and the hub work timer
  if(isOwner()) setTimeout(function(){ try{ oliveLoad(); }catch(e){} }, 1500);
  setTimeout(function(){ tbSend(true); }, 2500);
  /* keep the boards fresh: every minute while visible, and on focus */
  setInterval(function(){ if(!document.hidden) HUB.loadAll(); }, 60000);
  setInterval(function(){ if(!document.hidden) HUB.loadTeams(true).then(function(){ HUB.repaint(); }); }, 10*60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) HUB.loadAll(); });
  window.addEventListener('focus', function(){ HUB.loadAll(); });
}

/* SELF-REFRESH — the page watches its own ETag and reloads itself within ~2 minutes of a new version going live
   (waits while a box is open or a field has focus). */
var _pageTag=null;
async function pageWatch(){
  try{
    var r=await fetch(location.pathname+'?w='+Date.now(), { method:'HEAD', cache:'no-store' });
    var tag=r.headers.get('etag')||r.headers.get('last-modified')||''; if(!tag) return;
    if(_pageTag===null){ _pageTag=tag; return; }
    if(tag===_pageTag) return;
    var ae=document.activeElement, typing=ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type!=='checkbox';
    var busy=(($('qcmask')||{}).classList||{ contains:function(){ return false; } }).contains('on') || ($('proof-ov') && $('proof-ov').style.display==='flex') || ($('ima-pf') && $('ima-pf').style.display==='flex') || $('pfx-ov') || $('p2-ask') || $('ima-ask') || $('ht-ask') || typing;
    if(busy) return;
    _pageTag=tag; toast('The Client Hub was updated — refreshing…');
    setTimeout(function(){ try{ var u=new URL(location.href); u.searchParams.set('v', String(Date.now())); location.replace(u.toString()); }catch(e){ location.reload(); } }, 3000);
  }catch(e){}
}
setTimeout(pageWatch, 15000); setInterval(pageWatch, 120000);

/* ── 📱 PHONE WORK MODE BRIDGE (Oct 15) ── When this page runs inside the portal's Work mode on a phone (the portal timer on
   top, this tool underneath — portal opens it with ?pw=1): it signs in with the VA's portal sign-in (asked of the portal,
   which answers only its own frame), every tap here tells the portal "still working" (a tap inside a frame never reaches
   the portal page, whose 3-minute no-activity rule would stop the timer), and the layout is tightened for a phone.
   Opened any other way: nothing changes. */
var PWB=(function(){
  var PORTAL='https://portal.jmbvirtuals.com', KEY='clienthub_user', TOOL='clients', on=false;
  try{ on = window.parent!==window && /(^|&)pw=1(&|$)/.test(location.search.slice(1)); }catch(e){}
  if(!on) return { on:false, signin:function(){ return false; }, check:function(){} };
  try{ document.documentElement.classList.add('pw-embed'); }catch(e){}
  try{ var st=document.createElement('style'); st.textContent='html.pw-embed .hb-in{padding:8px 10px 0;gap:8px}html.pw-embed .wrap{padding:10px 10px 48px}html.pw-embed .brand small,html.pw-embed .me span{display:none}html.pw-embed .brand .mk{width:32px;height:32px;border-radius:10px}html.pw-embed .phead h2{font-size:19px}'+
    '#pwb-wait{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:rgba(244,245,249,.96);font-family:Inter,system-ui,-apple-system,sans-serif}'+
    '#pwb-wait>div{display:flex;flex-direction:column;align-items:center;gap:6px;color:#0f172a}#pwb-wait b{font-size:16px}#pwb-wait span{font-size:13px;color:#64748b}'+
    '#pwb-wait i{width:26px;height:26px;border-radius:50%;border:3px solid rgba(139,92,246,.25);border-top-color:#8b5cf6;animation:pwbSpin .8s linear infinite;margin-bottom:6px}@keyframes pwbSpin{to{transform:rotate(360deg)}}'+
    '#pwb-wait button{margin-top:10px;border:0;background:none;color:#6d28d9;font:700 13px Inter,system-ui,sans-serif;text-decoration:underline;cursor:pointer}';
    (document.head||document.documentElement).appendChild(st); }catch(e){}
  var last=0;
  function ping(){ var n=Date.now(); if(n-last<8000) return; last=n; try{ window.parent.postMessage({ jmbTool:'activity', tool:TOOL }, PORTAL); }catch(e){} }
  ['pointerdown','touchstart','touchmove','keydown','wheel','input','change'].forEach(function(ev){ try{ document.addEventListener(ev, ping, { passive:true, capture:true }); }catch(e){} });
  var waiters=[];
  window.addEventListener('message', function(ev){
    if(ev.origin!==PORTAL || ev.source!==window.parent) return;
    var d=ev.data, s=d&&typeof d==='object'&&d.jmbSSO; if(!s || !s.id) return;
    var u={ id:String(s.id), name:String(s.name||s.id), sess:String(s.sess||'') };
    try{ sessionStorage.setItem(KEY, JSON.stringify(u)); }catch(e){}
    waiters.splice(0).forEach(function(f){ try{ f(u); }catch(e){} });
  });
  function ask(){ try{ window.parent.postMessage({ jmbTool:'sso?', tool:TOOL }, PORTAL); }catch(e){} }
  function wait(show){
    var el=document.getElementById('pwb-wait'); if(!show){ if(el) el.remove(); return; } if(el || !document.body) return;
    el=document.createElement('div'); el.id='pwb-wait';
    el.innerHTML='<div><i></i><b>📱 Signing you in from your portal…</b><span>One moment — no PIN needed in work mode.</span><button type="button">Use my PIN instead</button></div>';
    el.querySelector('button').onclick=function(){ wait(false); }; document.body.appendChild(el);
  }
  /* no saved sign-in here: take the portal's (asks a few times, then leaves the normal sign-in form) */
  function signin(onUser){
    var done=false, n=0; wait(true);
    waiters.push(function(u){ if(done) return; done=true; wait(false); onUser(u); });
    (function again(){ if(done) return; ask(); if(++n<4) setTimeout(again, 2500); else setTimeout(function(){ if(!done) wait(false); }, 2500); })();
    return true;
  }
  /* already signed in here: if the portal is someone else's sign-in, switch to it; same person → fresh token */
  function check(cur){
    if(!cur) return;
    waiters.push(function(u){ if(String(u.id).toUpperCase()!==String(cur.id).toUpperCase()){ location.reload(); return; } if(u.sess) cur.sess=u.sess; });
    ask();
  }
  return { on:true, signin:signin, check:check };
})();

/* ── boot: an existing hub session (or one from the old Design & Shopify / Ember pages) skips the sign-in ── */
setTimeout(function(){
  var u=null; try{ u=JSON.parse(sessionStorage.getItem('clienthub_user')||'null')||JSON.parse(sessionStorage.getItem('designshopify_user')||'null')||JSON.parse(sessionStorage.getItem('ember_user')||'null'); }catch(e){}
  if(u && u.id){ USER=u; start(); PWB.check(USER); }
  else if(PWB.on){ PWB.signin(function(x){ USER=x; start(); }); }
  else { try{ $('si-id').focus(); $('si-pin').addEventListener('keydown', function(e){ if(e.key==='Enter') signIn(); }); $('si-id').addEventListener('keydown', function(e){ if(e.key==='Enter') $('si-pin').focus(); }); }catch(e){} }
}, 0);
</script>
