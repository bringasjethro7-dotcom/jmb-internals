<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Hub · JMB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════ CLIENT HUB — every small client (1–3 VAs) in one link, one tab each (Jeth, Oct 9 2026) ═══════════ */
:root{
  --bg:#f4f5f9; --s1:#ffffff; --s2:#fafbfd; --s3:#f1f2f7;
  --ink:#14161f; --ink2:#4b5164; --ink3:#7f859c; --ink4:#a9aec0;
  --line:rgba(17,19,34,.08); --line2:rgba(17,19,34,.14);
  --o:#FF6B1A; --t:#14B8A6; --tl:#0F766E; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --grad:linear-gradient(120deg,#2dd4bf 0%,#0ea5e9 50%,#6366f1 100%);
  --sh1:0 1px 2px rgba(17,19,34,.05),0 1px 1px rgba(17,19,34,.03);
  --sh2:0 10px 30px -12px rgba(17,19,34,.18),0 2px 6px rgba(17,19,34,.05);
  --r:16px; --cc:#14B8A6; --cg:linear-gradient(135deg,#2dd4bf,#0e7490);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit}
.hide{display:none!important}
.muted{color:var(--ink3);font-size:12.5px}
/* ── background wash ── */
body::before{content:'';position:fixed;inset:-20% -10% auto;height:520px;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 260px at 12% 10%,rgba(45,212,191,.16),transparent 70%),radial-gradient(520px 240px at 88% 0%,rgba(99,102,241,.12),transparent 70%)}
/* ── sign-in ── */
#signin{max-width:390px;margin:12vh auto 0;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:30px 28px 26px;text-align:center;box-shadow:var(--sh2)}
#signin .mark{width:58px;height:58px;margin:0 auto 14px;border-radius:17px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 14px 30px -12px rgba(14,165,233,.8)}
#signin .mark svg{width:28px;height:28px}
#signin h1{font:800 22px Sora,sans-serif;letter-spacing:-.01em}
#signin p{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
#signin input{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:11px;font:inherit;font-size:14px;margin-top:10px;background:var(--s2);outline:none}
#signin input:focus{border-color:var(--t);box-shadow:0 0 0 3px rgba(20,184,166,.16)}
#signin button{width:100%;margin-top:14px;background:var(--grad);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;font-size:14px}
#si-err{display:none;color:#b91c1c;font-size:12.5px;margin-top:10px}
/* ── header ── */
.hb{position:sticky;top:0;z-index:40;background:rgba(244,245,249,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hb-in{max-width:1320px;margin:0 auto;padding:12px 18px 0;display:flex;flex-direction:column;gap:10px}
.hb-top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mk{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 10px 22px -12px rgba(14,165,233,.9)}
.brand .mk svg{width:20px;height:20px}
.brand b{font:800 17px Sora,sans-serif;letter-spacing:-.01em;display:block}
.brand small{font-size:11.5px;color:var(--ink3);font-weight:600}
.sp{flex:1}
.me{display:flex;align-items:center;gap:9px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 4px;box-shadow:var(--sh1)}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--cg);color:#fff;display:grid;place-items:center;font:800 11px Sora,sans-serif;overflow:hidden;flex:none}
.me .av img{width:100%;height:100%;object-fit:cover}
.me span{font-size:12.5px;font-weight:700;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me em{font-style:normal;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--tl);background:rgba(20,184,166,.12);border-radius:999px;padding:2px 7px}
.me button{border:none;background:var(--s3);color:var(--ink2);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
/* ── client tabs ── */
.ctabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:0;margin:0 -2px}
.ctabs::-webkit-scrollbar{display:none}
.ct{position:relative;display:flex;align-items:center;gap:10px;padding:9px 14px 12px 10px;border:none;background:none;cursor:pointer;border-radius:12px 12px 0 0;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.ct:hover{background:rgba(17,19,34,.04)}
.ct .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;background:var(--g);box-shadow:0 8px 16px -10px var(--c);opacity:.85;transition:transform .2s,opacity .2s}
.ct .ic svg{width:16px;height:16px}
.ct .tx{text-align:left;line-height:1.15}
.ct .tx b{display:block;font-size:13.5px;font-weight:800;color:inherit}
.ct .tx small{font-size:11px;font-weight:600;color:var(--ink3)}
.ct .soon{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a16207;background:rgba(245,158,11,.14);border-radius:999px;padding:2px 7px;margin-left:2px}
.ct::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--g);transform:scaleX(0);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.ct.on{color:var(--ink)}
.ct.on .ic{opacity:1;transform:translateY(-1px)}
.ct.on::after{transform:scaleX(1)}
.ct.gear .ic{background:linear-gradient(135deg,#64748b,#334155)}
/* ── page ── */
.wrap{max-width:1320px;margin:0 auto;padding:18px 18px 70px}
.pane{animation:paneIn .35s cubic-bezier(.2,.8,.3,1) both}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{font:800 24px Sora,sans-serif;letter-spacing:-.015em;line-height:1.1}
.phead h2 em{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.phead .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.empty{padding:46px 24px;text-align:center}
.empty .big{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;color:#fff;background:var(--g,var(--grad));box-shadow:0 16px 30px -16px var(--c,#0ea5e9)}
.empty .big svg{width:30px;height:30px}
.empty h3{font:800 18px Sora,sans-serif}
.empty p{color:var(--ink2);font-size:13px;line-height:1.6;max-width:520px;margin:8px auto 0}
.btn{border:none;border-radius:10px;padding:9px 15px;font-weight:800;font-size:12.5px;cursor:pointer;background:var(--grad);color:#fff}
.btn.sec{background:var(--s1);color:var(--ink2);border:1px solid var(--line2)}
.btn.sm{padding:6px 11px;font-size:11.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#14161f;color:#fff;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99999;max-width:min(560px,92vw);text-align:center;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ── Team (owner) ── */
.tm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tm-c{padding:16px 16px 14px;position:relative;overflow:hidden}
.tm-c::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--g)}
.tm-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tm-h .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--g);flex:none}
.tm-h .ic svg{width:17px;height:17px}
.tm-h b{font-size:14.5px;font-weight:800;display:block}
.tm-h small{font-size:11.5px;color:var(--ink3);font-weight:600}
.mem{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.mc{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border-radius:999px;padding:3px 4px 3px 3px;font-size:12px;font-weight:700}
.mc .a{width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:800 9.5px Sora,sans-serif;overflow:hidden}
.mc .a img{width:100%;height:100%;object-fit:cover}
.mc small{font-size:10px;color:var(--ink3);font-weight:700}
.mc button{border:none;background:rgba(17,19,34,.08);width:18px;height:18px;border-radius:50%;cursor:pointer;color:var(--ink2);font-size:12px;line-height:1;margin-right:2px}
.tm-add{display:flex;gap:6px;margin-top:12px}
.tm-add input{flex:1;padding:8px 11px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:12.5px;background:var(--s2);outline:none}
.tm-add input:focus{border-color:var(--t)}
/* ═══════════ DESIGN & SHOPIFY (moved in from design-shopify.html) — scoped under .c-ds ═══════════ */
.c-ds{--waiting:#94a3b8;--editing:#6366f1;--drive:#f59e0b;--shopify:#10b981;--website:#059669;--hold:#64748b;--issue:#ef4444}
.c-ds .sub{color:var(--ink2);font-size:12.5px;line-height:1.55;margin:-4px 0 14px;max-width:880px}
.c-ds .top{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:14px}
.c-ds .stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center;box-shadow:var(--sh1)}
.c-ds .stat b{font:800 21px Sora,sans-serif;display:block}
.c-ds .stat span{font-size:10.5px;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.c-ds .stat.waiting b{color:var(--waiting)} .c-ds .stat.editing b{color:var(--editing)} .c-ds .stat.drive b{color:var(--drive)} .c-ds .stat.shopify b{color:var(--shopify)} .c-ds .stat.website b{color:var(--website)} .c-ds .stat.issue b{color:var(--issue)}
.c-ds .addbox{display:flex;gap:8px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:var(--sh1)}
.c-ds .addbox input,.c-ds .addbox select{flex:1;min-width:150px;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:13px;background:var(--s2);outline:none}
.c-ds .addbox input:focus{border-color:var(--website)}
.c-ds .addbox button{background:linear-gradient(135deg,#10b981,#065f46);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer}
.c-ds .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}
.c-ds .col{background:var(--s1);border:1px solid var(--line);border-radius:15px;padding:12px;min-height:120px;box-shadow:var(--sh1)}
.c-ds .col h3{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.c-ds .col h3 i{width:9px;height:9px;border-radius:50%;flex:none}
.c-ds .col.waiting h3 i{background:var(--waiting)} .c-ds .col.editing h3 i{background:var(--editing)} .c-ds .col.drive h3 i{background:var(--drive)} .c-ds .col.shopify h3 i{background:var(--shopify)} .c-ds .col.website h3 i{background:var(--website)} .c-ds .col.hold h3 i{background:var(--hold)} .c-ds .col.issue h3 i{background:var(--issue)}
.c-ds .acct{border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;background:var(--s1);box-shadow:0 1px 2px rgba(15,23,42,.05);transition:box-shadow .15s,transform .15s}
.c-ds .acct:hover{box-shadow:0 8px 22px rgba(15,23,42,.09);transform:translateY(-1px)}
.c-ds .acct b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-ds .acct .who{font-size:10.5px;color:var(--ink3);margin:2px 0 6px}
.c-ds .acct .btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.c-ds .acct button{border:1px solid var(--line2);background:var(--s1);border-radius:8px;padding:4px 8px;font-size:10.5px;font-weight:800;cursor:pointer;color:var(--ink2)}
.c-ds .acct button.go{border-color:rgba(16,185,129,.5);color:#0f766e;background:rgba(16,185,129,.08)}
.c-ds .acct button.warn{border-color:rgba(245,158,11,.5);color:#92400e;background:rgba(245,158,11,.08)}
.c-ds .kmenu{position:relative}
.c-ds .kmenu summary{list-style:none;cursor:pointer;width:27px;height:27px;border:1px solid var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-weight:900;background:var(--s1);font-size:14px}
.c-ds .kmenu summary::-webkit-details-marker{display:none}
.c-ds .kmenu[open] summary{background:var(--bg)}
.c-ds .kmenu .dd{position:absolute;right:0;top:31px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.16);padding:6px;min-width:210px;display:flex;flex-direction:column;gap:2px}
.c-ds .kmenu .dd button{border:none;background:none;text-align:left;padding:8px 10px;border-radius:8px;font:700 12px Inter,sans-serif;color:var(--ink2);cursor:pointer;white-space:nowrap}
.c-ds .kmenu .dd button:hover{background:var(--bg)}
.c-ds .kmenu .dd button.danger{color:#b91c1c}
.c-ds .kmenu .dd .sep{height:1px;background:var(--line);margin:4px 6px}
.c-ds .pvwrap{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 18px 8px;box-shadow:var(--sh1);margin-bottom:14px}
.c-ds .pvrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.c-ds .pvrow.first{border-top:none}
.c-ds .pvav{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:800 12.5px Sora,sans-serif;color:#fff}
.c-ds .pvbar{height:14px;border-radius:9px;background:rgba(15,23,42,.07);overflow:hidden;position:relative}
.c-ds .pvbar i{display:block;height:100%;border-radius:9px;transition:width .4s;background-image:linear-gradient(90deg,#34d399,#059669);position:relative;overflow:hidden}
.c-ds .pvbar i::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);animation:dsShine 2.4s infinite}
@keyframes dsShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.c-ds .pvpct{font-family:Sora,sans-serif;font-weight:800;min-width:118px;text-align:right;line-height:1.25}
.c-ds .sopbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh1)}
.c-ds .sopbox summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--ink2)}
.c-ds .sopbox summary::-webkit-details-marker{display:none}
.c-ds .sopbox summary::after{content:' ▾'} .c-ds .sopbox[open] summary::after{content:' ▴'}
.c-ds .sopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.c-ds .sopph{background:rgba(15,23,42,.03);border-radius:10px;padding:9px 11px;font-size:11.5px;color:var(--ink2);line-height:1.55}
.c-ds .sopph b{display:block;font-size:11.5px;color:var(--ink);margin-bottom:3px}
.c-ds .vpill{border:1px solid var(--line2);background:var(--s1);color:var(--ink2);border-radius:999px;padding:6px 13px;font:800 12px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.c-ds .vpill.on{border-color:#065f46;background:rgba(16,185,129,.12);color:#065f46}
.c-ds .q{width:100%;max-width:340px;padding:9px 13px;border:1px solid var(--line2);border-radius:999px;font:inherit;font-size:13px;background:var(--s1);margin-bottom:12px;outline:none}
/* QC modal */
#qcmask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:9000;align-items:center;justify-content:center;padding:16px}
#qcmask.on{display:flex}
#qcbox{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(15,23,42,.3);max-height:88vh;overflow:auto}
#qcbox h2{font:800 17px Sora,sans-serif;margin-bottom:2px}
#qcbox .qsub{font-size:12px;color:var(--ink3);margin-bottom:12px}
.qcitem{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.qcitem input{margin-top:2px;accent-color:#059669}
.qcitem.ok{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.06);color:#065f46}
#qc-pub{width:100%;margin-top:10px;background:linear-gradient(135deg,#10b981,#065f46);color:#fff;border:none;border-radius:11px;padding:12px;font:800 14px Inter,sans-serif;cursor:pointer}
#qc-pub:disabled{opacity:.4;cursor:not-allowed}
#qc-close{width:100%;margin-top:7px;background:none;border:1px solid var(--line2);border-radius:11px;padding:10px;font:800 12.5px Inter,sans-serif;color:var(--ink3);cursor:pointer}
/* ═══════════ IMPERIUM (IG · physical phones) ═══════════ */
.c-ima{--ig:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af);--igc:#c13584;--igs:rgba(221,42,123,.08)}
.c-ima .btn{background:var(--ig)} .c-ima .btn.sec{background:var(--s1);color:var(--ink2);border:1px solid var(--line2)}
.c-ima .sub{font-size:12.5px;color:var(--ink2);margin:-2px 0 12px;line-height:1.55}
.c-ima .sopbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh1)}
.c-ima .sopbox summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--ink2)}
.c-ima .sopbox summary::-webkit-details-marker{display:none}
.c-ima .sopbox summary::after{content:' ▾'} .c-ima .sopbox[open] summary::after{content:' ▴'}
.c-ima .sopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.c-ima .sopph{background:var(--igs);border-radius:10px;padding:9px 11px;font-size:11.5px;color:var(--ink2);line-height:1.55}
.c-ima .sopph b{display:block;font-size:11.5px;color:var(--ink);margin-bottom:3px}
.c-ima .istats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.c-ima .istat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.c-ima .istat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ig)}
.c-ima .istat b{display:block;font:800 21px Sora,sans-serif;letter-spacing:-.02em;color:var(--ink)}
.c-ima .istat b small{font-size:12px;color:var(--ink4);font-weight:700;margin-left:1px}
.c-ima .istat span{font-size:11px;font-weight:700;color:var(--ink3)}
.c-ima .istat.tr{background:#fff7ed;border-color:rgba(234,88,12,.25)} .c-ima .istat.tr b{color:#c2410c}
.c-ima .inav{display:inline-flex;gap:3px;background:var(--s3);border-radius:12px;padding:3px;margin-bottom:12px}
.c-ima .inav button{border:none;background:none;border-radius:9px;padding:8px 14px;font:800 12.5px Inter,sans-serif;color:var(--ink3);cursor:pointer}
.c-ima .inav button.on{background:var(--s1);color:var(--ink);box-shadow:var(--sh1)}

     A VA is on a client when the WORKLOG says so (time tracked on its project, last 60 days), OR they own cards on its board, OR their
     portal timer is running on that client's project right now.
   • Timer link, same as Reddit Central / ALTR Studio: work only counts while the portal timer runs on that
     client's project (the pairing box waits for it), and the hub writes its heartbeat to Supabase tool_beat

async function jFetch(url, tries){

var _nmTry=0;
async function loadNames(){
  try{
    var d=null;

function vaKeyOf(empId){
  var sh=SHIFTOF[String(empId||'').toLowerCase()];

.pfx-st{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);color:#e9e5ff;transition:background .35s,color .35s}
.pfx-st .el{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.55;font-weight:700;font-size:12px}
.pfx-st .dots{display:inline-flex;gap:3px}
.pfx-st .dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pfxDots 1.2s ease-in-out infinite}
.pfx-st .dots i:nth-child(2){animation-delay:.15s}.pfx-st .dots i:nth-child(3){animation-delay:.3s}
.pfx-st.ok{background:rgba(16,185,129,.14);box-shadow:inset 0 0 0 1px rgba(52,211,153,.35);color:#6ee7b7}
.pfx-st.bad{background:rgba(244,63,94,.12);box-shadow:inset 0 0 0 1px rgba(244,63,94,.3);color:#fda4af}
.pfx-st .tx{transition:opacity .25s}
.pfx-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pfx-step{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:11px;font-size:11.5px;font-weight:700;line-height:1.25;color:rgba(255,255,255,.45);background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:all .35s}
.pfx-step .n{flex:none;font-style:normal;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);transition:all .35s}
.pfx-step.on{color:#fff;background:rgba(255,107,26,.10);box-shadow:inset 0 0 0 1px rgba(255,107,26,.45)}
.pfx-step.on .n{background:#FF6B1A;color:#fff;box-shadow:0 0 0 4px rgba(255,107,26,.18)}
.pfx-step.dn{color:rgba(255,255,255,.75)}
.pfx-step.dn .n{background:#10b981;color:#fff;font-size:0}
.pfx-step.dn .n::after{content:'✓';font-size:11px}
.pfx-step span b{color:#fff}
.pfx-btns{display:flex;gap:8px;margin-top:14px}
.pfx-btn{font:inherit;font-weight:800;font-size:14px;border-radius:13px;padding:13px 16px;cursor:pointer;text-decoration:none;text-align:center;border:none;transition:transform .15s,filter .15s}
.pfx-btn:active{transform:scale(.97)}
.pfx-btn.p{flex:1;color:#fff;background:linear-gradient(135deg,#FF8A3D,#FF6B1A 50%,#E8452A);box-shadow:0 12px 28px -12px rgba(255,107,26,.9)}
.pfx-btn.p:hover{filter:brightness(1.07)}
.pfx-btn.s{color:#e9e5ff;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pfx-card.done .pfx-btns{display:none}
.pfx-ov{position:fixed;inset:0;z-index:9960;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(8,6,14,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:pfxFade .25s ease-out both}
.pfx-ov.out{animation:pfxFadeOut .3s ease-in both}
.pfx-ov .pfx-card{animation:pfxRise .45s cubic-bezier(.2,1.2,.4,1) both}
/* ── the "linked" card ── */
.pfx-cel{position:fixed;left:50%;top:14px;z-index:99990;width:min(390px,calc(100vw - 20px));transform:translateX(-50%);color:#f5f3ff;background:rgba(20,17,31,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px;padding:12px 12px 12px;box-shadow:0 24px 60px -18px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.1);font-family:inherit;cursor:pointer;animation:pfxDrop .5s cubic-bezier(.2,1.3,.4,1) both;text-align:left}
.pfx-cel.out{animation:pfxLift .35s ease-in both}
.pfx-cel .hd{display:flex;align-items:center;gap:8px;padding:0 2px 9px}
.pfx-cel .hd b{font-size:14px;font-weight:800}
.pfx-cel .hd span{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6ee7b7}
.pfx-cel .ft{font-size:12px;color:rgba(255,255,255,.62);padding:9px 2px 0;line-height:1.45}
@keyframes pfxBreath{0%,100%{transform:scale(1)}50%{transform:scale(.95)}}
@keyframes pfxPing{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@keyframes pfxEmit{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.28)}}
@keyframes pfxDash{to{background-position:12px 0}}
@keyframes pfxPkt{0%{left:0;opacity:0}15%{opacity:1}82%{opacity:1}100%{left:calc(100% - 44px);opacity:0}}
@keyframes pfxFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pfxFlick{0%,100%{opacity:1}46%{opacity:.35}50%{opacity:1}54%{opacity:.5}58%{opacity:1}}
@keyframes pfxFlow{0%{left:-26%}62%,100%{left:100%}}
@keyframes pfxFlowR{0%{left:100%}62%,100%{left:-26%}}
@keyframes pfxSpin{to{transform:rotate(360deg)}}
@keyframes pfxPop{0%{transform:scale(1)}35%{transform:scale(.88)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes pfxHubPop{0%{transform:scale(.6)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes pfxBreathHub{0%,100%{box-shadow:0 0 0 3px rgba(52,211,153,.16),0 6px 20px -4px rgba(16,185,129,.6)}50%{box-shadow:0 0 0 6px rgba(52,211,153,.10),0 6px 24px -2px rgba(16,185,129,.8)}}
@keyframes pfxWave{0%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(3.4)}}
@keyframes pfxBeat{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pfxSpk{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
@keyframes pfxFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes pfxDot{0%{box-shadow:0 0 0 0 rgba(255,107,26,.6)}100%{box-shadow:0 0 0 8px rgba(255,107,26,0)}}
@keyframes pfxDots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes pfxFade{from{opacity:0}to{opacity:1}}
@keyframes pfxFadeOut{to{opacity:0}}
@keyframes pfxRise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pfxDrop{from{opacity:0;transform:translate(-50%,-24px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pfxLift{to{opacity:0;transform:translate(-50%,-16px) scale(.97)}}
@media (max-width:520px){.pfx-lg .pfx-row{grid-template-columns:96px 1fr 96px;padding:24px 8px 0}.pfx-lg .pfx-beam{margin:0 -16px}.pfx-steps{grid-template-columns:1fr}.pfx-sm{column-gap:7px;padding:8px 10px}}

    if(ok) qcClose(); else $('qc-pub').disabled=false;
  }
  return { id:'design-shopify', S:S, load:load, render:render, paint:paint, paintCached:paintCached, owners:owners,
           setFilter:setFilter, setQ:setQ, add:add, move:move, pause:pause, resume:resume, del:del,
           qcOpen:qcOpen, qcTick:qcTick, qcClose:qcClose, qcPublish:qcPublish };
})();

/* ═══════════ CLIENT: IMPERIUM (IMA) — Instagram on physical phones (Imperium SOP-02, Sept 2026) ═══════════
   The tool keeps the RECORD of the work done under Imperium's SOP-02 — the operation itself stays the team's.
   • PHONES — one phone = one model, up to three accounts. The SOP's completion checklist (§X) is ticked step by step,
     with the proxy / coordinates noted for the record. All ten done → the phone is Ready (+1 IG Phone Setup).
   • PRE-FLIGHT — before a phone is worked in a session the VA logs the three screenshots (Maps · IP · Scamalytics), the
     fraud score and the manager's go-ahead (+1 IG Pre-flight Check). The phone's accounts open for that session only once
     a clean pre-flight is logged; a fraud score above 3 or a mismatch is logged as STOP and keeps them closed.
   • ACCOUNTS — each runs the SOP calendar from its creation day: D1 create + scroll, D2 profile photo + scroll, D3–7
     scroll, D8–12 one feed photo a day, then reels 1/day × 3 days, 2/day × 3 days, 3/day ongoing. The tool offers only
     what is due, so nothing is posted ahead of the warm-up and reels stop at the day's target.
   • TRIAL REELS — "Unlocked" flags the account for the managers; trial reels can be logged only after the owner sets
     how many that account runs a day.
   • PRODUCTIVITY — every logged step counts (Jeth, Oct 9: "Everything"), through the proof gate → po_bump, plus a
     per-shift completion % of the day's plan (po_snap).  QA — the owner's QA tab: one line per VA per day (pre-flights,
     phones worked, plan done, misses) with a suggested score /10 that can be adjusted and saved to the portal's daily QA. */
var IMA=(function(){
  var CID='imperium', PROJECT='Imperium';
  var CL=function(){ return clientById(CID); };
  var T={ phone:'IG Phone Setup', pre:'IG Pre-flight Check', create:'IG Account Created', scroll:'IG Warm-up Scroll',
          pfp:'IG Profile Photo', feed:'IG Feed Photo', reels:'IG Reel', trial:'IG Trial Reel' };
  var SETUP=[
    'Pulled an available proxy from Airtable and assigned it to this phone',
    'Entered that proxy into Shadowrocket and switched it on',
    'Found the coordinates listed next to that same proxy in Airtable',
    'Entered the coordinates in AnyTo and confirmed the device was spoofed',
    'Checked Maps on the phone — location matches the AnyTo location',
    'Checked whatismyipaddress.com — IP is in the same state as the location',
    'Checked Scamalytics — fraud score is between 0 and 3',
    'Installed Instagram and created 3 accounts on this phone (one model only)',
    'Started the 7-day warm-up and logged the start date for each account',
    'Read and understood the pre-flight check — to be run before every session'
  ];
  var VERIFY_STEPS=7;           // steps 1–7 = the device is verified → accounts may be created on it
  var MAX_ACCTS=3, FRAUD_MAX=3;
  var S={ rows:[], loaded:false, err:'', view:'today', who:'all', qaDate:'', busy:{} };
  try{ S.view=sessionStorage.getItem('ima_view')||'today'; }catch(e){}

  /* ── data ── */
  function cacheRows(){ try{ sessionStorage.setItem('ima_rows', JSON.stringify({ t:Date.now(), rows:S.rows })); }catch(e){} }
  function paintCached(){ try{ var c=JSON.parse(sessionStorage.getItem('ima_rows')||'null'); if(c && c.rows && (Date.now()-c.t)<10*60*1000){ S.rows=c.rows; S.loaded=true; return true; } }catch(e){} return false; }
  async function load(){
    try{
      var d=await jFetch(API+'?action=pa_list&project='+encodeURIComponent(PROJECT)+'&_='+Date.now());
      if(!d||!d.ok) throw new Error((d&&d.error)||'load');
      S.rows=(d.rows||[]).map(function(r){ r.meta=r.meta||{}; return r; }); S.loaded=true; S.err=''; cacheRows();
    }catch(e){ S.err='Could not load — check your connection, then refresh.'; }
    HUB.onData(CID);
  }
  function phones(){ return S.rows.filter(function(r){ return r.meta.kind==='phone'; }).sort(function(a,b){ return String(a.handle).localeCompare(String(b.handle), undefined, { numeric:true }); }); }
  function accts(){ return S.rows.filter(function(r){ return r.meta.kind==='acct'; }); }
  function acctsOf(pid){ return accts().filter(function(a){ return a.meta.phone===pid; }).sort(function(a,b){ return String(a.meta.start||'').localeCompare(String(b.meta.start||'')) || String(a.handle).localeCompare(String(b.handle)); }); }
  function rowById(id){ return S.rows.filter(function(x){ return x.id===id; })[0]; }
  function phoneLabel(p){ return String(p.handle||'').replace(/^phone:/,''); }
  function ownerOf(r){ return String(r.assigned_to||r.created_by||'').toLowerCase(); }
  function owners(){ var m={}; S.rows.forEach(function(r){ var k=ownerOf(r); if(k) m[k]=1;
    var lg=(r.meta&&r.meta.log)||{}; Object.keys(lg).forEach(function(d){ if(lg[d]&&lg[d].by) m[String(lg[d].by).toLowerCase()]=1; }); }); return Object.keys(m); }
  function me(){ return String((USER&&USER.id)||'').toUpperCase(); }

  /* ── the SOP calendar ── */
  function dnum(d){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||'')); return m?Date.UTC(+m[1],+m[2]-1,+m[3])/864e5:NaN; }
  function dayN(a, date){ var s=dnum(a.meta.start), t=dnum(date||today()); return (isNaN(s)||isNaN(t))?0:(t-s+1); }
  function reelTarget(n){ var r=n-12; return r<1?0:(r<=3?1:(r<=6?2:3)); }
  function everDone(a, k){ var lg=a.meta.log||{}; return Object.keys(lg).some(function(d){ return (lg[d]||{})[k]; }); }
  var DEAD={ banned:1, restricted:1, hold:1 };
  function phase(a, date){
    var n=dayN(a, date);
    if(DEAD[a.status]) return { k:a.status, t:{ banned:'Banned', restricted:'Restricted', hold:'On hold' }[a.status], n:n };
    if(n<1) return { k:'soon', t:'Starts '+a.meta.start, n:n };
    if(n<=7) return { k:'warm', t:'Warm-up · day '+n+'/7', n:n };
    if(n<=12) return { k:'feed', t:'Feed photos · day '+n+'/12', n:n };
    return { k:'reels', t:'Reels · '+reelTarget(n)+'/day'+(n-12<=6?' (ramp day '+(n-12)+')':''), n:n };
  }
  /* what is due on this account on this business day → [{ k, label, target, done }] */
  function plan(a, date){
    date=date||today(); var n=dayN(a, date), lg=(a.meta.log||{})[date]||{}, out=[];
    if(DEAD[a.status] || n<1) return out;
    function it(k, label, target){ out.push({ k:k, label:label, target:target, done:Math.min(target, +lg[k]||0) }); }
    if(n===2 || (n>2 && n<=12 && !everDone(a,'pfp'))) it('pfp', n===2?'Add the profile picture':'Profile picture (missed on day 2)', 1);
    if(n<=7) it('scroll', n<=2?'Scroll 15 min':'Scroll 15 min — like, comment, open profiles', 1);
    else if(n<=12) it('feed', 'Post 1 feed photo (from the model\'s Drive)', 1);
    else it('reels', 'Post reels', reelTarget(n));
    var tr=a.meta.trial||null;
    if(tr && +tr.allowed>0 && n>12) it('trial', 'Trial reels (set by the managers)', +tr.allowed);
    return out;
  }
  function planTotals(list){ var t=0, d=0; list.forEach(function(x){ t+=x.target; d+=x.done; }); return { t:t, d:d }; }

  /* ── pre-flight (per phone, per shift) ── */
  function sessKey(){ return vaKeyOf(me()); }
  function pfList(p, date){ return (((p.meta||{}).pf||{})[date||today()]||[]).slice(); }
  function pfOk(x){ return x && x.maps && x.ip && x.scam && x.mgr && x.okMaps && x.okIp && x.okScam && +x.fraud>=0 && +x.fraud<=FRAUD_MAX && x.review!=='bad'; }
  /* the latest pre-flight on this phone this shift (anyone's — two VAs on one phone share the check) */
  function pfNow(p){ var k=sessKey(), L=pfList(p).filter(function(x){ return x.sess===k; }); return L.length?L[L.length-1]:null; }
  function phoneOpen(p){ if(isOwner()) return true; var x=pfNow(p); return !!(x && pfOk(x)); }
  function setupDone(p, upto){ var s=(p.meta&&p.meta.setup)||{}; for(var i=0;i<(upto||SETUP.length);i++) if(!s[i]) return false; return true; }
  function fmtT(iso){ try{ return new Date(iso).toLocaleTimeString('en-US',{ timeZone:'Asia/Manila', hour:'numeric', minute:'2-digit' }); }catch(e){ return ''; } }

  /* ── writes ── */
  async function upd(id, q, okMsg){
    try{
      var d=await jFetch(API+'?action=pa_update&id='+encodeURIComponent(id)+Object.keys(q).map(function(k){ return '&'+k+'='+encodeURIComponent(q[k]); }).join('')+'&_='+Date.now(), 1);
      if(d&&d.ok){ if(okMsg) toast(okMsg); return true; }
      toast('Could not save — '+((d&&d.error)||'try again')+'.'); return false;
    }catch(e){ toast('Connection error — nothing was saved.'); return false; }
  }
  /* read-modify-write of one row's meta, on the freshest copy */
  async function patchMeta(id, fn, extra, okMsg){
    await load(); var r=rowById(id); if(!r) { toast('That entry is gone — refresh.'); return false; }
    var m=JSON.parse(JSON.stringify(r.meta||{})); var res=fn(m, r); if(res===false) return false;
    var q=Object.assign({ meta:JSON.stringify(m) }, extra||{});
    var ok=await upd(id, q, okMsg); if(ok){ r.meta=m; Object.keys(extra||{}).forEach(function(k){ r[k]=extra[k]; }); cacheRows(); paint(); setTimeout(load, 1500); }
    return ok;
  }
  function lockKey(id){ return 'b_'+id; }
  async function guarded(id, fn){ if(S.busy[lockKey(id)]) return; S.busy[lockKey(id)]=1; try{ return await fn(); } finally{ delete S.busy[lockKey(id)]; } }

  /* phones */
  async function addPhone(){
    var lab=($('ima-pl').value||'').trim(), mdl=($('ima-pm').value||'').trim(), px=($('ima-px').value||'').trim(), co=($('ima-pc').value||'').trim();
    if(!lab){ toast('Name the phone (e.g. IMA-07).'); return; } if(!mdl){ toast('Which model is this phone for?'); return; }
    if(phones().some(function(p){ return phoneLabel(p).toLowerCase()===lab.toLowerCase(); })){ toast('There is already a phone called '+lab+'.'); return; }
    if(!(await linkGate(CL(), 'Adding a phone'))) return;
    try{
      var meta={ kind:'phone', proxy:px, coords:co, setup:{}, pf:{} };
      var d=await jFetch(API+'?action=pa_add&project='+encodeURIComponent(PROJECT)+'&handle='+encodeURIComponent('phone:'+lab)+'&model='+encodeURIComponent(mdl)+'&status=setup&meta='+encodeURIComponent(JSON.stringify(meta))+'&employee_id='+encodeURIComponent(me())+'&_='+Date.now(), 0);
      if(d&&d.ok){ ['ima-pl','ima-pm','ima-px','ima-pc'].forEach(function(k){ if($(k)) $(k).value=''; }); S.addPhone=false; toast('Phone '+lab+' added — work through its setup checklist.'); S.view='phones'; load(); }
      else toast(d&&d.error==='DUPLICATE'?'That phone already exists.':'Could not add the phone.');
    }catch(e){ toast('Connection error.'); }
  }
  async function setupTick(pid, i){
    var p=rowById(pid); if(!p) return; var s=(p.meta.setup||{});
    if(s[i]){ if(!confirm('Untick "'+SETUP[i]+'"?')) return; return guarded(pid, function(){ return patchMeta(pid, function(m){ m.setup=m.setup||{}; delete m.setup[i]; }, null, 'Unticked.'); }); }
    for(var j=0;j<i;j++) if(!s[j]){ toast('Do the steps in order — step '+(j+1)+' first.'); return; }
    if(!(await linkGate(CL(), 'The setup checklist'))) return;
    var last=(i===SETUP.length-1);
    if(last){ try{ await bump(PROJECT, T.phone, 1); }catch(e){ return; } }   // proof before the phone is marked Ready
    await guarded(pid, function(){ return patchMeta(pid, function(m){ m.setup=m.setup||{}; m.setup[i]={ at:new Date().toISOString(), by:me() }; }, last?{ status:'ready' }:null, last?'Phone set up — Ready. +1 '+T.phone:'Step '+(i+1)+' ticked.'); });
  }
  async function phoneNote(pid, field){
    var p=rowById(pid); if(!p) return; var cur=String((p.meta||{})[field]||'');
    var v=prompt(field==='proxy'?'Proxy for this phone (as written in Airtable):':'Coordinates for that proxy:', cur); if(v===null) return;
    await guarded(pid, function(){ return patchMeta(pid, function(m){ m[field]=String(v).trim(); }, null, 'Saved.'); });
  }

  /* accounts */
  async function addAcct(pid){
    var p=rowById(pid); if(!p) return;
    var h=(($('ima-ah-'+pid)||{}).value||'').trim().replace(/^@+/,''), st=(($('ima-ad-'+pid)||{}).value||'').trim()||today();
    if(!h){ toast('Type the Instagram username.'); return; }
    if(!setupDone(p, VERIFY_STEPS)){ toast('Finish setup steps 1–7 on '+phoneLabel(p)+' first — accounts are created only on a verified phone.'); return; }
    if(acctsOf(pid).length>=MAX_ACCTS){ toast(phoneLabel(p)+' already has '+MAX_ACCTS+' accounts — one phone, one model, three accounts.'); return; }
    if(!phoneOpen(p)){ toast('Log this session\'s pre-flight on '+phoneLabel(p)+' first.'); preflightOpen(pid); return; }
    if(!(await linkGate(CL(), 'Adding an account'))) return;
    var isNew=(st===today());
    if(isNew){ try{ await bump(PROJECT, T.create, 1); }catch(e){ return; } }
    try{
      var meta={ kind:'acct', phone:pid, start:st, log:{} };
      if(isNew) meta.log[st]={ by:me(), t:new Date().toISOString(), create:1 };
      var d=await jFetch(API+'?action=pa_add&project='+encodeURIComponent(PROJECT)+'&handle='+encodeURIComponent('@'+h)+'&model='+encodeURIComponent(p.model||'')+'&status=active&meta='+encodeURIComponent(JSON.stringify(meta))+'&employee_id='+encodeURIComponent(me())+'&_='+Date.now(), 0);
      if(d&&d.ok){ toast('@'+h+' added on '+phoneLabel(p)+(isNew?' — day 1. +1 '+T.create:' — started '+st+'.')); load(); }
      else toast(d&&d.error==='DUPLICATE'?'@'+h+' is already in the tool.':'Could not add the account.');
    }catch(e){ toast('Connection error.'); }
  }
  async function logTask(aid, k){
    var a=rowById(aid); if(!a) return; var p=rowById(a.meta.phone);
    if(p && !phoneOpen(p)){ toast('Log this session\'s pre-flight on '+phoneLabel(p)+' before working its accounts.'); preflightOpen(p.id); return; }
    var it=plan(a).filter(function(x){ return x.k===k; })[0];
    if(!it){ toast('That isn\'t due today on @'+String(a.handle).replace(/^@/,'')+' — the SOP calendar doesn\'t allow it yet.'); return; }
    if(it.done>=it.target){ toast('Today\'s '+(k==='reels'?'reels are':'step is')+' already done on '+a.handle+' — nothing ahead of the schedule.'); return; }
    if(!(await linkGate(CL(), 'Logging work'))) return;
    try{ await bump(PROJECT, T[k], 1); }catch(e){ return; }
    await guarded(aid, function(){ return patchMeta(aid, function(m){
      var d=today(); m.log=m.log||{}; var L=m.log[d]=m.log[d]||{};
      L[k]=(+L[k]||0)+1; L.by=L.by||me(); if(!L.t) L.t=new Date().toISOString();
      L.who=L.who||{}; L.who[me()]=(+L.who[me()]||0)+1;
      Object.keys(m.log).sort().slice(0,-45).forEach(function(old){ delete m.log[old]; });   // keep ~6 weeks
    }, null, '+1 '+T[k]+' · '+a.handle); });
    try{ snap(); }catch(_s){}
  }
  async function setStatus(aid, st){
    var a=rowById(aid); if(!a) return;
    var lbl={ active:'Active', restricted:'Restricted', banned:'Banned', hold:'On hold' }[st];
    if(st==='banned' && !confirm('Mark '+a.handle+' as BANNED?')) return;
    if(!(await linkGate(CL(), 'Changing an account'))) return;
    await guarded(aid, function(){ return patchMeta(aid, function(m){ m.hist=(m.hist||[]).slice(-19); m.hist.push({ at:new Date().toISOString(), by:me(), to:st }); }, { status:st }, a.handle+' → '+lbl); });
  }
  async function trialUnlocked(aid){
    var a=rowById(aid); if(!a) return;
    if(dayN(a)<=12){ toast('Trial reels come after the feed-photo days.'); return; }
    if(!(await linkGate(CL(), 'Reporting trial reels'))) return;
    await guarded(aid, function(){ return patchMeta(aid, function(m){ if(m.trial) return false; m.trial={ at:new Date().toISOString(), by:me(), allowed:null }; }, null, 'Flagged — the managers decide how many trial reels '+a.handle+' runs. Don\'t start them yet.'); });
  }
  async function trialSet(aid){
    if(!isOwner()) return; var a=rowById(aid); if(!a) return;
    var cur=(a.meta.trial&&a.meta.trial.allowed)||'';
    var v=prompt('How many trial reels a day should '+a.handle+' run? (0 = none for now)', cur); if(v===null) return;
    var n=Math.max(0, Math.min(10, parseInt(v,10)||0));
    await guarded(aid, function(){ return patchMeta(aid, function(m){ m.trial=m.trial||{ at:new Date().toISOString(), by:'owner' }; m.trial.allowed=n; m.trial.set_at=new Date().toISOString(); }, null, a.handle+': '+n+' trial reel'+(n===1?'':'s')+' a day.'); });
  }
  async function reassign(id){
    if(!isOwner()) return; var r=rowById(id); if(!r) return;
    var v=prompt('Assign '+(r.meta.kind==='phone'?phoneLabel(r):r.handle)+' to which VA? (Employee ID, e.g. JMB021)', String(r.assigned_to||'')); if(!v) return;
    v=String(v).trim().toUpperCase(); if(!/^JMB\d{3}$/.test(v)){ toast('Use an Employee ID like JMB021.'); return; }
    var list=[r]; if(r.meta.kind==='phone') list=list.concat(acctsOf(r.id));
    for(var i=0;i<list.length;i++) await upd(list[i].id, { assigned_to:v }, null);
    toast('Assigned to '+vaName(v)+'.'); load();
  }
  async function del(id){
    var r=rowById(id); if(!r) return;
    var nm=r.meta.kind==='phone'?phoneLabel(r):r.handle;
    if(r.meta.kind==='phone' && acctsOf(id).length){ toast('Move or delete the accounts on '+nm+' first.'); return; }
    if(!confirm('DELETE '+nm+' from the tool?\n\nOnly for wrong entries. Outputs already counted are not affected.')) return;
    try{
      var d=await jFetch(API+'?action=pa_delete&id='+encodeURIComponent(id)+'&employee_id='+encodeURIComponent(isOwner()?'admin':me())+'&_='+Date.now(), 0);
      if(d&&d.ok){ toast('Deleted.'); load(); } else if(d&&d.error==='NOT_YOURS') toast('Only the VA who added it (or the owner) can delete it.'); else toast('Could not delete.');
    }catch(e){ toast('Connection error.'); }
  }

  /* ── pre-flight box: three screenshots + fraud score + the manager's go-ahead ── */
  var PF={ pid:null, shots:{ maps:null, ip:null, scam:null, mgr:null }, slot:null };
  function pfBox(){
    var ov=$('ima-pf'); if(ov) return ov;
    ov=document.createElement('div'); ov.id='ima-pf'; ov.className='ima-ov';
    document.body.appendChild(ov);
    document.addEventListener('paste', function(ev){
      if(!$('ima-pf') || $('ima-pf').style.display!=='flex' || !PF.slot) return;
      var items=(ev.clipboardData&&ev.clipboardData.items)||[];
      for(var i=0;i<items.length;i++){ if(items[i].type.indexOf('image')===0){ var f=items[i].getAsFile(); if(f){ ev.preventDefault(); pfFile(PF.slot, f); return; } } }
    });
    return ov;
  }
  function pfSlotHtml(k, title, hint){
    var d=PF.shots[k];
    return '<div class="pfslot'+(d?' on':'')+(PF.slot===k?' sel':'')+'" onclick="IMA.pfPick(\''+k+'\')">'+
      (d?'<img src="'+d+'" alt="">':'<div class="ph">＋</div>')+
      '<div class="cap"><b>'+title+'</b><small>'+hint+'</small></div>'+
      '<div class="act"><button onclick="event.stopPropagation();IMA.pfCap(\''+k+'\')" title="Capture a window">📷</button><button onclick="event.stopPropagation();IMA.pfAttach(\''+k+'\')" title="Attach a file">📎</button>'+(d?'<button onclick="event.stopPropagation();IMA.pfClear(\''+k+'\')" title="Remove">✕</button>':'')+'</div></div>';
  }
  function pfPaint(){
    var ov=$('ima-pf'); if(!ov) return; var p=rowById(PF.pid); if(!p) return;
    var fr=($('ima-pf-fr')||{}).value; fr=(fr===undefined)?'':fr;
    var keep=function(id){ var e=$(id); return e?e.checked:false; };
    var st={ m:keep('ima-ok-m'), i:keep('ima-ok-i'), s:keep('ima-ok-s'), g:keep('ima-ok-g') };
    ov.innerHTML='<div class="ima-box">'+
      '<div class="ima-bh"><div><div class="eb">Pre-flight · '+esc(phoneLabel(p))+' · '+esc(p.model||'')+'</div><h3>Log this session\'s pre-flight</h3>'+
        '<p>Before Instagram is opened on this phone: a screenshot of each check, the fraud score, and the manager\'s go-ahead from the group. Click a box, then 📷 capture, 📎 attach or Ctrl+V paste.</p></div>'+
        '<button class="x" onclick="IMA.pfClose()">✕</button></div>'+
      '<div class="pfgrid">'+pfSlotHtml('maps','1 · Maps','location on the phone')+pfSlotHtml('ip','2 · IP','whatismyipaddress.com')+pfSlotHtml('scam','3 · Scamalytics','fraud score + location')+'</div>'+
      '<div class="pfrow"><label>Fraud score <input id="ima-pf-fr" type="number" min="0" max="100" step="1" inputmode="numeric" value="'+esc(fr)+'" oninput="IMA.pfRule()"></label><span id="ima-pf-rule" class="rule"></span></div>'+
      '<div class="pfchk">'+
        '<label><input type="checkbox" id="ima-ok-m"'+(st.m?' checked':'')+' onchange="IMA.pfRule()"> Maps shows the right location</label>'+
        '<label><input type="checkbox" id="ima-ok-i"'+(st.i?' checked':'')+' onchange="IMA.pfRule()"> The IP is in the right location</label>'+
        '<label><input type="checkbox" id="ima-ok-s"'+(st.s?' checked':'')+' onchange="IMA.pfRule()"> Scamalytics shows the right location</label>'+
        '<label class="mg"><input type="checkbox" id="ima-ok-g"'+(st.g?' checked':'')+' onchange="IMA.pfRule()"> A manager confirmed it\'s good to go in the group</label></div>'+
      '<div class="pfmgr">'+pfSlotHtml('mgr','Manager\'s go-ahead','optional · screenshot of the reply')+'<input id="ima-pf-who" placeholder="Manager\'s name (optional)" value="'+esc(($('ima-pf-who')||{}).value||'')+'"></div>'+
      '<div class="ima-bf"><span id="ima-pf-st" class="muted"></span><button class="btn sec" onclick="IMA.pfClose()">Cancel</button><button class="btn" id="ima-pf-go" onclick="IMA.pfSave()">Save pre-flight</button></div></div>';
    pfRule();
  }
  function pfRule(){

  function qaRows(date){
    var who={};
    phones().forEach(function(p){ pfList(p, date).forEach(function(x){ var k=String(x.by||'').toUpperCase(); if(k) (who[k]=who[k]||{ pf:[], worked:{}, tasks:0 }).pf.push({ p:p, x:x }); }); });
    accts().forEach(function(a){ var L=(a.meta.log||{})[date]; if(!L) return; var by=L.who?Object.keys(L.who):(L.by?[String(L.by).toUpperCase()]:[]);
      by.forEach(function(k){ k=String(k).toUpperCase(); var w=(who[k]=who[k]||{ pf:[], worked:{}, tasks:0 }); var pid=a.meta.phone, W=(w.worked[pid]=w.worked[pid]||{ first:L.t, accts:[] }); W.accts.push(a); if(L.t && (!W.first || L.t<W.first)) W.first=L.t; w.tasks+=(L.who?(+L.who[k]||0):1); }); });
    return Object.keys(who).sort().map(function(k){
      var w=who[k], issues=[], score=10;
      var pfDone=w.pf.length, pfClean=w.pf.filter(function(o){ return pfOk(o.x); }).length;
      var stop=w.pf.filter(function(o){ return !(+o.x.fraud<=FRAUD_MAX) || !(o.x.okMaps&&o.x.okIp&&o.x.okScam); }).length;
      var rej=w.pf.filter(function(o){ return o.x.review==='bad'; }).length;
      var noMgr=w.pf.filter(function(o){ return !o.x.mgr; }).length;
      var noPf=0, due=0, done=0;
      Object.keys(w.worked).forEach(function(pid){ var p=rowById(pid), first=w.worked[pid].first||'';
        var had=p && pfList(p, date).some(function(x){ return pfOk(x) && (!first || x.at<=first); });
        if(!had){ noPf++; issues.push('Worked '+(p?phoneLabel(p):'a phone')+' without a clean pre-flight first'); }
        acctsOf(pid).forEach(function(a){ var pt=planTotals(plan(a, date)); due+=pt.t; done+=pt.d; }); });
      if(rej) issues.push(rej+' pre-flight'+(rej>1?'s':'')+' marked not acceptable');
      if(noMgr) issues.push(noMgr+' pre-flight'+(noMgr>1?'s':'')+' without the manager\'s go-ahead');
      if(stop) issues.push(stop+' STOP (fraud above 3 or a mismatch) — correctly not opened');
      var miss=Math.max(0, due-done); if(miss) issues.push(miss+' planned step'+(miss>1?'s':'')+' not done (warm-up / feed / reels)');
      score-=3*noPf; score-=2*rej; score-=0.5*noMgr; score-=Math.min(3, 0.5*miss);
      score=Math.max(0, Math.min(10, Math.round(score*2)/2));
      return { emp:k, pfDone:pfDone, pfClean:pfClean, phones:Object.keys(w.worked).length, due:due, done:done, tasks:w.tasks, issues:issues, score:score, list:w.pf };
    });
  }

/* ═══════════ CLIENT: SKYVERN (Project 3 · individual) — daily Reddit account farming + karma (Jeth, Oct 10) ═══════════

     Stopping early counts nothing.

   An account is FARMED for the day when all three are done. The VA's farmed / active count is the board snapshot the
   portal's EOD check and the scorecard read. The tool only tracks the work — it never touches Reddit itself.
   Data: one pa_* row per account (project "Skyvern"), meta { kind:'acct', start, karma, mday, kh:{date:karma},
   log:{date:{ c, scroll, karma, by, t, who:{EMP:n} }}, hist:[…] }, status active / restricted / suspended / hold. */
var SKY=(function(){

  /* ── writes ── */
  async function upd(id, q, okMsg){
    try{
      var d=await jFetch(API+'?action=pa_update&id='+encodeURIComponent(id)+Object.keys(q).map(function(k){ return '&'+k+'='+encodeURIComponent(q[k]); }).join('')+'&_='+Date.now(), 1);

  async function patchMeta(id, fn, extra, okMsg){
    await load(); var r=rowById(id); if(!r){ toast('That account is gone — refresh.'); return false; }
    var m=JSON.parse(JSON.stringify(r.meta||{})); if(fn(m, r)===false) return false;
    var q=Object.assign({ meta:JSON.stringify(m) }, extra||{});
    var ok=await upd(id, q, okMsg); if(ok){ r.meta=m; Object.keys(extra||{}).forEach(function(k){ r[k]=extra[k]; }); cacheRows(); paint(); setTimeout(load, 1500); }

  async function guarded(id, fn){ var k='b_'+id; if(S.busy[k]) return; S.busy[k]=1; try{ return await fn(); } finally{ delete S.busy[k]; } }
  function logStep(m, key, val){
    var d=today(); m.log=m.log||{}; var L=m.log[d]=m.log[d]||{};
    if(key==='c') L.c=(+L.c||0)+1; else L[key]=val;
    L.by=L.by||me(); if(!L.t) L.t=new Date().toISOString(); L.who=L.who||{}; L.who[me()]=(+L.who[me()]||0)+1;
    Object.keys(m.log).sort().slice(0,-60).forEach(function(old){ delete m.log[old]; });
  }
  async function add(){
    var h=String(($('sky-h')||{}).value||'').trim().replace(/^\/?u\//i,'').replace(/^@/,''), k0=String(($('sky-k0')||{}).value||'').trim();
    if(!h){ toast('Type the Reddit username.'); return; }
    if(!/^[A-Za-z0-9_-]{3,20}$/.test(h)){ toast('Reddit usernames are 3–20 letters, numbers, - or _.'); return; }
    if(accts().some(function(r){ return String(r.handle||'').replace(/^u\//i,'').toLowerCase()===h.toLowerCase(); })){ toast('u/'+h+' is already in Skyvern — search first.'); return; }
    var kv=null; if(k0!==''){ kv=parseInt(k0.replace(/[^0-9-]/g,''),10); if(isNaN(kv)){ toast('Karma: numbers only.'); return; } }
    if(!(await linkGate(CL(), 'Adding an account'))) return;
    var meta={ kind:'acct', start:today(), kh:{}, log:{} }; if(kv!==null){ meta.karma=kv; meta.kh[today()]=kv; }
    try{
      var d=await jFetch(API+'?action=pa_add&project='+encodeURIComponent(PROJECT)+'&handle='+encodeURIComponent(h)+'&model='+encodeURIComponent('Reddit')+'&status=active&meta='+encodeURIComponent(JSON.stringify(meta))+'&employee_id='+encodeURIComponent(USER.id)+'&_='+Date.now(), 0);
      if(d&&d.ok){ if($('sky-h')) $('sky-h').value=''; if($('sky-k0')) $('sky-k0').value=''; toast('u/'+h+' added — it\'s on today\'s farming list.'); load(); }
      else toast(d&&d.error==='DUPLICATE'?'u/'+h+' is already in Skyvern.':'Could not add the account.');
    }catch(e){ toast('Connection error.'); }

  async function comment(id){
    var r=rowById(id); if(!r) return;
    if(!active(r)){ toast(handle(r)+' is not active — nothing to farm.'); return; }
    if(stepState(r).c>=NEED.c){ toast('3 comments are done on '+handle(r)+' today.'); return; }
    if(!(await linkGate(CL(), 'Logging a comment'))) return;
    try{ await bump(PROJECT, T.comment, 1); }catch(e){ return; }
    await guarded(id, function(){ return patchMeta(id, function(m){ var L=(m.log||{})[today()]||{}; if((+L.c||0)>=NEED.c) return false; logStep(m, 'c'); }, null, '+1 comment · '+handle(r)); });
  }
  /* ── the 5-minute scroll ── */
  function runKey(){ return 'sky_run_'+me(); }
  function runSave(){ try{ if(S.run) localStorage.setItem(runKey(), JSON.stringify(S.run)); else localStorage.removeItem(runKey()); }catch(e){} }
  function runRestore(){ try{ var x=JSON.parse(localStorage.getItem(runKey())||'null'); if(x && x.id && x.ends && Date.now()-x.ends<6*3600e3) S.run=x; }catch(e){} if(S.run) runTick(); }
  function runTick(){
    if(S.tick) return;
    S.tick=setInterval(function(){
      if(!S.run){ clearInterval(S.tick); S.tick=null; return; }
      var left=S.run.ends-Date.now();
      try{ if(left>0 && !document.hidden){ ACT.last=Date.now(); } }catch(e){}   // a running scroll is work in this tool (the portal's 10-minute rule)
      var c=$('sky-run-clk'), a=$('sky-run-arc');
      if(left<=0){ if(!S.run.rang){ S.run.rang=1; runSave(); try{ toast('5 minutes done on '+(rowById(S.run.id)?handle(rowById(S.run.id)):'the account')+' — attach a screenshot to count it.'); }catch(e){} try{ if(window.PFX && PFX.chime) PFX.chime(0.08); }catch(e){} }
        var rb=$('sky-run'); if($('sky-runbox') && (!rb || !rb.classList.contains('done'))){ $('sky-runbox').innerHTML=runBanner(); paintList(); } return; }
      if(c) c.textContent=clock(left)+' left · keep scrolling on this account';
      if(a) a.style.strokeDashoffset=(119.4*(left/SCROLL_MS)).toFixed(1);
    }, 1000);
  }
  async function scrollStart(id){
    var r=rowById(id); if(!r) return;
    if(!active(r)){ toast(handle(r)+' is not active.'); return; }
    if(stepState(r).scroll){ toast('Today\'s scroll is already done on '+handle(r)+'.'); return; }
    if(S.run){ var o=rowById(S.run.id); toast('Finish the scroll on '+(o?handle(o):'the other account')+' first — one at a time.'); return; }
    if(!(await linkGate(CL(), 'Starting a scroll'))) return;
    S.run={ id:id, start:Date.now(), ends:Date.now()+SCROLL_MS }; runSave(); runTick();
    toast('Scroll started on '+handle(r)+' — 5 minutes.'); paint();
  }
  function scrollStop(){
    if(!S.run) return;
    if(S.run.ends>Date.now() && !confirm('Stop the scroll now? It won\'t count — the full 5 minutes are needed.')) return;
    S.run=null; runSave(); paint();
  }
  async function scrollFinish(){
    var R=S.run; if(!R) return; if(R.ends>Date.now()){ toast('Keep going — '+clock(R.ends-Date.now())+' left.'); return; }
    var r=rowById(R.id); if(!r){ S.run=null; runSave(); paint(); return; }
    try{ await bump(PROJECT, T.scroll, 1); }catch(e){ return; }
    S.run=null; runSave();
    await guarded(R.id, function(){ return patchMeta(R.id, function(m){ var L=(m.log||{})[today()]||{}; if(L.scroll) return false; logStep(m, 'scroll', 1); }, null, '5-minute scroll counted · '+handle(r)); });
    paint();
  }
  /* ── karma ── */
  function karmaEdit(id){ S.kEdit=id||''; paint(); var e=id&&$('sky-k-'+id); if(e) try{ e.focus(); }catch(_e){} }
  async function karmaSave(id){
    var r=rowById(id); if(!r) return; var e=$('sky-k-'+id), raw=String((e&&e.value)||'').trim();
    if(raw===''){ toast('Type the karma the profile shows right now.'); return; }

    var prev=karmaNow(r);
    if(prev!==null && prev-v>200 && !confirm('Karma drops from '+prev+' to '+v+' — is that right?')) return;
    if(!(await linkGate(CL(), 'Updating karma'))) return;
    var fix=stepState(r).karma;   // already logged today → a correction, counted once only
    if(!fix){ try{ await bump(PROJECT, T.karma, 1); }catch(e2){ return; } }
    S.kEdit='';
    await guarded(id, function(){ return patchMeta(id, function(m){
      var d=today(); m.karma=v; m.mday=d; m.kh=m.kh||{}; m.kh[d]=v;

      if(fix){ var L=(m.log||{})[d]; if(L) L.karma=v; } else logStep(m, 'karma', v);
    }, null, (fix?'Karma corrected to ':'Karma ')+fmt(v)+(fix?'':' saved')+' · '+handle(r)); });
  }
  async function setStatus(id, st){
    var r=rowById(id); if(!r) return;

    try{
      var d=await jFetch(API+'?action=pa_delete&id='+encodeURIComponent(id)+'&employee_id='+encodeURIComponent(isOwner()?'admin':USER.id)+'&_='+Date.now(), 0);
      if(d&&d.ok){ toast('Deleted.'); if(S.run && S.run.id===id){ S.run=null; runSave(); } load(); }

      else toast('Could not delete: '+((d&&d.error)||'error'));
    }catch(e){ toast('Connection error.'); }
  }
  return { id:'skyvern', S:S, T:T, load:load, render:render, paint:paint, paintCached:paintCached, owners:owners, runRestore:runRestore,
           setFilter:setFilter, setView:setView, setQ:setQ, add:add, comment:comment, scrollStart:scrollStart, scrollStop:scrollStop, scrollFinish:scrollFinish,
           karmaEdit:karmaEdit, karmaSave:karmaSave, setStatus:setStatus, del:del,
           _t:{ farmed:farmed, stepState:stepState, gain:gain, todayGain:todayGain, karmaOn:karmaOn, dshift:dshift, spark:spark } };
})();

/* ═══════════ THE HUB — tabs, who sees what, Team ═══════════ */
var HUB=(function(){
  var MODS={ 'design-shopify':DS, 'imperium':IMA, 'ember':EM, 'skyvern':SKY };
  function loadAll(){ Object.keys(MODS).forEach(function(k){ try{ MODS[k].load(); }catch(e){} }); }
  /* WHO IS ON A CLIENT = THE WORKLOG (Jeth, Oct 9: "just based on the worklog") — anyone who tracked time on that
     client's project in the last WL_DAYS days. Nothing is added by hand. The project names come from the portal's
     own project list (anything matching the client), so "Imperium IG Reels" counts for Imperium. Also on the client:
     whoever owns cards on its board, and whoever's portal timer is running on it right now (a brand-new VA). */
  var WL_DAYS=60;
  var S={ view:'', ready:false, wl:{}, wlProj:{}, wlLoaded:false, wlAt:0 };
  function norm(id){ return String(id||'').trim().toUpperCase(); }
  function wlList(cid){ return (S.wl[cid]||[]).slice(); }
  function autoList(cid){ var m=MODS[cid]; return (m && m.owners)?m.owners().map(norm):[]; }
  function membersOf(cid){ var o={}; wlList(cid).concat(autoList(cid)).forEach(function(x){ o[x]=1; }); return Object.keys(o); }
  /* a VA is on a client when Jeth added them (Team), they own cards on its board, or their timer runs on it now */
  function myClients(){
    if(isOwner()) return CLIENTS.slice();
    var me=myId(), t=LINK.me && String(LINK.me.status||'')==='working' ? clientOfTask(LINK.me.task) : null;
    return CLIENTS.filter(function(c){ return membersOf(c.id).indexOf(me)>=0 || (t && t.id===c.id); });
  }
  function cur(){ return clientById(S.view); }
  function canSee(id){ if(id==='team') return isOwner(); return myClients().some(function(c){ return c.id===id; }); }
  function pick(id, quiet){
    if(!canSee(id)) return;
    S.view=id;
    try{ localStorage.setItem('hub_last_'+myId(), id); var u=new URL(location.href); u.searchParams.set('c', id); history.replaceState(null,'',u.toString()); }catch(e){}
    renderTabs(); renderMain();
    if(!quiet) try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(e){}
    try{ tbSend(true); linkAfter(); }catch(e){}
  }
  function initialView(){
    var want=''; try{ want=new URL(location.href).searchParams.get('c')||''; }catch(e){}
    if(want && canSee(want)) return want;
    var last=''; try{ last=localStorage.getItem('hub_last_'+myId())||''; }catch(e){}
    if(last && canSee(last)) return last;
    var mine=myClients();
    var t=LINK.me && clientOfTask(LINK.me.task); if(t && canSee(t.id)) return t.id;
    var live=mine.filter(function(c){ return c.live; });
    return (live[0]||mine[0]||{}).id||(isOwner()?'team':'');
  }
  function renderMe(){
    var el=$('me'); if(!el || !USER) return;
    el.innerHTML=avatar(USER.id,'av')+'<span>'+esc(USER.name||USER.id)+'</span>'+(isOwner()?'<em>Owner</em>':'')+'<button onclick="signOut()">Sign out</button>';
  }
  function renderTabs(){
    var nav=$('ctabs'); if(!nav) return;
    var list=myClients();
    var h=list.map(function(c){
      var n=membersOf(c.id).length;
      return '<button class="ct'+(S.view===c.id?' on':'')+'" style="--g:'+c.g+';--c:'+c.c+'" onclick="HUB.pick(\''+c.id+'\')">'+
        '<span class="ic">'+IC[c.icon]+'</span><span class="tx"><b>'+esc(c.name)+'</b><small>'+esc(c.kind)+(isOwner()&&n?' · '+n+' VA'+(n===1?'':'s'):'')+'</small></span>'+(c.live?'':'<span class="soon">Soon</span>')+'</button>';
    }).join('');
    if(isOwner()) h+='<button class="ct gear'+(S.view==='team'?' on':'')+'" style="--g:linear-gradient(135deg,#64748b,#334155);--c:#475569" onclick="HUB.pick(\'team\')"><span class="ic">'+IC.gear+'</span><span class="tx"><b>Team</b><small>who is on which client</small></span></button>';
    nav.innerHTML=h;
  }
  function memberChips(cid){
    var M=membersOf(cid); if(!M.length) return '<span class="chip">No VAs yet</span>';
    return '<span class="chip"><span style="display:inline-flex">'+M.slice(0,5).map(function(id,i){ var k=id.toLowerCase(), p=PHOTOOF[k];
      return '<span style="width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;background:var(--g);color:#fff;font:800 7.5px Sora,sans-serif;border:1.5px solid #fff;margin-left:'+(i?'-5px':'0')+'">'+(p?'<img src="'+esc(p)+'" alt="" style="width:100%;height:100%;object-fit:cover">':esc(initials(vaName(id))))+'</span>'; }).join('')+
      '</span>'+M.length+' VA'+(M.length===1?'':'s')+'</span>';
  }
  function renderMain(){
    var main=$('main'); if(!main) return;
    if(!S.ready){ main.innerHTML='<div class="card empty"><div class="big" style="--g:var(--grad)">'+IC.hub+'</div><h3>Opening your client…</h3><p>Loading the boards and your access.</p></div>'; return; }
    if(S.view==='team') return renderTeam(main);
    var c=cur();
    if(!c){
      main.innerHTML='<div class="card empty"><div class="big" style="--g:var(--grad)">'+IC.hub+'</div><h3>You\'re not on a client here yet</h3>'+
        '<p>The Client Hub holds the tools for our smaller clients — '+CLIENTS.map(function(x){ return '<b>'+esc(x.name)+'</b>'; }).join(', ')+'. '+
        'Your client\'s tab appears once you\'ve tracked time on that client\'s project in the portal — or right away while your portal timer runs on it.</p>'+
        '<p style="margin-top:14px"><button class="btn sec" onclick="linkLoad(true).then(function(){ HUB.boot(true); })">Check again</button></p></div>';
      return;
    }
    var h='<div class="pane" style="--g:'+c.g+';--c:'+c.c+'">'+
      '<div class="phead"><div><h2><em>'+esc(c.name)+'</em></h2><div class="chips"><span class="chip"><i></i>'+esc(c.client)+'</span><span class="chip">'+esc(c.kind)+'</span>'+(isOwner()?memberChips(c.id):'')+(c.live?'':'<span class="chip" style="color:#a16207">Waiting for the SOP</span>')+'</div></div></div>'+
      '<div id="linkbox">'+linkBanner(c)+'</div><div id="cbody"></div></div>';
    main.innerHTML=h;
    var body=$('cbody');
    if(c.live && MODS[c.id]) MODS[c.id].render(body);
    else body.innerHTML='<div class="card empty"><div class="big">'+IC.wait+'</div><h3>'+esc(c.name)+' — '+esc(c.kind)+'</h3>'+
      (isOwner()
        ?'<p>This tab is ready — VAs who track time on '+esc(c.project)+' already land here (from the worklog). The tool itself gets built from the '+esc(c.name)+' SOP — send it over and it goes live right here, same link.</p><p style="margin-top:14px"><button class="btn sec" onclick="HUB.pick(\'team\')">Open Team</button></p>'
        :'<p>Your '+esc(c.name)+' tool is being built from the SOP and will open right here, same link. Until then, keep following your current process.</p>')+'</div>';
  }
  function repaint(){ renderTabs(); var c=cur(); if(c && c.live && MODS[c.id] && $('cbody') && $('cbody').firstChild && MODS[c.id].paint) MODS[c.id].paint(); else renderMain(); renderMe(); }
  function repaintLink(){ var b=$('linkbox'), c=cur(); if(b && c) b.innerHTML=linkBanner(c); }
  function onData(cid){
    if(!S.ready) return;
    if(S.view===cid && $('cbody') && $('cbody').firstChild){ MODS[cid].paint(); renderTabs(); }
    else if(!cur() && !isOwner()){ var v=initialView(); if(v) pick(v, true); else renderTabs(); }
    else renderTabs();
  }
  /* the worklog: the portal's project list → the names that belong to each client → who logged time on them */
  function ymd(d){ return new Intl.DateTimeFormat('en-CA',{ timeZone:'Asia/Manila' }).format(d); }
  async function loadTeams(force){
    if(!force && S.wlLoaded && Date.now()-S.wlAt<10*60000) return;
    try{
      var c=JSON.parse(sessionStorage.getItem('hub_wl')||'null');
      if(!force && c && c.at && Date.now()-c.at<10*60000){ S.wl=c.wl||{}; S.wlProj=c.proj||{}; S.wlLoaded=true; S.wlAt=c.at; return; }
    }catch(e){}
    try{
      var tp=await jFetch(API+'?action=get_tracker_projects&_='+Date.now(), 1), names={};
      ((tp&&tp.projects)||[]).forEach(function(p){ var n=String(p.project||'').trim(); if(n) names[n]=1; });
      var from=ymd(new Date(Date.now()-WL_DAYS*864e5)), wl={}, proj={}, jobs=[];
      CLIENTS.forEach(function(c){
        var mine=Object.keys(names).filter(function(n){ return c.match.test(n); });
        if(!mine.length) mine=[c.project];                                   // not in the list yet → try the plain name
        proj[c.id]=mine; wl[c.id]=[];
        mine.forEach(function(n){ jobs.push(jFetch(API+'?action=get_worklog&project='+encodeURIComponent(n)+'&from='+from+'&lean=1&_='+Date.now(), 1).then(function(d){
          ((d&&d.worklog)||[]).forEach(function(w){ var id=norm(w.employee_id); if(id && wl[c.id].indexOf(id)<0) wl[c.id].push(id); });
        }).catch(function(){})); });
      });
      await Promise.all(jobs);
      S.wl=wl; S.wlProj=proj; S.wlLoaded=true; S.wlAt=Date.now();
      try{ sessionStorage.setItem('hub_wl', JSON.stringify({ at:S.wlAt, wl:wl, proj:proj })); }catch(e){}
    }catch(e){}
  }
  function renderTeam(main){
    var link='https://internals.jmbvirtuals.com/clients.html';
    main.innerHTML='<div class="pane" style="--g:linear-gradient(135deg,#64748b,#334155);--c:#475569">'+
      '<div class="phead"><div><h2><em>Team</em></h2><div class="chips"><span class="chip">from the worklog · last '+WL_DAYS+' days</span><span class="chip">VAs only see their own client\'s tab</span></div></div></div>'+
      '<div class="card" style="padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><b style="font-size:13.5px">One link for every small-client VA</b><div class="muted" style="margin-top:3px">'+esc(link)+' — each VA lands on their own client, worked out from the worklog: anyone who tracked time on that client\'s project in the last '+WL_DAYS+' days. Nothing to add by hand.</div></div>'+
        '<button class="btn sm sec" onclick="HUB.refreshTeams()">Refresh</button><button class="btn sm sec" onclick="HUB.copyLink()">Copy link</button></div>'+
      '<div class="tm-grid">'+CLIENTS.map(function(c){
        var wl=wlList(c.id), auto=autoList(c.id);
        var chips=membersOf(c.id).map(function(id){
          var src=wl.indexOf(id)>=0?'worklog':(auto.indexOf(id)>=0?'on board':'');
          return '<span class="mc" title="'+esc(id)+'">'+avatar(id,'a')+esc(vaName(id))+(src?' <small>'+src+'</small>':'')+'</span>';
        }).join('');
        var pj=(S.wlProj[c.id]||[]).map(function(n){ return '<b>'+esc(n)+'</b>'; }).join(', ');
        return '<div class="card tm-c" style="--g:'+c.g+'"><div class="tm-h"><span class="ic">'+IC[c.icon]+'</span><div style="flex:1"><b>'+esc(c.name)+'</b><small>'+esc(c.kind)+' · '+(c.live?'live':'waiting for the SOP')+'</small></div>'+
          '<button class="btn sm sec" onclick="HUB.pick(\''+c.id+'\')">Open</button></div>'+
          '<div class="mem">'+(chips||'<span class="muted">Nobody has tracked time on it in the last '+WL_DAYS+' days.</span>')+'</div>'+
          '<div class="muted" style="margin-top:10px;font-size:11.5px">Worklog project'+((S.wlProj[c.id]||[]).length===1?'':'s')+': '+(pj||'—')+'</div></div>';
      }).join('')+'</div>'+
      (S.wlLoaded?'':'<p class="muted" style="margin-top:10px">Couldn\'t read the worklog just now — showing who is on the boards. Press Refresh to try again.</p>')+'</div>';
  }
  async function refreshTeams(){ toast('Reading the worklog…'); await loadTeams(true); renderTabs(); if(S.view==='team') renderTeam($('main')); toast('Team updated from the worklog.'); }
  function copyLink(){ var t='https://internals.jmbvirtuals.com/clients.html'; try{ navigator.clipboard.writeText(t).then(function(){ toast('Link copied.'); }, function(){ prompt('Copy the link:', t); }); }catch(e){ prompt('Copy the link:', t); } }
  /* first load: boards + team + the portal link together, then land on the right tab */
  async function boot(again){
    if(!again){ Object.keys(MODS).forEach(function(k){ try{ MODS[k].paintCached(); }catch(e){} }); renderTabs(); renderMain(); }
    var tasks=[loadTeams(again), linkLoad(true)].concat(Object.keys(MODS).map(function(k){ return MODS[k].load(); }));
    await Promise.race([Promise.all(tasks.map(function(p){ return p.catch?p.catch(function(){}):p; })), new Promise(function(r){ setTimeout(r, 15000); })]);
    S.ready=true;
    var v=(again||!S.view)?initialView():S.view; S.view=v||'';
    renderTabs(); renderMain();
    try{ linkAfter(); }catch(e){}
  }
  return { S:S, loadAll:loadAll, pick:pick, cur:cur, myClients:myClients, membersOf:membersOf, repaint:repaint, repaintLink:repaintLink, onData:onData, boot:boot,
           refreshTeams:refreshTeams, copyLink:copyLink, renderMe:renderMe, loadTeams:loadTeams };
})();

/* ── sign in ── */
async function signIn(){
  var id=$('si-id').value.trim(), pin=$('si-pin').value.trim(), err=$('si-err'); err.style.display='none';
  if(!id||!pin){ err.style.display='block'; err.textContent='Enter your Employee ID and PIN.'; return; }
  var b=$('si-go'); b.disabled=true; b.textContent='Signing in…';
  try{
    var d=await jFetch(API+'?id='+encodeURIComponent(id)+'&pin='+encodeURIComponent(pin)+'&_='+Date.now(), 1);
    if(!d||d.error){ err.style.display='block'; err.textContent=(d&&d.error==='WRONG_PIN')?'Incorrect PIN.':'Employee not found.'; b.disabled=false; b.textContent='Sign in'; return; }
    USER={ id:d.employee_id, name:d.full_name||d.employee_id };
    try{ sessionStorage.setItem('clienthub_user', JSON.stringify(USER)); }catch(e){}
    start();
  }catch(e){ err.style.display='block'; err.textContent='Network error — try again.'; }
  b.disabled=false; b.textContent='Sign in';
}
function signOut(){ try{ sessionStorage.removeItem('clienthub_user'); sessionStorage.removeItem('designshopify_user'); sessionStorage.removeItem('ember_user'); }catch(e){} location.href=location.pathname; }
function start(){
  ROLE=OWNER_IDS.indexOf(myId())>=0?'owner':'va';
  try{ fetch(API+'?action=tool_used&employee_id='+encodeURIComponent(USER.id)+'&tool=clients&_='+Date.now()); }catch(_tu){}
  $('signin').classList.add('hide'); $('app').classList.remove('hide');
  HUB.renderMe(); loadNames(); HUB.boot(false);
  try{ SKY.runRestore(); }catch(_sr){}   // a Skyvern scroll timer survives a refresh
  setTimeout(function(){ tbSend(true); }, 2500);
  /* keep the boards fresh: every minute while visible, and on focus */
  setInterval(function(){ if(!document.hidden) HUB.loadAll(); }, 60000);
  setInterval(function(){ if(!document.hidden) HUB.loadTeams(true).then(function(){ HUB.repaint(); }); }, 10*60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) HUB.loadAll(); });
  window.addEventListener('focus', function(){ HUB.loadAll(); });
}

/* SELF-REFRESH — the page watches its own ETag and reloads itself within ~2 minutes of a new version going live
   (waits while a box is open or a field has focus). */
var _pageTag=null;
async function pageWatch(){
  try{
    var r=await fetch(location.pathname+'?w='+Date.now(), { method:'HEAD', cache:'no-store' });
    var tag=r.headers.get('etag')||r.headers.get('last-modified')||''; if(!tag) return;
    if(_pageTag===null){ _pageTag=tag; return; }
    if(tag===_pageTag) return;
    var ae=document.activeElement, typing=ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type!=='checkbox';
    var busy=(($('qcmask')||{}).classList||{ contains:function(){ return false; } }).contains('on') || ($('proof-ov') && $('proof-ov').style.display==='flex') || ($('ima-pf') && $('ima-pf').style.display==='flex') || $('pfx-ov') || typing;
    if(busy) return;
    _pageTag=tag; toast('The Client Hub was updated — refreshing…');
    setTimeout(function(){ try{ var u=new URL(location.href); u.searchParams.set('v', String(Date.now())); location.replace(u.toString()); }catch(e){ location.reload(); } }, 3000);
  }catch(e){}
}
setTimeout(pageWatch, 15000); setInterval(pageWatch, 120000);

/* ── boot: an existing hub session (or one from the old Design & Shopify / Ember pages) skips the sign-in ── */
setTimeout(function(){
  var u=null; try{ u=JSON.parse(sessionStorage.getItem('clienthub_user')||'null')||JSON.parse(sessionStorage.getItem('designshopify_user')||'null')||JSON.parse(sessionStorage.getItem('ember_user')||'null'); }catch(e){}
  if(u && u.id){ USER=u; start(); }
  else { try{ $('si-id').focus(); $('si-pin').addEventListener('keydown', function(e){ if(e.key==='Enter') signIn(); }); $('si-id').addEventListener('keydown', function(e){ if(e.key==='Enter') $('si-pin').focus(); }); }catch(e){} }
}, 0);
</script>
