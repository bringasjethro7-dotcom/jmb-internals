<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JMB Quiz Bee — Podium</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg0:#0b1020;--bg1:#121a30;--ink:#f2f5ff;--ink2:#9fb0d0;--ink3:#5f6f92;--o1:#ff7a29;--o2:#ff5a00;
    --morn:#f9b625;--night:#8a97ff;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
    --green:#34d399;--red:#f87171;--sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--disp:'Sora','Manrope',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);min-height:100vh;
    background:radial-gradient(900px 500px at 15% -10%,rgba(245,158,11,.14),transparent 55%),
      radial-gradient(900px 500px at 90% 110%,rgba(124,140,255,.16),transparent 58%),
      linear-gradient(180deg,var(--bg1),var(--bg0));display:flex;flex-direction:column}
  body.morn{background:radial-gradient(1000px 600px at 50% -10%,rgba(249,182,37,.20),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0))}
  body.night{background:radial-gradient(1000px 600px at 50% -10%,rgba(138,151,255,.22),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0))}
  .wrap{flex:1;display:flex;flex-direction:column;padding:20px 18px;max-width:560px;margin:0 auto;width:100%}
  .brand{text-align:center;font-family:var(--disp);font-size:24px;font-weight:800;margin-bottom:2px}.brand em{font-style:normal;color:var(--o1)}
  .sub{text-align:center;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:20px}
  .scene{display:none;flex:1;flex-direction:column}.scene.active{display:flex}
  label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 7px;display:block}
  input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:600 17px var(--sans);padding:14px 15px;outline:none;resize:none}
  input:focus,textarea:focus{border-color:var(--o1)}
  input.code{text-transform:uppercase;letter-spacing:.2em;text-align:center;font-family:var(--disp);font-weight:800}
  textarea{min-height:190px;line-height:1.7}
  .shifts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sbtn{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 12px;font-size:16px;font-weight:800;color:var(--ink2);cursor:pointer}
  .sbtn svg{width:32px;height:32px}
  .sbtn.morn.on{border-color:var(--morn);color:var(--morn);background:rgba(249,182,37,.14)}
  .sbtn.night.on{border-color:var(--night);color:var(--night);background:rgba(138,151,255,.16)}
  .hint{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:6px}
  .go{width:100%;margin-top:22px;background:linear-gradient(135deg,var(--o1),var(--o2));border:none;border-radius:16px;color:#fff;font:800 19px var(--sans);padding:17px;cursor:pointer;box-shadow:0 10px 30px rgba(255,90,0,.35)}
  .go:disabled{opacity:.4;box-shadow:none}
  .err{color:var(--red);font-size:13px;font-weight:700;text-align:center;margin-top:12px;min-height:16px}

  .topbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:14px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;padding:8px 12px;border-radius:99px;flex-shrink:0}
  .pill.morn{color:var(--morn);background:rgba(249,182,37,.14)} .pill.night{color:var(--night);background:rgba(138,151,255,.16)}
  .pill svg{width:18px;height:18px}
  .tbmeta{flex:1;min-width:0;font-size:12.5px;color:var(--ink2);font-weight:700}
  .editbtn{background:none;border:1px solid var(--line);color:var(--ink3);border-radius:10px;padding:8px 11px;font:700 12px var(--sans);cursor:pointer;flex-shrink:0}

  .waitwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:6px}
  .wbig{font-family:var(--disp);font-size:24px;font-weight:800}
  .wsub{font-size:15px;color:var(--ink2);font-weight:600;max-width:340px;line-height:1.5}
  .pickbanner{display:none;width:100%;text-align:center;border-radius:18px;padding:22px 16px;font-family:var(--disp);font-weight:800;animation:pbpop .5s cubic-bezier(.2,1.3,.3,1) both}
  .pickbanner.on{display:block}
  .pickbanner .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-family:var(--sans);font-weight:800;opacity:.8;margin-bottom:8px}
  .pickbanner .nm{font-size:32px;line-height:1.05}
  body.morn .pickbanner{background:rgba(249,182,37,.16);border:2px solid var(--morn);color:var(--morn)}
  body.night .pickbanner{background:rgba(138,151,255,.18);border:2px solid var(--night);color:var(--night)}
  @keyframes pbpop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  .pulse{font-size:18px;font-weight:800;margin-top:4px}.pulse .d{animation:blink 1.4s infinite}
  .pulse .d:nth-child(2){animation-delay:.2s}.pulse .d:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .qtag{display:inline-block;font-size:11px;font-weight:800;color:var(--o2);background:rgba(255,90,0,.14);border:1px solid rgba(255,90,0,.3);border-radius:99px;padding:4px 10px}
  .qtimer{font-family:var(--disp);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--o1)}
  .qtimer.low{color:var(--red);animation:tp .5s ease infinite;display:inline-block}
  @keyframes tp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .whobar{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:10px}
  .qtext{font-family:var(--disp);font-size:22px;font-weight:800;line-height:1.28;margin-bottom:16px}
  .aopts{display:flex;flex-direction:column;gap:12px}
  .aopt{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 16px;font-size:18px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink);width:100%}
  .aopt .lt{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:18px;font-weight:800;color:var(--ink2);flex-shrink:0}
  .aopt.sel{border-color:var(--o1);background:rgba(255,122,41,.14)}.aopt.sel .lt{background:var(--o1);color:#fff}
  .aopt.correct{border-color:var(--green);background:rgba(52,211,153,.16)}.aopt.correct .lt{background:var(--green);color:#062a1c}
  .aopt.wrong{border-color:var(--red);background:rgba(248,113,113,.14)}.aopt.wrong .lt{background:var(--red);color:#3a0d0d}
  .aopt.lock{pointer-events:none}.aopt.fade{opacity:.4}
  .result{text-align:center;margin-top:16px;font-family:var(--disp);font-size:20px;font-weight:800;min-height:26px}
  .result.win{color:var(--green)}.result.lose{color:var(--red)}.result.wait{color:var(--ink3);font-size:15px;font-family:var(--sans)}
  .endwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
  .endwrap .big{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--o1)}

  @keyframes pin{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
  .q-anim .aopt{animation:pin .42s cubic-bezier(.2,.9,.25,1) both}
  .q-anim .aopt:nth-child(1){animation-delay:.04s}.q-anim .aopt:nth-child(2){animation-delay:.1s}.q-anim .aopt:nth-child(3){animation-delay:.16s}.q-anim .aopt:nth-child(4){animation-delay:.22s}
  .aopt.sel{animation:pop .3s ease}.aopt.wrong{animation:shake .5s ease}
  #muteBtn{position:fixed;top:10px;right:10px;z-index:50;background:var(--card);border:1px solid var(--line);color:var(--ink3);font:700 11px var(--sans);padding:7px 11px;border-radius:99px;cursor:pointer}
</style>
</head>
<body>
<button id="muteBtn" onclick="toggleMute()">♪ Sound</button>
<div class="wrap">
  <div class="brand">JMB <em>Quiz Bee</em></div>
  <div class="sub" id="subline">Podium device</div>

  <!-- SETUP: side (if not from QR) + roster -->
  <div class="scene active" id="sc-setup">
    <div id="pick-side" style="display:none">
      <label>Room code</label>
      <input class="code" id="in-room" maxlength="4" placeholder="ABCD" autocomplete="off">
      <label>This device is the…</label>
      <div class="shifts">
        <button class="sbtn morn" id="sb-morn" onclick="pickShift('morn')"><span id="ic-morn"></span>Morning</button>
        <button class="sbtn night" id="sb-night" onclick="pickShift('night')"><span id="ic-night"></span>Night</button>
      </div>
    </div>
    <label id="rosterlbl">Your shift's players — one name per line</label>
    <textarea id="roster" placeholder="Juan Dela Cruz&#10;Maria Santos&#10;Pedro Reyes&#10;…"></textarea>
    <div class="hint" id="rostercount">0 players</div>
    <button class="go" id="goBtn" onclick="doConnect()">Connect podium</button>
    <div class="err" id="err"></div>
  </div>

  <!-- GAME -->
  <div class="scene" id="sc-game">
    <div class="topbar">
      <span class="pill" id="pill"></span>
      <span class="tbmeta" id="tbmeta">—</span>
      <button class="editbtn" onclick="editRoster()">Edit list</button>
    </div>

    <div class="waitwrap" id="ct-wait">
      <div class="pickbanner" id="pickbanner"><div class="lab" id="pb-lab">Stepping up</div><div class="nm" id="pb-nm"></div></div>
      <div class="wbig" id="w-title">You're the <span id="w-side"></span> podium ✓</div>
      <div class="wsub">When your player is called, they step up and answer here. Get ready…</div>
      <div class="pulse">Waiting for the host<span class="d">.</span><span class="d">.</span><span class="d">.</span></div>
    </div>

    <div class="scene" id="ct-q" style="flex:1">
      <div class="qhead"><span class="qtag" id="q-tag">1 pt</span><span class="qtimer" id="q-timer">15</span></div>
      <div class="whobar" id="q-who"></div>
      <div class="qtext" id="q-text">—</div>
      <div class="aopts" id="q-opts"></div>
      <div class="result" id="q-result"></div>
    </div>

    <div class="scene" id="ct-end">
      <div class="endwrap"><div class="big">That's a wrap! 🏆</div><div class="wsub">Check the TV for the winning shift and the MVP.</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var SUPA_URL='https://rvyrnkjqxnijxydloujk.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2eXJua2pxeG5panh5ZGxvdWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NzAwODQsImV4cCI6MjA5NzE0NjA4NH0.SwkSkmbeWrhm5PZZDSZ1Z4hbjpQ0L2CRtuKQmpHshBE';
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
el('ic-morn').innerHTML=SUN; el('ic-night').innerHTML=MOON;

/* Sound + haptics */
var _AC=null,_mg=null,_muted=false;
function AC(){ if(!_AC){ try{ _AC=new (window.AudioContext||window.webkitAudioContext)(); _mg=_AC.createGain(); _mg.gain.value=.55; _mg.connect(_AC.destination); }catch(e){} } if(_AC&&_AC.state==='suspended'){ try{_AC.resume();}catch(e){} } return _AC; }
function tone(f,st,d,ty,v){ var c=AC(); if(!c||_muted) return; var o=c.createOscillator(),g=c.createGain(); o.type=ty||'sine'; o.frequency.value=f; var t=c.currentTime+(st||0); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v||.3,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(_mg); o.start(t); o.stop(t+d+.03); }
function noise(d,v,ff){ var c=AC(); if(!c||_muted) return; var n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),da=b.getChannelData(0); for(var i=0;i<n;i++) da[i]=Math.random()*2-1; var s=c.createBufferSource(); s.buffer=b; var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=ff||1200; var g=c.createGain(); var t=c.currentTime; g.gain.setValueAtTime(v||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(f); f.connect(g); g.connect(_mg); s.start(t); s.stop(t+d); }
function vib(p){ try{ if(navigator.vibrate&&!_muted) navigator.vibrate(p); }catch(e){} }
function sfxTap(){ tone(680,0,.09,'square',.22); vib(25); }
function sfxWhoosh(){ noise(.28,.14,800); }
function sfxPing(){ [660,880,1100].forEach(function(f,i){ tone(f,i*.06,.16,'triangle',.24); }); vib([20,30,60]); }
function sfxCorrect(){ [523.25,659.25,783.99,880].forEach(function(f,i){ tone(f,i*.09,.2,'triangle',.32); }); vib([30,40,70]); }
function sfxWrong(){ tone(200,0,.32,'sawtooth',.28); tone(150,.1,.3,'sawtooth',.24); vib(180); }
function sfxTick(){ tone(1400,0,.05,'square',.14); }
function sfxFanfare(){ [[261.63,0],[329.63,.12],[392,.24],[523.25,.36],[392,.5],[523.25,.62]].forEach(function(p){ tone(p[0],p[1],.4,'triangle',.32); }); }
function toggleMute(){ _muted=!_muted; el('muteBtn').textContent=_muted?'♪ Muted':'♪ Sound'; el('muteBtn').style.opacity=_muted?'.5':'1'; }

/* State */
var side=null, ROOM='', supa=null, ch=null, joined=false, roster=[];
var curQ=null, myChoice=null, locked=false, qtimer=null, tleft=15, revealedQi=-1, qStart=0;

/* Read room + side from the QR link */
(function(){ try{ var q=location.search;
  var r=q.match(/room=([A-Za-z0-9]{4})/); if(r) ROOM=r[1].toUpperCase();
  var s=q.match(/side=(morn|night)/); if(s) side=s[1];
}catch(e){} })();

function LT(i){ return String.fromCharCode(65+i); }
function pickShift(x){ side=x; el('sb-morn').classList.toggle('on',x==='morn'); el('sb-night').classList.toggle('on',x==='night'); }
function parseRoster(){ return (el('roster').value||'').split(/[\n,]/).map(function(n){return n.trim();}).filter(Boolean); }
el('roster').addEventListener('input',function(){ var n=parseRoster().length; el('rostercount').textContent=n+' player'+(n===1?'':'s'); });

function initSetup(){
  if(side){ el('pick-side').style.display='none'; el('subline').textContent=(side==='morn'?'Morning podium':'Night podium'); document.body.classList.add(side); }
  else { el('pick-side').style.display='block'; if(ROOM) el('in-room').value=ROOM; }
}
initSetup();

function doConnect(){
  if(!side){ side=null; if(el('sb-morn').classList.contains('on')) side='morn'; else if(el('sb-night').classList.contains('on')) side='night'; }
  if(!side){ el('err').textContent='Pick this device\'s shift first.'; return; }
  if(!ROOM){ ROOM=(el('in-room').value||'').trim().toUpperCase(); }
  if(ROOM.length!==4){ el('err').textContent='Enter the 4-letter room code from the TV.'; return; }
  roster=parseRoster();
  if(!roster.length){ el('err').textContent='Add at least one player name.'; return; }
  AC(); sfxTap(); el('goBtn').disabled=true; el('err').textContent='Connecting…'; document.body.classList.add(side);
  if(ch){ enterGame(); return; }     // already connected → just resubmit roster
  try{ supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);
    ch=supa.channel('quizbee-'+ROOM,{config:{broadcast:{self:false}}});
    ch.on('broadcast',{event:'host'},function(){ if(!joined){ joined=true; enterGame(); } });
    ch.on('broadcast',{event:'pick'},function(m){ onPick(m.payload||{}); });
    ch.on('broadcast',{event:'q'},function(m){ onQ(m.payload||{}); });
    ch.on('broadcast',{event:'reveal'},function(m){ onReveal(m.payload||{}); });
    ch.on('broadcast',{event:'ended'},function(){ onEnded(); });
    ch.on('broadcast',{event:'reset'},function(){ onReset(); });
    ch.subscribe(function(st){ if(st==='SUBSCRIBED'){ sendJoin(); sendRoster(); setTimeout(function(){ if(!joined){ joined=true; enterGame(); } },2500); } });
  }catch(e){ el('err').textContent='Connection failed. Check your internet and retry.'; el('goBtn').disabled=false; }
}
function bc(ev,p){ try{ if(ch) ch.send({type:'broadcast',event:ev,payload:p||{}}); }catch(e){} }
function sendJoin(){ bc('join',{side:side}); }
function sendRoster(){ bc('roster',{side:side,names:roster}); }

function showScene(id){ ['sc-setup','sc-game'].forEach(function(s){ el(s).classList.toggle('active',s===id); }); }
function showContent(id){ ['ct-wait','ct-q','ct-end'].forEach(function(s){ el(s).style.display=(s===id?'flex':'none'); el(s).classList.toggle('active',s===id); }); }

function enterGame(){ el('goBtn').disabled=false; el('err').textContent='';
  el('pill').className='pill '+side; el('pill').innerHTML=(side==='morn'?SUN:MOON)+(side==='morn'?'Morning':'Night');
  el('tbmeta').textContent=roster.length+' player'+(roster.length===1?'':'s')+' · Room '+ROOM;
  el('w-side').textContent=(side==='morn'?'Morning':'Night');
  showScene('sc-game'); showContent('ct-wait'); }
function editRoster(){ el('goBtn').textContent='Update & reconnect'; showScene('sc-setup'); }

/* who steps up this round */
function onPick(p){ if(!p) return; var banner=el('pickbanner');
  if(p.final){ banner.className='pickbanner on'; el('pb-lab').textContent='Final round'; el('pb-nm').textContent='👥 Whole team — decide together!'; }
  else { var nm=(side==='morn'?p.morn:p.night); if(nm){ banner.className='pickbanner on'; el('pb-lab').textContent='Step up & answer'; el('pb-nm').textContent='🎤 '+nm; } else { banner.className='pickbanner'; } }
  showContent('ct-wait'); sfxPing(); vib([30,50,90]); }

function onQ(p){ if(!p||p.qi==null) return; curQ=p; myChoice=null; locked=false; revealedQi=-1; qStart=Date.now();
  el('q-tag').textContent=(p.diff?p.diff+' · ':'')+(p.pts||1)+' pt'+((p.pts||1)>1?'s':'')+' · '+(p.tag||'');
  el('q-who').textContent = p.final ? '👥 Whole team decides' : ((side==='morn'?p.morn:p.night) ? ('🎤 '+(side==='morn'?p.morn:p.night)+' answering') : '');
  el('q-text').textContent=p.q; el('q-result').textContent=''; el('q-result').className='result';
  var opts=p.o||[];
  el('q-opts').innerHTML=opts.map(function(o,i){ return '<button class="aopt" id="a-'+i+'" onclick="answer('+i+')"><span class="lt">'+LT(i)+'</span><span>'+esc(o)+'</span></button>'; }).join('');
  showContent('ct-q'); sfxWhoosh(); var sc=el('ct-q'); sc.classList.remove('q-anim'); void sc.offsetWidth; sc.classList.add('q-anim');
  startT(p.dur||15); }
function startT(d){ tleft=d; el('q-timer').textContent=tleft; el('q-timer').classList.remove('low'); clearInterval(qtimer);
  qtimer=setInterval(function(){ tleft--; el('q-timer').textContent=Math.max(0,tleft); if(tleft<=5) el('q-timer').classList.add('low');
    if(tleft<=3&&tleft>0){ sfxTick(); vib(25); }
    if(tleft<=0){ clearInterval(qtimer); lockAll(); if(myChoice==null){ el('q-result').className='result wait'; el('q-result').textContent="Time's up — waiting for reveal…"; } } },1000); }
function answer(i){ if(locked||!curQ) return; myChoice=i; locked=true; sfxTap(); var t=Date.now()-qStart;
  for(var k=0;k<(curQ.o||[]).length;k++){ var b=el('a-'+k); if(!b) continue; b.classList.add('lock'); if(k===i) b.classList.add('sel'); else b.classList.add('fade'); }
  el('q-result').className='result wait'; el('q-result').textContent='Locked in ✓  ('+(t/1000).toFixed(1)+'s)';
  bc('answer',{side:side,qi:curQ.qi,choice:i,t:t}); }
function lockAll(){ locked=true; for(var k=0;k<(curQ&&curQ.o?curQ.o.length:0);k++){ var b=el('a-'+k); if(b) b.classList.add('lock'); } }

function onReveal(p){ if(!curQ||p==null||p.qi!==curQ.qi||revealedQi===p.qi) return; revealedQi=p.qi; clearInterval(qtimer); lockAll(); var c=p.correct;
  for(var k=0;k<(curQ.o||[]).length;k++){ var b=el('a-'+k); if(!b) continue; b.classList.remove('fade','sel');
    if(k===c) b.classList.add('correct'); else if(k===myChoice) b.classList.add('wrong'); else b.classList.add('fade'); }
  if(myChoice===c){ sfxCorrect(); el('q-result').className='result win'; el('q-result').textContent='Correct! ✓'; }
  else if(myChoice==null){ sfxWrong(); el('q-result').className='result lose'; el('q-result').textContent='No answer'; }
  else{ sfxWrong(); el('q-result').className='result lose'; el('q-result').textContent='Not this time'; }
  el('pickbanner').className='pickbanner'; }
function onEnded(){ clearInterval(qtimer); showContent('ct-end'); sfxFanfare(); vib([40,60,40,60,120]); }
function onReset(){ curQ=null; myChoice=null; locked=false; el('pickbanner').className='pickbanner'; showContent('ct-wait'); }
</script>
